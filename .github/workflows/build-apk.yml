name: Build Standalone WebView APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Capacitor & Generate Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Spell Blaster" "com.spellblaster.app" --web-dir "."
          npx cap add android
          
          # アプリアイコンを適用
          if [ -f "icon-512.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Build Standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpellBlaster-Standalone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
