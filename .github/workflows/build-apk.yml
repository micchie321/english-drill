name: Build Standalone WebView APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Web Assets & Generate Capacitor Project
        run: |
          # 1. 公開用 www フォルダを作成してアセットをコピー
          mkdir -p www
          cp -r index.html manifest.json sw.js icon-192.png icon-512.png css src *.csv www/ 2>/dev/null || true
          
          # 2. Capacitor 初期化
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Spell Blaster" "com.spellblaster.app" --web-dir "www"
          npx cap add android
          npx cap copy android

          # 3. Kotlin の重複クラスエラー（Duplicate class）対策を追記
          echo "subprojects { configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) { details.useVersion '1.8.22' } } } }" >> android/build.gradle
          
          # 4. アプリアイコンをネイティブ側に適用
          if [ -f "icon-512.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Build Standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpellBlaster-Standalone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
