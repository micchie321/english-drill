name: Build Standalone WebView APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Web Assets & Generate Capacitor Project
        run: |
          # 1. 公開用 www フォルダを作成
          mkdir -p www
          
          # 2. Webアセットをコピー (※APK内での二重キャッシュ事故を防ぐため sw.js は意図的に除外)
          cp index.html manifest.json icon-192.png icon-512.png www/ 2>/dev/null || true
          
          # 3. Capacitor 初期化
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Spell Blaster" "com.spellblaster.app" --web-dir "www"
          npx cap add android
          npx cap copy android

          # 4. Kotlin 重複クラスエラー（Duplicate class）対策を追記
          echo "subprojects { configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) { details.useVersion '1.8.22' } } } }" >> android/build.gradle
          
          # 5. バージョン番号（versionCode）を自動インクリメント（上書き更新に必須）
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle

          # 6. アプリアイコンをネイティブ側に適用
          if [ -f "icon-512.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Build Standalone Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK with Fixed Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # キーストアファイルを復元
          echo "$SIGNING_KEY" | base64 -d > release.jks

          # 最新の build-tools 内の apksigner を探して署名
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using apksigner from: $BUILD_TOOLS_DIR"
          
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out SpellBlaster-Signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellBlaster-Standalone-APK
          path: SpellBlaster-Signed.apk
