// 画面
function App() {
  const [screen, setScreen] = useState('menu');
  const [words, setWords] = useState(() => {
    const loaded = safeStorage.get(STORAGE_KEY_WORDS, null);
    if (!loaded || loaded.length < DEFAULT_VOCABULARY.length || loaded.some(w => w.word === 'definitely' || w.word === 'accommodate')) {
      return DEFAULT_VOCABULARY;
    }
    return loaded.map(w => {
      let lvl = w.level || '';
      if (w.id?.startsWith('t1_') || lvl.includes('Level 1') || lvl.includes('Level １')) lvl = 'Level 1';
      else if (w.id?.startsWith('t2_') || lvl.includes('Level 2') || lvl.includes('Level ２')) lvl = 'Level 2';
      else if (w.id?.startsWith('t3_') || lvl.includes('Level 3') || lvl.includes('Level ３')) lvl = 'Level 3';
      else if (w.id?.startsWith('t4_') || lvl.includes('Level 4') || lvl.includes('Level ４')) lvl = 'Level 4';
      else if (w.id?.startsWith('t5_') || lvl.includes('Level 5') || lvl.includes('Level ５')) lvl = 'Level 5';
      return { ...w, level: lvl };
    });
  });

  const [levels, setLevels] = useState(() => {
    const loaded = safeStorage.get(STORAGE_KEY_LEVELS, null);
    if (!loaded || loaded.length === 0 || !loaded.includes('Level 5')) {
      return DEFAULT_LEVELS;
    }
    const set = new Set([...DEFAULT_LEVELS, ...loaded.filter(l => !l.includes('初中級') && !l.includes('上級') && !l.includes('ターゲット'))]);
    return Array.from(set);
  });
  const [stats, setStats] = useState(() => safeStorage.get(STORAGE_KEY_STATS, {}));
  const [dailyLogs, setDailyLogs] = useState(() => safeStorage.get(STORAGE_KEY_DAILY_LOGS, {}));
  const [sessionLogs, setSessionLogs] = useState(() => safeStorage.get(STORAGE_KEY_SESSION_LOGS, []));
  const [logDisplayCount, setLogDisplayCount] = useState(50);

  const [adminPassword, setAdminPassword] = useState(() => safeStorage.get(STORAGE_KEY_ADMIN_PASS, 'admin123'));
  const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
  const [adminInputPass, setAdminInputPass] = useState('');
  const [adminPendingScreen, setAdminPendingScreen] = useState(null);
  const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
  const [adminLoginError, setAdminLoginError] = useState('');

  const [gameData, setGameData] = useState(() => safeStorage.get(STORAGE_KEY_GAME_PROGRESS, {
    gold: 0,
    totalEarned: 0,
    totalCorrectAllTime: 0,
    maxAllTimeCombo: 0,
    totalBossKills: 0,
    equippedTitle: 'かけだしのスペラー',
    shields: 2,
    loginStreakDays: 1,
    lastActiveDate: getLocalDateStr(),
    lastShieldBuyDate: '',
    upgrades: {
      baseRewardLv: 0,
      multiplierBoostLv: 0,
      criticalStrikeLv: 0,
      bossBountyLv: 0,
      feverMasteryLv: 0
    }
  }));

  const [soundEnabled, setSoundEnabled] = useState(() => safeStorage.get(STORAGE_KEY_SOUND, true));
  const [isHintMode, setIsHintMode] = useState(() => safeStorage.get(STORAGE_KEY_HINT_MODE, false));

  // 1セット当たりの問題数 (5, 10, 25, 50, 100)
  const [sessionQuestionCount, setSessionQuestionCountState] = useState(() => {
    const saved = safeStorage.get(STORAGE_KEY_SESSION_QUESTIONS, 10);
    const parsed = Number(saved);
    return [5, 10, 25, 50, 100].includes(parsed) ? parsed : 10;
  });

  const setSessionQuestionCount = (count) => {
    const val = Number(count);
    if ([5, 10, 25, 50, 100].includes(val)) {
      setSessionQuestionCountState(val);
      safeStorage.set(STORAGE_KEY_SESSION_QUESTIONS, val);
    }
  };

  const [selectedLevel, setSelectedLevel] = useState(() => safeStorage.get(STORAGE_KEY_SELECTED_LEVEL, 'Level 1'));

  useEffect(() => {
    if (selectedLevel) {
      safeStorage.set(STORAGE_KEY_SELECTED_LEVEL, selectedLevel);
    }
  }, [selectedLevel]);
  const [quizList, setQuizList] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [inputVal, setInputVal] = useState('');
  const [answerStatus, setAnswerStatus] = useState(null);
  const [sessionResults, setSessionResults] = useState([]);
  const [isWeakMode, setIsWeakMode] = useState(false);
  const [isEndlessMode, setIsEndlessMode] = useState(false);
  const [isFeverMode, setIsFeverMode] = useState(false);
  const [feverMilestone, setFeverMilestone] = useState(null);
  const [isBossQuestion, setIsBossQuestion] = useState(false);
  const [showBossIntro, setShowBossIntro] = useState(false);
  const [currentSessionCombo, setCurrentSessionCombo] = useState(0);
  const [sessionEarnedGold, setSessionEarnedGold] = useState(0);
  const [earnedGoldThisTurn, setEarnedGoldThisTurn] = useState(0);
  const [turnRewardDetail, setTurnRewardDetail] = useState(null);
  const [shieldUsedThisTurn, setShieldUsedThisTurn] = useState(false);
  const [maxEndlessCombo, setMaxEndlessCombo] = useState(0);
  const [showQuitModal, setShowQuitModal] = useState(false);
  const [showCheatModal, setShowCheatModal] = useState(false);

  const [questionStartTime, setQuestionStartTime] = useState(0);
  const [isSpeedBonus, setIsSpeedBonus] = useState(false);
  const [cheatAlertMsg, setCheatAlertMsg] = useState('');
  const [recentAnsweredWordIds, setRecentAnsweredWordIds] = useState([]);
  // セッションを跨いだ直近出題単語のクールダウン履歴（最大40件・偏り防止用）
  const [recentGlobalWordIds, setRecentGlobalWordIds] = useState(() => {
    try {
      const saved = sessionStorage.getItem('spell_blaster_recent_global_words');
      return saved ? JSON.parse(saved) : [];
    } catch (e) {
      return [];
    }
  });

  const [toastNotice, setToastNotice] = useState(null);

  const [reviewList, setReviewList] = useState([]);
  const [reviewIndex, setReviewIndex] = useState(0);
  const [reviewStep, setReviewStep] = useState(0);
  const [isReviewCompleted, setIsReviewCompleted] = useState(false);

  const [statsFilter, setStatsFilter] = useState('all');
  const [statsSearch, setStatsSearch] = useState('');

  const [targetLevelForImport, setTargetLevelForImport] = useState(levels[0] || 'デフォルト');
  const [customLevelInput, setCustomLevelInput] = useState('');
  const [csvText, setCsvText] = useState('');
  const [importError, setImportError] = useState('');
  const [backupStatus, setBackupStatus] = useState('');
  const [newLevelName, setNewLevelName] = useState('');
  const [newAdminPassInput, setNewAdminPassInput] = useState('');

  const inputRef = useRef(null);
  const timerRef = useRef(null);

  // ストレージ同期
  useEffect(() => { safeStorage.set(STORAGE_KEY_WORDS, words); }, [words]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_LEVELS, levels); }, [levels]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_STATS, stats); }, [stats]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_GAME_PROGRESS, gameData); }, [gameData]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_DAILY_LOGS, dailyLogs); }, [dailyLogs]);
  useEffect(() => {
    const trimmed = sessionLogs.length > MAX_SESSION_LOGS_COUNT ? sessionLogs.slice(0, MAX_SESSION_LOGS_COUNT) : sessionLogs;
    safeStorage.set(STORAGE_KEY_SESSION_LOGS, trimmed);
  }, [sessionLogs]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_ADMIN_PASS, adminPassword); }, [adminPassword]);
  useEffect(() => {
    safeStorage.set(STORAGE_KEY_SOUND, soundEnabled);
    SoundFX.setEnabled(soundEnabled);
    if (!soundEnabled && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }, [soundEnabled]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_HINT_MODE, isHintMode); }, [isHintMode]);

  // デイリーボーナス判定（ログインストリーク・シールド回復）
  useEffect(() => {
    const todayStr = getLocalDateStr();
    const lastDate = gameData.lastActiveDate;
    if (lastDate !== todayStr) {
      const last = new Date(lastDate);
      const today = new Date(todayStr);
      const diffDays = Math.ceil(Math.abs(today - last) / (1000 * 60 * 60 * 24));

      let updatedStreak = gameData.loginStreakDays || 1;
      if (diffDays === 1) updatedStreak += 1;
      else if (diffDays > 1) updatedStreak = 1;

      const updatedShields = Math.min(5, (gameData.shields || 0) + 1);

      setGameData(prev => ({
        ...prev,
        loginStreakDays: updatedStreak,
        lastActiveDate: todayStr,
        shields: updatedShields
      }));
    }
  }, []);

  // セッション終了時の実績判定・紙吹雪
  useEffect(() => {
    if (screen === 'result' && sessionResults.length > 0) {
      const correctCount = sessionResults.filter(r => r.isCorrect).length;
      const scorePercent = Math.round((correctCount / sessionResults.length) * 100);

      let extraPerfectSP = 0;
      if (scorePercent === 100) {
        cyberEffects.perfect();
        const perfectLv = gameData.upgrades?.perfectBountyLv || 0;
        if (perfectLv > 0) {
          const count = sessionResults.length;
          let scale = 10000;
          if (count <= 5) scale = 3000;
          else if (count <= 10) scale = 10000;
          else if (count <= 25) scale = 30000;
          else if (count <= 50) scale = 80000;
          else scale = 250000;
          extraPerfectSP = perfectLv * scale;
          setGameData(p => ({
            ...p,
            gold: (p.gold || 0) + extraPerfectSP,
            totalEarned: (p.totalEarned || 0) + extraPerfectSP
          }));
          setToastNotice(`✨ PERFECT EXCEED! +${formatScore(extraPerfectSP)} SP!`);
          setTimeout(() => setToastNotice(null), 3000);
        }
      }

      // セット完了クリアボーナスの付与 (エンドレス以外)
      if (!isEndlessMode) {
        const clearBonusRes = calculateClearBonus(sessionResults.length, correctCount, gameData.upgrades, sessionEarnedGold);
        if (clearBonusRes.totalBonus > 0) {
          setGameData(p => ({
            ...p,
            gold: (p.gold || 0) + clearBonusRes.totalBonus,
            totalEarned: (p.totalEarned || 0) + clearBonusRes.totalBonus
          }));
          setToastNotice(`🎉 CLEAR BONUS! +${formatScore(clearBonusRes.totalBonus)} SP!`);
          setTimeout(() => setToastNotice(null), 3000);
        }
      }

      const sessionMaxCombo = maxEndlessCombo || currentSessionCombo;
      const todayStr = getLocalDateStr();
      setDailyLogs(prev => {
        const currentDaily = prev[todayStr] || { answered: 0, correct: 0, earnedGold: 0 };
        return {
          ...prev,
          [todayStr]: {
            answered: currentDaily.answered + sessionResults.length,
            correct: currentDaily.correct + correctCount,
            earnedGold: currentDaily.earnedGold + sessionEarnedGold
          }
        };
      });

      const newLog = {
        id: 'log_' + Date.now(),
        date: new Date().toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
        mode: isEndlessMode ? 'エンドレス' : isWeakMode ? '苦手特訓' : `${sessionResults.length}問ドリル`,
        level: selectedLevel === 'ALL' ? '全レベル' : selectedLevel,
        total: sessionResults.length,
        correct: correctCount,
        accuracy: scorePercent,
        earnedGold: sessionEarnedGold,
        maxCombo: sessionMaxCombo
      };
      setSessionLogs(prev => [newLog, ...prev]);

      setGameData(prev => ({
        ...prev,
        maxAllTimeCombo: Math.max(prev.maxAllTimeCombo || 0, sessionMaxCombo)
      }));
    }
  }, [screen]);

  // フォーカス制御 (quiz & review画面の両方に対応)
  useEffect(() => {
    if ((screen === 'quiz' || screen === 'review') && answerStatus === null) {
      const timer = setTimeout(() => { inputRef.current?.focus(); }, 50);
      return () => clearTimeout(timer);
    }
  }, [screen, currentIndex, reviewIndex, reviewStep, answerStatus]);

  useEffect(() => {
    if ((screen === 'quiz' || screen === 'review') && answerStatus === 'incorrect') {
      const timer = setTimeout(() => { inputRef.current?.focus(); }, 50);
      return () => clearTimeout(timer);
    }
  }, [screen, answerStatus]);

  useEffect(() => {
    if (screen === 'review') {
      const timer = setTimeout(() => { inputRef.current?.focus(); }, 50);
      return () => clearTimeout(timer);
    }
  }, [screen, reviewIndex, reviewStep]);

  // 単語マスター状態判定
  const getMasteryType = useCallback((wordId) => {
    const st = stats[wordId];
    if (!st || st.streak < 3) return 'unmastered';
    return (st.wrong || 0) === 0 ? 'pure' : 'survivor';
  }, [stats]);

  // 忘却曲線の期日到来判定
  const isReviewDue = useCallback((wordId) => {
    const st = stats[wordId];
    if (!st || !st.nextReviewDate) return false;
    return new Date(st.nextReviewDate) <= new Date();
  }, [stats]);

  const totalMasteredWords = useMemo(() => words.filter(w => (stats[w.id]?.streak || 0) >= 3).length, [words, stats]);

  const unlockedBadges = useMemo(() => {
    const totalUpgradeCount = Object.values(gameData.upgrades || {}).reduce((sum, v) => sum + (v || 0), 0);
    const hasAnyMaxUpgrade = Object.entries(gameData.upgrades || {}).some(([k, lv]) => {
      const upg = UPGRADES_CONFIG.find(u => u.key === k);
      return upg && lv >= upg.maxLevel;
    });

    return BADGES_CONFIG.filter(b => {
      if (b.category === 'streak') return (gameData.maxAllTimeCombo || 0) >= b.req;
      if (b.category === 'master') return totalMasteredWords >= b.req;
      if (b.category === 'boss') return (gameData.totalBossKills || 0) >= b.req;
      if (b.category === 'days') return (gameData.loginStreakDays || 1) >= b.req;
      if (b.category === 'total_correct') return (gameData.totalCorrectAllTime || 0) >= b.req;
      if (b.category === 'gold') return (gameData.totalEarned || 0) >= b.req;
      if (b.category === 'jackpot') return (gameData.totalJackpots || 0) >= b.req;
      if (b.category === 'chest') return (gameData.chestOpens || 0) >= b.req;
      if (b.category === 'mega_chest') return (gameData.megaChestOpens || 0) >= b.req;
      if (b.category === 'giga_chest') return (gameData.gigaChestOpens || 0) >= b.req;
      if (b.category === 'upgrade_max') return hasAnyMaxUpgrade;
      if (b.category === 'upgrade_total') return totalUpgradeCount >= b.req;
      if (b.category === 'transcendence') return (gameData.upgrades?.transcendenceCoreLv || 0) >= b.req;
      if (b.category === 'fever') return (gameData.maxFeverCombo || 0) >= b.req;
      return false;
    });
  }, [gameData, totalMasteredWords]);

  // 管理者認証
  const requireAdmin = (targetScreen) => {
    if (isAdminAuthenticated) {
      setScreen(targetScreen);
    } else {
      setAdminPendingScreen(targetScreen);
      setAdminLoginError('');
      setAdminInputPass('');
      setShowAdminLoginModal(true);
    }
  };

  const handleAdminAuthSubmit = (e) => {
    e.preventDefault();
    if (adminInputPass === adminPassword) {
      setIsAdminAuthenticated(true);
      setShowAdminLoginModal(false);
      if (adminPendingScreen) setScreen(adminPendingScreen);
    } else {
      setAdminLoginError('パスワードが違います');
    }
  };

  // 高精度 Fisher-Yates シャッフル（均等な一様ランダム順列生成）
  const shuffleArray = (array) => {
    if (!array || array.length <= 1) return [...(array || [])];
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  // フィーバーモード用：自然に苦手・誤答回数の多い単語を挟み込むサドンデス出題キュー生成（多様性最大化）
  const generateFeverQuizList = (candidateWords, statsData, count = 45, cooldownIds = []) => {
    if (!candidateWords || candidateWords.length === 0) return [];

    const cooldownSet = new Set(candidateWords.length >= 15 ? cooldownIds.slice(-25) : []);

    // 各単語の危険度スコア（苦手度・誤答度）を計算しつつ、直近出題クールダウンを反映
    const scored = candidateWords.map(w => {
      const st = statsData?.[w.id] || { tested: 0, wrong: 0, streak: 0 };
      const isRecent = cooldownSet.has(w.id);
      const dangerScore = ((st.wrong || 0) * 10) +
                          (st.streak === 0 && (st.tested || 0) > 0 ? 15 : 0) +
                          (Math.max(0, 3 - (st.streak || 0)) * 3) +
                          ((st.tested || 0) === 0 ? 4 : 0) -
                          (isRecent ? 20 : 0);
      return { ...w, dangerScore, isRecent };
    });

    // 危険度順にソートし、上位の苦手プールを作成
    const sortedByDanger = [...scored].sort((a, b) => b.dangerScore - a.dangerScore);
    const hardPool = sortedByDanger.filter(w => w.dangerScore >= 4);
    const rawDangerCandidates = hardPool.length >= 3 ? hardPool : sortedByDanger.slice(0, Math.max(3, Math.ceil(sortedByDanger.length * 0.4)));

    // ★重要：苦手候補リスト自体を Fisher-Yates でシャッフル！固定順序での出題を完全撤廃
    const dangerCandidates = shuffleArray(rawDangerCandidates);

    // 通常枠プールも直近クールダウンを考慮した上で Fisher-Yates シャッフル
    const freshNormal = candidateWords.filter(w => !cooldownSet.has(w.id));
    const normalPool = shuffleArray(freshNormal.length >= 10 ? freshNormal : candidateWords);

    const result = [];
    let dangerIdx = 0;
    let normalIdx = 0;

    // 2〜3問ごとのゆらぎ（ジッター: 2問または3問おき）で自然に難問を配置
    let nextTrapAt = 2 + Math.floor(Math.random() * 2);

    for (let i = 0; i < count; i++) {
      if (i === nextTrapAt && dangerCandidates.length > 0) {
        const trapWord = dangerCandidates[dangerIdx % dangerCandidates.length];
        dangerIdx++;
        result.push({
          ...trapWord,
          isFeverTrap: true,
          isDueRevenge: false
        });
        nextTrapAt = i + 2 + Math.floor(Math.random() * 2);
      } else {
        const normalWord = normalPool[normalIdx % normalPool.length];
        normalIdx++;
        result.push({
          ...normalWord,
          isFeverTrap: false
        });
      }
    }

    return result;
  };

  // クイズ開始
  const startQuiz = (mode = 'normal', customList = null) => {
    let pool = [];
    const candidateWords = selectedLevel === 'ALL'
      ? words
      : words.filter(w => (w.level || 'デフォルト') === selectedLevel);

    const targetCount = sessionQuestionCount;
    if (customList) {
      pool = customList;
    } else if (mode === 'fever') {
      // フィーバーモード：直近クールダウンを考慮し、苦手単語もシャッフルして出題
      pool = generateFeverQuizList(candidateWords, stats, 45, recentGlobalWordIds);
    } else if (mode === 'weak') {
      const dueBossWords = candidateWords.filter(w => getMasteryType(w.id) === 'survivor' && isReviewDue(w.id));
      const scored = candidateWords.map(w => {
        const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
        const isDue = dueBossWords.some(b => b.id === w.id);
        const isRecent = recentGlobalWordIds.slice(-15).includes(w.id);
        const score = (st.wrong * 4) + (st.tested === 0 ? 5 : 0) + (isDue ? 12 : 0) + (3 - Math.min(st.streak, 3)) * 2 - (isRecent ? 10 : 0);
        return { ...w, priorityScore: score, isDueRevenge: isDue };
      });
      const weakPool = scored.filter(w => w.streak < 3 || w.wrong > 0 || w.isDueRevenge);
      const targetPool = weakPool.length >= targetCount ? weakPool : scored;
      const sortedPool = [...targetPool].sort((a, b) => b.priorityScore - a.priorityScore);
      let picked = sortedPool.slice(0, Math.min(sortedPool.length, targetCount * 2));
      pool = shuffleArray(picked).slice(0, targetCount);
    } else {
      // 通常モード：全単語が満遍なく循環する多様性最大化アルゴリズム
      const cooldownSet = new Set(candidateWords.length >= targetCount * 2 ? recentGlobalWordIds.slice(-30) : []);

      // 1. 忘却曲線復習ボス枠 (最大15%)
      const allDueBosses = shuffleArray(
        candidateWords.filter(w => getMasteryType(w.id) === 'survivor' && isReviewDue(w.id) && !cooldownSet.has(w.id))
      ).map(w => ({ ...w, isDueRevenge: true }));
      const maxBosses = Math.min(allDueBosses.length, Math.floor(targetCount * 0.15) || 1);
      const dueBossWords = allDueBosses.slice(0, maxBosses);

      const nonBosses = candidateWords.filter(w => !dueBossWords.some(b => b.id === w.id));

      // 2. 未学習単語枠（まだ解いていない単語を発掘）
      const unvisitedWords = shuffleArray(nonBosses.filter(w => (stats[w.id]?.tested || 0) === 0 && !cooldownSet.has(w.id)));

      // 3. 復習・苦手単語枠（ミスありまたはストリーク不足）
      const weakWords = shuffleArray(nonBosses.filter(w => (stats[w.id]?.tested || 0) > 0 && (stats[w.id]?.streak || 0) < 3 && !cooldownSet.has(w.id)));

      // 4. 一般プール（その他の新鮮な単語）
      const otherFresh = shuffleArray(nonBosses.filter(w => !cooldownSet.has(w.id)));

      // 5. クールダウン済み単語（候補が足りない場合のフォールバック）
      const fallbackWords = shuffleArray(nonBosses.filter(w => cooldownSet.has(w.id)));

      const needed = targetCount - dueBossWords.length;
      const countUnvisited = Math.min(unvisitedWords.length, Math.ceil(needed * 0.35));
      const countWeak = Math.min(weakWords.length, Math.ceil(needed * 0.35));

      const picks = [
        ...unvisitedWords.slice(0, countUnvisited),
        ...weakWords.slice(0, countWeak)
      ];

      const remainingNeeded = needed - picks.length;
      const pickIds = new Set(picks.map(p => p.id));
      const freshPool = otherFresh.filter(w => !pickIds.has(w.id));
      picks.push(...freshPool.slice(0, remainingNeeded));

      if (picks.length < needed) {
        const stillNeeded = needed - picks.length;
        const currentIds = new Set(picks.map(p => p.id));
        const fallbacks = fallbackWords.filter(w => !currentIds.has(w.id));
        picks.push(...fallbacks.slice(0, stillNeeded));
      }

      // ボスと通常単語を合体し、Fisher-Yates で完全シャッフル
      pool = shuffleArray([...dueBossWords, ...picks]);
    }

    const selected = (mode === 'endless') ? shuffleArray(pool) : pool;
    if (selected.length === 0) {
      alert('出題可能な単語がありません');
      return;
    }

    setIsWeakMode(mode === 'weak');
    setIsEndlessMode(mode === 'endless');
    setIsFeverMode(mode === 'fever');
    if (mode === 'fever') {
      setIsHintMode(false);
    }
    const feverHeadstartLv = (mode === 'fever') ? (gameData.mpUpgrades?.feverHeadstartLv || 0) : 0;
    const initialCombo = feverHeadstartLv * 3;
    if (mode === 'fever') {
      setCurrentSessionCombo(initialCombo);
    }
    setQuizList(selected);
    setCurrentIndex(0);
    setInputVal('');
    setAnswerStatus(null);
    setSessionResults([]);
    setIsReviewCompleted(false);
    // セット区切りでコンボ(Fever)を途切れさせず維持！
    setSessionEarnedGold(0);
    setEarnedGoldThisTurn(0);
    setTurnRewardDetail(null);
    setShieldUsedThisTurn(false);
    setMaxEndlessCombo(0);
    setShowQuitModal(false);
    setShowCheatModal(false);
    setRecentAnsweredWordIds([]);
    setCheatAlertMsg('');
    setToastNotice(null);

    setFeverMilestone(null);
    const firstWord = selected[0];
    const isBoss = (mode !== 'fever') && !!firstWord?.isDueRevenge;
    setIsBossQuestion(isBoss);
    setShowBossIntro(isBoss);

    if (isBoss) {
      SoundFX.vibrate([300, 100, 300]);
      SoundFX.playBossAlarm();
      setTimeout(() => setShowBossIntro(false), 1600);
    }

    setQuestionStartTime(Date.now() + (isBoss ? 1600 : 0));
    setScreen('quiz');
  };

  // 次の問題へ
  const handleNextQuestion = useCallback(() => {
    if (isFeverMode) {
      // フィーバーモードは残りが少なくなったら苦手トラップ混じりのリストを補充
      if (currentIndex + 5 >= quizList.length) {
        const candidateWords = selectedLevel === 'ALL' ? words : words.filter(w => (w.level || 'デフォルト') === selectedLevel);
        const refilled = generateFeverQuizList(candidateWords, stats, 30);
        setQuizList(prev => [...prev, ...refilled]);
      }
    } else if (isEndlessMode) {
      if (currentIndex + 1 >= quizList.length) {
        const candidateWords = selectedLevel === 'ALL' ? words : words.filter(w => (w.level || 'デフォルト') === selectedLevel);
        const refilled = shuffleArray(candidateWords);
        setQuizList(prev => [...prev, ...refilled]);
      }
    } else if (currentIndex + 1 >= sessionQuestionCount || currentIndex + 1 >= quizList.length) {
      SoundFX.playVictory();
      setScreen('result');
      return;
    }

    setFeverMilestone(null);
    const nextIndex = currentIndex + 1;
    const nextWord = quizList[nextIndex];
    const isBoss = !isFeverMode && !!nextWord?.isDueRevenge;

    setCurrentIndex(nextIndex);
    setInputVal('');
    setAnswerStatus(null);
    setIsBossQuestion(isBoss);
    setShowBossIntro(isBoss);
    setShowCheatModal(false);
    setCheatAlertMsg('');
    setEarnedGoldThisTurn(0);
    setShieldUsedThisTurn(false);
    setToastNotice(null);

    if (isBoss) {
      SoundFX.vibrate([300, 100, 300]);
      SoundFX.playBossAlarm();
      setTimeout(() => setShowBossIntro(false), 1600);
    }
    setQuestionStartTime(Date.now() + (isBoss ? 1600 : 0));
  }, [currentIndex, isEndlessMode, quizList, words, selectedLevel, sessionQuestionCount]);

  // チート検知（1回の操作で複数文字の入力・予測変換タップ等の検知）
  const handleCheatDetected = useCallback((detectedInput) => {
    if (answerStatus !== null) return;
    const currentWord = quizList[currentIndex];
    if (!currentWord) return;

    setShowCheatModal(true);
    setCheatAlertMsg('🚨 CHEAT 検出: 1回の操作で複数文字の入力を検知（不正解）');

    const trimmedInput = (detectedInput || '').trim();
    setInputVal(trimmedInput);

    // 不正解ペナルティ処理
    setCurrentSessionCombo(0);
    setEarnedGoldThisTurn(0);
    setTurnRewardDetail({ earnedSP: 0, rawSP: 0, isCheatFailed: true });

    SoundFX.vibrate([200, 100, 200, 100, 300]);
    SoundFX.playWrong();
    setAnswerStatus('incorrect');

    // 単語統計データの更新 (不正解として記録、ストリーク0リセット)
    setStats(prev => {
      const st = prev[currentWord.id] || { tested: 0, wrong: 0, streak: 0, reviewStep: 0, nextReviewDate: null };
      return {
        ...prev,
        [currentWord.id]: {
          tested: (st.tested || 0) + 1,
          wrong: (st.wrong || 0) + 1,
          streak: 0,
          reviewStep: 0,
          nextReviewDate: null,
          lastDate: new Date().toISOString()
        }
      };
    });

    // セッション履歴に不正解として追加
    setSessionResults(prev => [...prev, {
      word: currentWord,
      userInput: trimmedInput,
      isCorrect: false,
      isBoss: isBossQuestion,
      justMastered: false,
      earnedSP: 0,
      isCheatDetected: true
    }]);
  }, [answerStatus, currentIndex, isBossQuestion, quizList]);

  // 復習時のチート検知ハンドラ
  const handleReviewCheatDetected = useCallback((detectedInput) => {
    if (answerStatus !== null) return;
    setShowCheatModal(true);
    setInputVal((detectedInput || '').trim());
    SoundFX.vibrate([200, 100, 200, 100, 300]);
    SoundFX.playWrong();
    setAnswerStatus('incorrect');
  }, [answerStatus]);

  // 解答提出
  const handleSubmitAnswer = (e) => {
    e.preventDefault();
    if (answerStatus !== null) return;
    const currentWord = quizList[currentIndex];
    if (!currentWord) return;

    const trimmedInput = inputVal.trim();
    if (!trimmedInput) return;

    const isCorrect = checkAnswerCorrectness(trimmedInput, currentWord.word);
    const answerDuration = Date.now() - questionStartTime;
    const hasInsight = !!gameData.mpUpgrades?.transcendentInsight;
    const speedLimit = hasInsight ? 3000 : 2500;
    const speedBonusQualified = answerDuration <= speedLimit;
    setIsSpeedBonus(speedBonusQualified);

    const isCheated = isCorrect && answerDuration < 600;
    const isRepeatedFarm = recentAnsweredWordIds.slice(-2).includes(currentWord.id);

    if (isCheated) setCheatAlertMsg('⚠️ 即答検知: SP加算&ストリーク無効');
    else if (isRepeatedFarm) setCheatAlertMsg('⚠️ 連続出題ペナルティ (-90% SP)');
    else setCheatAlertMsg('');

    setRecentAnsweredWordIds(prev => [...prev.slice(-4), currentWord.id]);
    setRecentGlobalWordIds(prev => {
      const updated = [...prev.slice(-40), currentWord.id];
      try {
        sessionStorage.setItem('spell_blaster_recent_global_words', JSON.stringify(updated));
      } catch (e) {}
      return updated;
    });

    const prevStat = stats[currentWord.id] || { tested: 0, wrong: 0, streak: 0, reviewStep: 0, nextReviewDate: null };
    const oldStreak = prevStat.streak || 0;
    // HINTモード中は単語ストリーク上限2（マスター不可）。通常時は3以上でマスター。
    const newStreak = isCorrect ? (isCheated ? oldStreak : isHintMode ? Math.min(2, oldStreak + 1) : oldStreak + 1) : 0;
    const justMastered = !isHintMode && oldStreak < 3 && newStreak >= 3;
    const isAlreadyMastered = oldStreak >= 3 && !isBossQuestion;

    let shieldSaved = false;
    if (!isCorrect && (gameData.shields || 0) > 0) {
      shieldSaved = true;
      setShieldUsedThisTurn(true);
      setGameData(p => ({ ...p, shields: Math.max(0, p.shields - 1) }));
    }

    let calculatedCombo = currentSessionCombo;
    if (isFeverMode) {
      if (isCorrect && !isCheated) {
        calculatedCombo = currentSessionCombo + 1;
        setCurrentSessionCombo(calculatedCombo);
        setGameData(p => ({
          ...p,
          maxFeverCombo: Math.max(p.maxFeverCombo || 0, calculatedCombo)
        }));
        
        // 10問ごとの派手なフィーバー節目サウンド (10, 20, 30, 40, 50...)
        if (calculatedCombo > 0 && calculatedCombo % 10 === 0) {
          SoundFX.vibrate([150, 80, 150, 80, 400]);
          SoundFX.playJackpot();
          SoundFX.playMastered();
        } else {
          const feverP = getFeverPhase(calculatedCombo);
          if (calculatedCombo === 5 || calculatedCombo === 25 || calculatedCombo === 50) {
            SoundFX.playFeverUp(feverP);
          }
        }
      } else {
        // フィーバーモードはサドンデス（シールドによる救済なし、即終了）
        shieldSaved = false;
        calculatedCombo = 0;
        setCurrentSessionCombo(0);
      }
    } else if (isCorrect) {
      if (!isCheated && !isRepeatedFarm) {
        calculatedCombo = currentSessionCombo + 1;
        setCurrentSessionCombo(calculatedCombo);
        if (isEndlessMode) setMaxEndlessCombo(p => Math.max(p, calculatedCombo));
        const feverP = getFeverPhase(calculatedCombo);
        if (calculatedCombo === 10 || calculatedCombo === 25 || calculatedCombo === 50 || calculatedCombo === 100) {
          SoundFX.playFeverUp(feverP);
        }
      }
    } else {
      calculatedCombo = shieldSaved ? Math.floor(currentSessionCombo / 2) : 0;
      setCurrentSessionCombo(calculatedCombo);
    }

    const todayStr = getLocalDateStr();
    const todayAnswered = dailyLogs[todayStr]?.answered || 0;
    const dailyTier = getDailyOverdriveTier(todayAnswered);

    const rewardResult = calculateReward({
      isCorrect,
      isBoss: isBossQuestion,
      justMastered,
      isAlreadyMastered,
      isFeverMode,
      feverCombo: calculatedCombo,
      currentCombo: calculatedCombo,
      isSpeedBonus: speedBonusQualified,
      isCheated,
      isRepeatedFarm,
      isHintMode: isFeverMode ? false : isHintMode,
      dailyOverdriveMultiplier: dailyTier.multiplier,
      upgrades: { ...gameData.upgrades, ...(gameData.mpUpgrades || {}) }
    });

    let earnedSP = rewardResult.earnedSP;
    if (isGoldenCard) earnedSP *= 3;
    if (alchemyBonusSP > 0) earnedSP += alchemyBonusSP;
    const isJackpot = rewardResult.isJackpot;
    const isCritical = rewardResult.isCritical;

    // 10問ごとの派手なフィーバー節目モーダル演出！
    if (isFeverMode && isCorrect && !isCheated && calculatedCombo > 0 && calculatedCombo % 10 === 0) {
      setFeverMilestone({
        combo: calculatedCombo,
        multiplier: rewardResult.feverModeMultiplier
      });
    }

    setEarnedGoldThisTurn(earnedSP);
    setTurnRewardDetail(rewardResult);

    // ★ 1800単語スケール対応！MP (Mastery Points) 超ワクワク計算
    const isMasterHit = isCorrect && !isCheated && (isAlreadyMastered || justMastered);
    let earnedMP = 0;
    let isGoldenCard = false;
    if (isMasterHit) {
      // 基礎5 MP + スピードボーナス(+5 MP) + 新規マスター祝賀(+50 MP)
      earnedMP = 5;
      if (speedBonusQualified) earnedMP += 5;
      if (justMastered) earnedMP += 50;

      // フィーバーモード高連勝ボーナス（連勝するほどMPが跳ね上がる！）
      if (isFeverMode) {
        if (calculatedCombo >= 100) earnedMP += 100;
        else if (calculatedCombo >= 50) earnedMP += 50;
        else if (calculatedCombo >= 25) earnedMP += 25;
        else if (calculatedCombo >= 10) earnedMP += 10;
      }

      // 黄金単語覚醒マトリクス判定 (確率でSP・MPが3倍！)
      const goldenLv = gameData.mpUpgrades?.goldenCardTransformLv || 0;
      if (goldenLv > 0 && Math.random() < (goldenLv * 0.10)) {
        isGoldenCard = true;
        earnedMP *= 3;
      }
    }

    // 電脳錬金マトリクス (獲得MPに応じて純金SPがダイレクト噴出！)
    const alchemyLv = gameData.mpUpgrades?.cyberAlchemyLv || 0;
    let alchemyBonusSP = 0;
    if (alchemyLv > 0 && earnedMP > 0) {
      alchemyBonusSP = earnedMP * alchemyLv * 1500;
    }

    if (earnedSP > 0 || earnedMP > 0) {
      if (earnedSP > 0) setSessionEarnedGold(prev => prev + earnedSP);
      setGameData(prev => ({
        ...prev,
        gold: (prev.gold || 0) + earnedSP,
        totalEarned: (prev.totalEarned || 0) + earnedSP,
        mp: (prev.mp || 0) + earnedMP,
        totalEarnedMP: (prev.totalEarnedMP || 0) + earnedMP,
        totalCorrectAllTime: isCorrect ? (prev.totalCorrectAllTime || 0) + 1 : prev.totalCorrectAllTime,
        totalBossKills: (isCorrect && isBossQuestion) ? (prev.totalBossKills || 0) + 1 : prev.totalBossKills,
        totalJackpots: isJackpot ? (prev.totalJackpots || 0) + 1 : (prev.totalJackpots || 0)
      }));

      const goldText = isGoldenCard ? ' 💎【GOLDEN CARD 3倍!!】' : '';
      const alchemyText = alchemyBonusSP > 0 ? ` (+${formatScore(alchemyBonusSP)} 錬金SP)` : '';
      const mpSuffix = earnedMP > 0 ? ` 👑 +${earnedMP} MP!${goldText}${alchemyText}` : '';

      if (justMastered) {
        setToastNotice(`👑 WORD MASTERED! 単語【${currentWord.word}】完全習得! +${formatScore(earnedSP)} SP!${mpSuffix}`);
      } else if (isFeverMode) {
        setToastNotice(`🔥 FEVER ${calculatedCombo}連勝! +${formatScore(earnedSP)} SP (×${rewardResult.feverModeMultiplier}倍)${mpSuffix}`);
      } else if (isJackpot) {
        setToastNotice(`🎰 JACKPOT ×${rewardResult.jackpotMult}!! +${formatScore(earnedSP)} SP!${mpSuffix}`);
      } else if (isCritical) {
        setToastNotice(`💥 CRITICAL! +${formatScore(earnedSP)} SP!${mpSuffix}`);
      } else if (isHintMode) {
        setToastNotice(`+${formatScore(earnedSP)} SP (HINT -75%)${mpSuffix}`);
      } else if (rewardResult.isAlreadyMastered) {
        setToastNotice(`+${formatScore(earnedSP)} SP (習得済復習)${mpSuffix}`);
      } else {
        setToastNotice(`+${formatScore(earnedSP)} SP!${mpSuffix}`);
      }
    }

    if (isCorrect) {
      if (justMastered) {
        SoundFX.vibrate([80, 40, 80, 40, 200]);
        SoundFX.playMastered();
        cyberEffects.mastery();
      } else {
        SoundFX.vibrate([30]);
        if (isJackpot) {
          SoundFX.playJackpot();
          cyberEffects.jackpot();
        } else if (isCritical) {
          SoundFX.playCritical();
        } else if (speedBonusQualified) {
          SoundFX.playSpeedBonus();
        } else {
          SoundFX.playCorrect();
        }
      }
      setAnswerStatus('correct');
      speakWord(currentWord.word);
    } else {
      SoundFX.vibrate([100, 50, 150]);
      SoundFX.playWrong();
      setAnswerStatus('incorrect');
    }

    // 単語統計データの更新
    setStats(prev => {
      const st = prev[currentWord.id] || { tested: 0, wrong: 0, streak: 0, reviewStep: 0, nextReviewDate: null };
      let updatedStep = st.reviewStep || 0;
      let updatedNextDate = st.nextReviewDate;

      if (isBossQuestion) {
        if (isCorrect) {
          updatedStep = Math.min(REVIEW_INTERVAL_DAYS.length - 1, updatedStep + 1);
          const nextDays = REVIEW_INTERVAL_DAYS[updatedStep];
          const d = new Date();
          d.setDate(d.getDate() + nextDays);
          updatedNextDate = d.toISOString();
        } else if (!shieldSaved) {
          updatedStep = 0;
          updatedNextDate = null;
        }
      } else if (justMastered) {
        const nextDays = REVIEW_INTERVAL_DAYS[0];
        const d = new Date();
        d.setDate(d.getDate() + nextDays);
        updatedNextDate = d.toISOString();
      }

      const updatedStreakVal = shieldSaved ? Math.max(0, st.streak - 1) : newStreak;

      return {
        ...prev,
        [currentWord.id]: {
          tested: (st.tested || 0) + 1,
          wrong: isCorrect ? (st.wrong || 0) : (st.wrong || 0) + 1,
          streak: updatedStreakVal,
          reviewStep: updatedStep,
          nextReviewDate: updatedNextDate,
          lastDate: new Date().toISOString()
        }
      };
    });

    setSessionResults(prev => [...prev, {
      word: currentWord,
      userInput: trimmedInput,
      isCorrect,
      isBoss: isBossQuestion,
      justMastered: !!justMastered,
      earnedSP
    }]);

    if (isCorrect) {
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
        handleNextQuestion();
      }, 700);
    }
  };

  // リベンジ特訓開始
  const startReview = () => {
    const mistakes = sessionResults.filter(r => !r.isCorrect).map(r => r.word);
    const uniqueMistakes = Array.from(new Map(mistakes.map(w => [w.id, w])).values());
    if (uniqueMistakes.length === 0) return;

    setReviewList(uniqueMistakes);
    setReviewIndex(0);
    setReviewStep(0);
    setInputVal('');
    setAnswerStatus(null);
    setIsReviewCompleted(false);
    setScreen('review');
  };

  // リベンジ特訓 次ステップ (関数型更新でクロージャのズレを完全解消 & 単語長に応じたステップ数)
  const handleNextReviewStep = useCallback(() => {
    setReviewStep(prevStep => {
      const curWord = reviewList[reviewIndex];
      const maxSteps = curWord ? getReviewStepsCount(curWord.word) : 4;
      if (prevStep + 1 < maxSteps) {
        setInputVal('');
        setAnswerStatus(null);
        return prevStep + 1;
      } else {
        // 現在の単語の全ステップ制覇 -> 次の単語へ
        setReviewIndex(prevIdx => {
          if (prevIdx + 1 < reviewList.length) {
            setInputVal('');
            setAnswerStatus(null);
            return prevIdx + 1;
          } else {
            // 全単語の復習コンプリート！
            SoundFX.playVictory();
            setIsReviewCompleted(true);
            setScreen('result');
            // 克服ボーナス +1,000 SP
            setGameData(p => ({
              ...p,
              gold: (p.gold || 0) + 1000,
              totalEarned: (p.totalEarned || 0) + 1000
            }));
            setToastNotice('✨ 復習完全制覇! 克服ボーナス +1,000 SP!');
            setTimeout(() => setToastNotice(null), 3000);
            return 0;
          }
        });
        return 0;
      }
    });
  }, [reviewList, reviewIndex, SoundFX]);

  // リベンジ解答提出 (不正解時の即時リトライ対応)
  const handleSubmitReview = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const currentWord = reviewList[reviewIndex];
    if (!currentWord) return;

    // すでに不正解表示のときに ENTER が押された場合 -> クリアして再挑戦
    if (answerStatus === 'incorrect') {
      setInputVal('');
      setAnswerStatus(null);
      setTimeout(() => inputRef.current?.focus(), 50);
      return;
    }

    const trimmed = inputVal.trim();
    if (!trimmed) return;

    const isCorrect = checkAnswerCorrectness(trimmed, currentWord.word);
    if (isCorrect) {
      SoundFX.vibrate([30]);
      SoundFX.playCorrect();
      setAnswerStatus('correct');
      speakWord(currentWord.word);
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
        handleNextReviewStep();
      }, 650);
    } else {
      SoundFX.vibrate([100, 50, 150]);
      SoundFX.playWrong();
      setAnswerStatus('incorrect');
    }
  };

  // リベンジマスク文字生成 (文字数に応じたステップ数の動的マスク対応 & 記号保持)
  const maskedHint = useMemo(() => {
    if (screen !== 'review' || !reviewList[reviewIndex]) return '';
    const word = formatHintWord(reviewList[reviewIndex].word);
    const len = word.length;
    const maxSteps = getReviewStepsCount(word);

    if (reviewStep === 0) return word;

    const alphaIndices = [];
    for (let i = 0; i < len; i++) {
      if (/[a-zA-Z0-9]/.test(word[i])) {
        alphaIndices.push(i);
      }
    }

    // 最終ステップはノーヒント（全隠れ）
    if (reviewStep >= maxSteps - 1) {
      return word.split('').map(c => /[a-zA-Z0-9]/.test(c) ? '_' : c).join('');
    }

    // 中間ステップのマスク数
    let maskCount = 0;
    if (maxSteps === 3) {
      // 3ステップ（4〜6文字）の中間ステップは半分隠れ
      maskCount = Math.max(1, Math.round(alphaIndices.length * 0.5));
    } else {
      // 4ステップ（7文字以上）の中間ステップ
      maskCount = reviewStep === 1
        ? Math.max(1, Math.floor(alphaIndices.length / 3))
        : Math.max(1, Math.floor((alphaIndices.length * 2) / 3));
    }

    let seed = 0;
    for (let i = 0; i < word.length; i++) seed += word.charCodeAt(i);
    const random = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
    const shuffled = [...alphaIndices].sort(() => random() - 0.5);
    const maskSet = new Set(shuffled.slice(0, maskCount));
    return word.split('').map((char, i) => maskSet.has(i) ? '_' : char).join('');
  }, [screen, reviewList, reviewIndex, reviewStep]);

  // CSVインポート処理
  const handleImportCSV = (textToImport, targetLevel) => {
    try {
      setImportError('');
      const lines = textToImport.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const newEntries = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (i === 0 && (line.toLowerCase().includes('word') || line.includes('単語'))) continue;
        const parts = line.split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
        if (parts.length >= 2) {
          const [w, m, p = '', ex = '', lvl = ''] = parts;
          if (w && m) {
            newEntries.push({
              id: 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
              level: lvl || targetLevel || 'カスタム',
              word: w.toLowerCase(),
              meaning: m,
              pos: p,
              example: ex
            });
          }
        }
      }

      if (newEntries.length === 0) {
        setImportError('インポート可能な単語が見つかりませんでした (例: apple,りんご)');
        return;
      }

      const importedLevels = [...new Set(newEntries.map(e => e.level))];
      setLevels(prev => [...new Set([...prev, ...importedLevels])]);

      setWords(prev => {
        const existingMap = new Set(prev.map(p => p.word.toLowerCase()));
        const filteredNew = newEntries.filter(n => !existingMap.has(n.word));
        return [...prev, ...filteredNew];
      });

      setCsvText('');
      setCustomLevelInput('');
      alert(`${newEntries.length}語を取り込みました！`);
    } catch (err) {
      setImportError('CSV解析エラー: ' + err.message);
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      setCsvText(evt.target.result);
    };
    reader.readAsText(file);
  };

  return (
    <>
      {(() => {
        switch (screen) {
          case 'quiz':
            return (
              <QuizScreen
                turnRewardDetail={turnRewardDetail}
                quizList={quizList}
                currentIndex={currentIndex}
                sessionQuestionCount={sessionQuestionCount}
                isEndlessMode={isEndlessMode}
                isFeverMode={isFeverMode}
                feverMilestone={feverMilestone}
                setFeverMilestone={setFeverMilestone}
                gameData={gameData}
                isBossQuestion={isBossQuestion}
                showBossIntro={showBossIntro}
                toastNotice={toastNotice}
                answerStatus={answerStatus}
                currentSessionCombo={currentSessionCombo}
                sessionEarnedGold={sessionEarnedGold}
                isHintMode={isHintMode}
                setIsHintMode={setIsHintMode}
                inputVal={inputVal}
                setInputVal={setInputVal}
                inputRef={inputRef}
                cheatAlertMsg={cheatAlertMsg}
                showQuitModal={showQuitModal}
                setShowQuitModal={setShowQuitModal}
                showCheatModal={showCheatModal}
                setShowCheatModal={setShowCheatModal}
                handleCheatDetected={handleCheatDetected}
                handleSubmitAnswer={handleSubmitAnswer}
                handleNextQuestion={handleNextQuestion}
                getFeverPhase={getFeverPhase}
                getFeverDetails={getFeverDetails}
                sessionResults={sessionResults}
                setScreen={setScreen}
              />
            );
          case 'review':
            return (
              <ReviewScreen
                reviewList={reviewList}
                reviewIndex={reviewIndex}
                reviewStep={reviewStep}
                toastNotice={toastNotice}
                answerStatus={answerStatus}
                setAnswerStatus={setAnswerStatus}
                inputVal={inputVal}
                setInputVal={setInputVal}
                inputRef={inputRef}
                maskedHint={maskedHint}
                showCheatModal={showCheatModal}
                setShowCheatModal={setShowCheatModal}
                handleCheatDetected={handleReviewCheatDetected}
                handleSubmitReview={handleSubmitReview}
                setScreen={setScreen}
              />
            );
          case 'result':
            return (
              <ResultScreen
                sessionResults={sessionResults}
                maxEndlessCombo={maxEndlessCombo}
                currentSessionCombo={currentSessionCombo}
                sessionEarnedGold={sessionEarnedGold}
                sessionQuestionCount={sessionQuestionCount}
                upgrades={gameData.upgrades}
                isReviewCompleted={isReviewCompleted}
                isEndlessMode={isEndlessMode}
                isFeverMode={isFeverMode}
                gameData={gameData}
                isWeakMode={isWeakMode}
                toastNotice={toastNotice}
                startReview={startReview}
                startQuiz={startQuiz}
                setScreen={setScreen}
              />
            );
          case 'shop':
            return (
              <ShopScreen
                gameData={gameData}
                setGameData={setGameData}
                SoundFX={SoundFX}
                setScreen={setScreen}
              />
            );
          case 'badges':
            return (
              <BadgesScreen
                gameData={gameData}
                setGameData={setGameData}
                unlockedBadges={unlockedBadges}
                SoundFX={SoundFX}
                setScreen={setScreen}
              />
            );
          case 'stats':
            return (
              <StatsScreen
                words={words}
                levels={levels}
                stats={stats}
                statsFilter={statsFilter}
                setStatsFilter={setStatsFilter}
                statsSearch={statsSearch}
                setStatsSearch={setStatsSearch}
                getMasteryType={getMasteryType}
                setScreen={setScreen}
              />
            );
          case 'history':
            return (
              <HistoryScreen
                sessionLogs={sessionLogs}
                logDisplayCount={logDisplayCount}
                setLogDisplayCount={setLogDisplayCount}
                setScreen={setScreen}
              />
            );
          case 'analytics':
            return (
              <AnalyticsScreen
                dailyLogs={dailyLogs}
                words={words}
                gameData={gameData}
                dailyLogs={dailyLogs}
                totalMasteredWords={totalMasteredWords}
                setScreen={setScreen}
              />
            );
          case 'import':
            return (
              <ImportScreen
                levels={levels}
                targetLevelForImport={targetLevelForImport}
                setTargetLevelForImport={setTargetLevelForImport}
                customLevelInput={customLevelInput}
                setCustomLevelInput={setCustomLevelInput}
                csvText={csvText}
                setCsvText={setCsvText}
                importError={importError}
                handleImportCSV={handleImportCSV}
                handleFileUpload={handleFileUpload}
                setScreen={setScreen}
              />
            );
          case 'levels':
            return (
              <LevelsScreen
                levels={levels}
                setLevels={setLevels}
                words={words}
                selectedLevel={selectedLevel}
                setSelectedLevel={setSelectedLevel}
                newLevelName={newLevelName}
                setNewLevelName={setNewLevelName}
                newAdminPassInput={newAdminPassInput}
                setNewAdminPassInput={setNewAdminPassInput}
                setAdminPassword={setAdminPassword}
                setScreen={setScreen}
              />
            );
          case 'backup':
            return (
              <BackupScreen
                words={words}
                setWords={setWords}
                levels={levels}
                setLevels={setLevels}
                stats={stats}
                setStats={setStats}
                gameData={gameData}
                setGameData={setGameData}
                dailyLogs={dailyLogs}
                setDailyLogs={setDailyLogs}
                sessionLogs={sessionLogs}
                setSessionLogs={setSessionLogs}
                backupStatus={backupStatus}
                setBackupStatus={setBackupStatus}
                setScreen={setScreen}
              />
            );
          case 'menu':
          default:
            return (
              <MenuScreen
                words={words}
                levels={levels}
                selectedLevel={selectedLevel}
                setSelectedLevel={setSelectedLevel}
                sessionQuestionCount={sessionQuestionCount}
                setSessionQuestionCount={setSessionQuestionCount}
                gameData={gameData}
                dailyLogs={dailyLogs}
                stats={stats}
                isHintMode={isHintMode}
                setIsHintMode={setIsHintMode}
                soundEnabled={soundEnabled}
                setSoundEnabled={setSoundEnabled}
                getMasteryType={getMasteryType}
                isReviewDue={isReviewDue}
                currentSessionCombo={currentSessionCombo}
                startQuiz={startQuiz}
                requireAdmin={requireAdmin}
                setScreen={setScreen}
              />
            );
        }
      })()}

      <AdminLoginModal
        show={showAdminLoginModal}
        adminInputPass={adminInputPass}
        setAdminInputPass={setAdminInputPass}
        adminLoginError={adminLoginError}
        handleAdminAuthSubmit={handleAdminAuthSubmit}
        onClose={() => setShowAdminLoginModal(false)}
      />
    </>
  );
}


    // Error Boundary & Mount App to DOM
    class RootErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, info: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        this.setState({ info });
        if (window.showDebugError) {
          window.showDebugError('REACT RENDER ERROR', (error ? error.message : String(error)), (info ? info.componentStack : ''));
        }
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 24, color: '#fca5a5', background: '#0a0d1e', minHeight: '100vh', fontFamily: 'monospace' }}>
              <div style={{ fontSize: 22, fontWeight: 'bold', color: '#ef4444', marginBottom: 8 }}>⚠️ 描画エラーが発生しました</div>
              <p style={{ color: '#cbd5e1', fontSize: 13, marginBottom: 12 }}>コンポーネントの実行中に例外が検出されました。</p>
              <pre style={{ background: '#1e1b4b', padding: 12, borderRadius: 8, fontSize: 11, overflow: 'auto', border: '1px solid #4338ca' }}>
                {this.state.error ? this.state.error.stack || this.state.error.message : String(this.state.error)}
                {this.state.info ? '\n' + this.state.info.componentStack : ''}
              </pre>
              <div style={{ marginTop: 16, display: 'flex', gap: 10 }}>
                <button
                  onClick={() => location.reload()}
                  style={{ padding: '8px 16px', background: '#3b82f6', color: '#fff', border: 'none', borderRadius: 8, cursor: 'pointer', fontWeight: 'bold' }}
                >
                  再読み込み
                </button>
                <button
                  onClick={() => { if (confirm('キャッシュをクリアして再起動しますか？')) { localStorage.removeItem('spell_blaster_game_progress'); location.reload(); } }}
                  style={{ padding: '8px 16px', background: '#ef4444', color: '#fff', border: 'none', borderRadius: 8, cursor: 'pointer', fontWeight: 'bold' }}
                >
                  進行データを修復リセット
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <RootErrorBoundary>
        <App />
      </RootErrorBoundary>
    );
    
  </script>
</body>
</html>
