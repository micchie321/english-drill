    (function() {
      var isNativeApp = !!(

        window.location.protocol === 'file:' ||
        (window.location.hostname === 'localhost' && window.location.port === '' && navigator.userAgent.indexOf('Android') !== -1)

      if (isNativeApp) {
        // ネイティブAPK（アプリ）実行時:
        // アプリ内アセットを常に直接読み込むため Service Worker は登録せず、
        // 過去の古いキャッシュ（CacheStorage）が残っていれば自動クリア（※学習データ localStorage は保護）
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }).catch(function() {});
        }
      } else {
        // Webブラウザ（GitHub Pages 等）実行時:
        // オフライン対応 PWA として Service Worker を登録
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').catch(function(e) {
              console.warn('SW registration failed:', e);
            });
          });
        }
      }
    })();

  <!-- エラー可視化トラップ（構文エラーや実行時エラーを画面上に表示） -->
  <script>
    function showDebugError(title, msg, stack) {
      var existing = document.getElementById('debug-error-box');
      if (existing) return;
      var d = document.createElement('div');
      d.id = 'debug-error-box';
      d.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#880000;color:#fff;padding:20px;font-family:monospace;font-size:13px;z-index:999999;overflow:auto;white-space:pre-wrap;';
      d.innerText = '=== ' + title + ' ===\n' + msg + '\n\nStack:\n' + (stack || 'N/A');
      document.documentElement.appendChild(d);
    }
    window.addEventListener('error', function(e) {
      if (e.message === 'Script error.' && !e.filename) {
        console.warn('Cross-origin script warning suppressed:', e);
        return;
      }
      showDebugError('JAVASCRIPT ERROR', e.message + '\nSource: ' + e.filename + '\nLine: ' + e.lineno + ':' + e.colno, e.error ? e.error.stack : null);
    });
    window.addEventListener('unhandledrejection', function(e) {
      showDebugError('PROMISE REJECTION', (e.reason && e.reason.message) ? e.reason.message : String(e.reason), e.reason ? e.reason.stack : null);
    });
    // Babel コンパイルエラー等の console.error も画面に捕捉
    (function() {
      var oldErr = console.error;
      console.error = function() {
        var msg = Array.from(arguments).map(function(a) {
          return (a && a.stack) ? a.stack : (typeof a === 'object' ? JSON.stringify(a) : String(a));
        }).join('
');

          showDebugError('CONSOLE ERROR', msg);
        }
        if (oldErr) oldErr.apply(console, arguments);
      };
    })();
  </script>

const SoundFX = (() => {
  let audioCtx = null;
  let isEnabled = true;

  const initCtx = () => {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  };

  return {
    setEnabled: (val) => { isEnabled = val; },
    getEnabled: () => isEnabled,
    vibrate: (pattern) => {
      if (isEnabled && typeof navigator !== 'undefined' && navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    },

    playBossAlarm: () => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [0, 0.22, 0.44].forEach((t) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now + t);
          osc.frequency.linearRampToValueAtTime(880, now + t + 0.18);
          gain.gain.setValueAtTime(0, now + t);
          gain.gain.linearRampToValueAtTime(0.3, now + t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.01, now + t + 0.2);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + t); osc.stop(now + t + 0.21);
        });
      } catch (e) {}
    },

    playFeverUp: (phase) => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const baseFreqs = phase === 4 ? [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00]
          : phase === 3 ? [440.00, 554.37, 659.25, 880.00, 1108.73]
          : phase === 2 ? [392.00, 493.88, 587.33, 783.99]
          : [329.63, 440.00, 659.25];

        baseFreqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = phase >= 3 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0, now + idx * 0.05);
          gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.05 + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.05); osc.stop(now + idx * 0.05 + 0.36);
        });
      } catch (e) {}
    },

    playCorrect: () => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046.50, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.16);
      } catch (e) {}
    },

    playSpeedBonus: () => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [1318.51, 1760.00];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.04);
          gain.gain.setValueAtTime(0, now + idx * 0.04);
          gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.04 + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.2);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.04); osc.stop(now + idx * 0.04 + 0.21);

    playCritical: () => {

          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.06); osc.stop(now + idx * 0.06 + 0.26);

    playMastered: () => {

        const now = audioCtx.currentTime;
        // 壮大で煌びやかなマスター祝祭ファンファーレ (C5, E5, G5, B5, C6 + オクターブ残響)

          { f: 523.25, t: 0.00, dur: 0.35, vol: 0.28 }, // C5

          { f: 1318.51, t: 0.30, dur: 0.60, vol: 0.25 }, // E6 (オクターブ煌めき和音)
          { f: 2093.00, t: 0.32, dur: 0.50, vol: 0.15 }  // C7 (キラキラ倍音)
        ];
        notes.forEach(({ f, t, dur, vol }) => {
          const osc = audioCtx.createOscillator();

          osc.frequency.setValueAtTime(f, now + t);
          gain.gain.setValueAtTime(0, now + t);
          gain.gain.linearRampToValueAtTime(vol, now + t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + t + dur);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + t); osc.stop(now + t + dur + 0.02);

        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.12);
      } catch (e) {}
    },

    playVictory: () => {
      if (!isEnabled) return;
      try {

        const now = audioCtx.currentTime;
        const seq = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        seq.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.36);
        });
      } catch (e) {}

    playCoin: () => {

      try {

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.05);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

const safeStorage = {
  get: (key, fallback) => {
    try {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  set: (key, value) => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  }
};

    // ===== src/services/speech.js =====
const speakWord = (text) => {
  // サウンドが無効化されている場合は発音しない
  if (typeof SoundFX !== 'undefined' && !SoundFX.getEnabled()) {
    return;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
};

    // ===== src/services/cyberEffects.js =====
/**
 * CYBER EFFECTS ENGINE (SPELL BLASTER 専用電脳エフェクト)
 * 紙吹雪ではなく、サイバーパンクなネオンスパーク、デジタルデータ破片、
 * ヘックス衝撃波リング、バイナリシンボルを Canvas でリアルタイムレンダリング
 */

class CyberEffectsEngine {
  constructor() {
    this.canvas = null;
    this.ctx = null;
    this.particles = [];
    this.rings = [];
    this.animId = null;
    this.isActive = false;
  }

  init() {
    if (this.canvas) return;
    this.canvas = document.createElement('canvas');
    this.canvas.id = 'cyber-fx-canvas';
    this.canvas.style.position = 'fixed';
    this.canvas.style.inset = '0';
    this.canvas.style.width = '100vw';
    this.canvas.style.height = '100vh';
    this.canvas.style.pointerEvents = 'none';
    this.canvas.style.zIndex = '99999';
    document.body.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');

    const resize = () => {
      if (!this.canvas) return;
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);
  }

  /**
   * 単語3連勝マスター達成エフェクト (WORD MASTERED)
   * 黄金＆ネオンシアンのレーザースパーク + デジタルボクセル破片 + 2連電脳衝撃波リング + バイナリ文字飛散
   */
  mastery(origin = { x: 0.5, y: 0.55 }) {
    this.init();
    const w = this.canvas.width;
    const h = this.canvas.height;
    const startX = w * origin.x;
    const startY = h * origin.y;

    // 1. ショックウェーブリング (2連リング)
    this.rings.push({
      x: startX,
      y: startY,
      radius: 10,
      maxRadius: Math.min(w, h) * 0.75,
      lineWidth: 8,
      color: '#fbbf24', // ネオンゴールド
      alpha: 1,
      speed: 20
    });
    setTimeout(() => {
      this.rings.push({
        x: startX,
        y: startY,
        radius: 10,
        maxRadius: Math.min(w, h) * 0.6,
        lineWidth: 6,
        color: '#06b6d4', // ネオンシアン
        alpha: 1,
        speed: 15
      });
    }, 90);

    // 2. レーザービーム・スパーク (約70本)
    const goldCyanPalette = ['#fbbf24', '#f59e0b', '#06b6d4', '#22d3ee', '#ffffff', '#10b981'];
    for (let i = 0; i < 75; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 10 + Math.random() * 22;
      this.particles.push({
        kind: 'laser',
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        length: 20 + Math.random() * 40,
        color: goldCyanPalette[Math.floor(Math.random() * goldCyanPalette.length)],
        alpha: 1,
        decay: 0.02 + Math.random() * 0.02,
        width: 2.5 + Math.random() * 2
      });
    }

    // 3. デジタルボクセル（四角いネオンデータチップ）(約80個)
    for (let i = 0; i < 80; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 15;
      this.particles.push({
        kind: 'pixel',
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 4 + Math.random() * 8,
        rotation: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.25,
        color: goldCyanPalette[Math.floor(Math.random() * goldCyanPalette.length)],
        alpha: 1,
        decay: 0.015 + Math.random() * 0.02
      });
    }

    // 4. バイナリ文字・サイバーシンボル
    const symbols = ['0', '1', '1', '0', '>', '⚡', '👑', '★'];
    for (let i = 0; i < 28; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 12;
      this.particles.push({
        kind: 'symbol',
        char: symbols[Math.floor(Math.random() * symbols.length)],
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 14 + Math.random() * 12,
        color: Math.random() > 0.5 ? '#fde047' : '#67e8f9',
        alpha: 1,
        decay: 0.012 + Math.random() * 0.015
      });
    }

    this.startLoop();
  }

  /**
   * ジャックポット時 (JACKPOT OVERLOAD)

      color: '#ec4899',

    });

    for (let i = 0; i < 90; i++) {

      const speed = 8 + Math.random() * 24;
      this.particles.push({

      });
    }

    this.startLoop();

  /**
   * パーフェクト制覇時 (PERFECT EXCEED)
   * 全画面量子ネオンビームシャワー ＆ 超巨大衝撃波
   */
  perfect() {

    this.rings.push({
      x: w * 0.5,

    });

    const colors = ['#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#fbbf24', '#ffffff'];
    for (let i = 0; i < 140; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
      const speed = 12 + Math.random() * 26;
      this.particles.push({
        kind: 'laser',
        x: w * (0.2 + Math.random() * 0.6),
        y: h * 0.7,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        length: 30 + Math.random() * 55,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: 0.018 + Math.random() * 0.015,
        width: 3
      });
    }

    for (let i = 0; i < 90; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 6 + Math.random() * 16;
      this.particles.push({
        kind: 'pixel',
        x: w * 0.5,
        y: h * 0.6,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 5 + Math.random() * 7,
        rotation: 0,
        vRot: (Math.random() - 0.5) * 0.2,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: 0.015 + Math.random() * 0.015
      });
    }

    this.startLoop();
  }

  /**
   * 宝箱開封時 (CYBER CHEST BURST)
   */
  chest(tier = 'normal') {
    this.init();
    const w = this.canvas.width;
    const h = this.canvas.height;
    const startX = w * 0.5;
    const startY = h * 0.5;

    let colors = ['#a855f7', '#c084fc', '#ffffff', '#06b6d4'];
    let ringColor = '#a855f7';
    if (tier === 'mega') {
      colors = ['#ec4899', '#f43f5e', '#fbbf24', '#ffffff'];
      ringColor = '#ec4899';
    } else if (tier === 'giga') {
      colors = ['#fbbf24', '#f59e0b', '#ec4899', '#06b6d4', '#ffffff'];
      ringColor = '#fbbf24';
    }

    this.rings.push({
      x: startX,
      y: startY,
      radius: 10,
      maxRadius: Math.min(w, h) * 0.7,
      lineWidth: 8,
      color: ringColor,
      alpha: 1,
      speed: 20
    });

    for (let i = 0; i < 90; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 8 + Math.random() * 20;
      this.particles.push({
        kind: 'laser',
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        length: 20 + Math.random() * 40,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: 0.02 + Math.random() * 0.02,
        width: 2.5
      });
    }

    this.startLoop();
  }

  startLoop() {
    if (this.isActive) return;
    this.isActive = true;
    const loop = () => {
      if (!this.ctx || !this.canvas) return;
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

      // リング描画
      for (let i = this.rings.length - 1; i >= 0; i--) {
        const ring = this.rings[i];
        ring.radius += ring.speed;
        ring.alpha -= 0.025;
        if (ring.alpha <= 0 || ring.radius >= ring.maxRadius) {
          this.rings.splice(i, 1);
          continue;
        }
        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
        this.ctx.strokeStyle = ring.color;
        this.ctx.lineWidth = ring.lineWidth;
        this.ctx.globalAlpha = Math.max(0, ring.alpha);
        this.ctx.shadowBlur = 18;
        this.ctx.shadowColor = ring.color;
        this.ctx.stroke();
        this.ctx.restore();
      }

      // パーティクル描画
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96; // 減速
        p.vy *= 0.96;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          this.particles.splice(i, 1);
          continue;
        }

        this.ctx.save();
        this.ctx.globalAlpha = Math.max(0, p.alpha);
        this.ctx.shadowBlur = 14;
        this.ctx.shadowColor = p.color;

        if (p.kind === 'laser') {
          this.ctx.strokeStyle = p.color;
          this.ctx.lineWidth = p.width;
          this.ctx.beginPath();
          this.ctx.moveTo(p.x, p.y);
          this.ctx.lineTo(p.x - p.vx * (p.length / 10), p.y - p.vy * (p.length / 10));
          this.ctx.stroke();
        } else if (p.kind === 'pixel') {
          p.rotation += p.vRot;
          this.ctx.fillStyle = p.color;
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate(p.rotation);
          this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        } else if (p.kind === 'symbol') {
          this.ctx.fillStyle = p.color;
          this.ctx.font = `bold ${p.size}px monospace`;
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(p.char, p.x, p.y);
        }
        this.ctx.restore();
      }

      if (this.particles.length > 0 || this.rings.length > 0) {
        this.animId = requestAnimationFrame(loop);
      } else {
        this.isActive = false;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      }
    };
    this.animId = requestAnimationFrame(loop);
  }
}

/**
 * フィーバーモード（サドンデス）専用の得点倍率計算
 * - 1〜4問目: 0.20x 〜 0.80x
 * - 5問目: 1.00x（通常モードと同じ得点にジャスト到達）
 * - 5問目以降: 連続正解数に応じて急激に上昇するカーブ（アイテム feverAcceleratorLv で加速）
 */
const calculateFeverModeMultiplier = (feverCombo = 1, feverAcceleratorLv = 0) => {
  const c = Math.max(1, feverCombo);
  if (c <= 5) {
    return Number((c * 0.20).toFixed(2));
  }
  const extra = c - 5;
  const lv = Math.max(0, feverAcceleratorLv);
  // 初期(Lv 0)は穏やか: 10問で1.17x、20問で1.68x、50問で4.38x（通常モードを壊さない適正倍率）
  // HYPER FEVER CORE を強化すると爆発加速: Lv 5で10問2.75x/20問10.57x、Lv 10で10問4.52x/20問21.30x、Lv 20で10問8.49x/20問46.47x！
  const linearRate = 0.03 + (lv * 0.035);
  const quadRate = 0.001 + (lv * 0.004) + (Math.pow(lv, 1.6) * 0.0006);
  const mult = 1.0 + (extra * linearRate) + (extra * extra * quadRate);
  return Number(mult.toFixed(2));
};
const calculateReward = ({
  isCorrect,
  isBoss,
  justMastered,
  isAlreadyMastered = false,
  isFeverMode = false,
  feverCombo = 0,
  currentCombo,
  isSpeedBonus,
  isCheated,
  isRepeatedFarm,
  isHintMode,
  dailyOverdriveMultiplier = 1.0,
  upgrades = {}
}) => {
  if (!isCorrect || isCheated) {
    return { earnedSP: 0, isJackpot: false, isCritical: false, jackpotMult: 1 };
  }

  const overclockLv = upgrades.overclockCoreLv || upgrades.baseRewardLv || 0;
  const multiplierBoostLv = upgrades.multiplierBoostLv || 0;
  const criticalStrikeLv = upgrades.criticalStrikeLv || 0;
  const jackpotFeverLv = upgrades.jackpotFeverLv || 0;
  const sonicSpeedLv = upgrades.sonicSpeedLv || 0;
  const feverSurgeLv = upgrades.feverSurgeLv || 0;
  const bossBountyLv = upgrades.bossBountyLv || 0;
  const masterySupernovaLv = upgrades.masterySupernovaLv || upgrades.feverMasteryLv || 0;

  // 新規ハイエンドスキル
  const spAmplifierLv = upgrades.spAmplifierLv || 0;
  const critDamageBoostLv = upgrades.critDamageBoostLv || 0;
  const transcendenceCoreLv = upgrades.transcendenceCoreLv || 0;

  // 1. 基礎SP (15 + Lv×25)
  let sp = 15 + (overclockLv * 25);

  // 学習済み単語（マスター済み）の周回稼ぎ抑制：基礎点を20%（-80%）に低減
  const effectiveAlreadyMastered = !!isAlreadyMastered && !justMastered && !isBoss;
  if (effectiveAlreadyMastered) {
    sp = Math.max(3, Math.round(sp * 0.2));
  }

  // 2. コンボ乗数 (超越コアでさらに加算)
  const transcendenceComboBonus = transcendenceCoreLv * 0.02;
  const comboMult = 1.0 + (currentCombo * (0.05 + (multiplierBoostLv * 0.03) + transcendenceComboBonus));
  sp *= comboMult;

  // 3. FEVER乗数 (サージ加算付き)
  const phase = getFeverPhase(currentCombo);
  const surgeBonus = feverSurgeLv * 0.15;
  const feverMultipliers = [1.0, 1.5 + surgeBonus, 2.0 + surgeBonus, 3.0 + surgeBonus, 5.0 + surgeBonus];
  sp *= feverMultipliers[phase] || 1.0;

  // 4. デイリー限界突破倍率
  if (dailyOverdriveMultiplier > 1.0) {
    sp *= dailyOverdriveMultiplier;
  }

  // 5. スピードボーナス (1.5倍 + sonicSpeedLv×0.3)
  if (isSpeedBonus) {
    const speedMult = 1.5 + (sonicSpeedLv * 0.3);
    sp *= speedMult;
  }

  // 6. クリティカル判定 (Lv×7%, 最大80%, クリティカル爆砕Lvで倍率上乗せ)
  let isCritical = false;
  const critChance = Math.min(0.80, criticalStrikeLv * 0.07);
  const critMultiplier = 3.0 + (critDamageBoostLv * 0.4);
  if (Math.random() < critChance) {
    isCritical = true;
    sp *= critMultiplier;
  }

  // 7. 🎰 JACKPOT 判定 (Lv×2%, 最大25% で 7〜10倍大爆発！)
  let isJackpot = false;
  let jackpotMult = 1;
  const jackpotChance = Math.min(0.25, jackpotFeverLv * 0.02);
  if (jackpotFeverLv > 0 && Math.random() < jackpotChance) {
    isJackpot = true;
    jackpotMult = 7 + Math.floor(Math.random() * 4); // 7, 8, 9, 10倍
    sp *= jackpotMult;
  }

  // 8. SP超次元増幅 & 習得者の覇気オーラ & 量子神話コアの最終乗算
  const masteryAuraLv = upgrades.masteryAuraLv || 0;
  if (masteryAuraLv > 0) {
    sp *= (1.0 + (masteryAuraLv * 0.10));
  }
  if (spAmplifierLv > 0) {
    sp *= (1.0 + (spAmplifierLv * 0.10));
  }
  if (transcendenceCoreLv > 0) {
    sp *= (1.0 + (transcendenceCoreLv * 0.25));
  }

  // 9. 単語3連勝マスター祝賀ボーナス (基礎1,500 SP + Lv×500 SP & 基礎SP ×1.5倍ブースト)
  let masterBonus = 0;
  if (justMastered) {
    sp *= 1.5;
    masterBonus = 1500 + (masterySupernovaLv * 500);
    sp += masterBonus;
  }

  // 10. ボス撃破ボーナス (250 + Lv×150)
  if (isBoss) {
    sp += 250 + (bossBountyLv * 150);
  }

  // 10. フィーバーモード専用倍率 (5問で等倍、以降急上昇カーブ)
  let feverModeMultiplier = 1.0;
  if (isFeverMode) {
    const feverAcceleratorLv = upgrades.feverAcceleratorLv || 0;
    feverModeMultiplier = calculateFeverModeMultiplier(feverCombo || currentCombo || 1, feverAcceleratorLv);
    sp *= feverModeMultiplier;
  }

  // 11. 連続ファームペナルティ
  if (isRepeatedFarm) sp *= 0.1;

  const rawSP = Math.max(1, Math.round(sp));

  // 11. ヒントモードペナルティ (-75% カット)
  if (isHintMode) {
    sp *= 0.25;
  }

  const earnedSP = Math.max(1, Math.round(sp));

  return {
    earnedSP,
    rawSP,
    isHintMode: !!isHintMode,
    isJackpot,
    isCritical,
    jackpotMult,
    justMastered: !!justMastered,
    isAlreadyMastered: effectiveAlreadyMastered,
    isFeverMode: !!isFeverMode,
    feverModeMultiplier,
    masterBonus
  };
};

/**
 * インクリメンタルゲーム標準のスコア・通貨フォーマッタ (K, M, B, T, Qa, Qi... 記法)
 */
const formatScore = (num, decimals = 2) => {
  if (num === null || num === undefined || isNaN(num)) return '0';
  const val = Number(num);
  if (val === 0) return '0';
  const abs = Math.abs(val);
  const sign = val < 0 ? '-' : '';

  if (abs < 1000) {
    return `${sign}${Math.round(abs).toLocaleString()}`;
  }

  const suffixes = [
    '', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc',
    'aa', 'ab', 'ac', 'ad', 'ae', 'af', 'ag', 'ah', 'ai', 'aj', 'ak', 'al', 'am'
  ];

  const tier = Math.floor(Math.log10(abs) / 3);
  if (tier < suffixes.length) {
    const scale = Math.pow(10, tier * 3);
    const scaled = abs / scale;

    let formatted;
    if (scaled >= 100) {
      formatted = Math.floor(scaled).toString();
    } else if (scaled >= 10) {
      formatted = scaled.toFixed(1);
    } else {
      formatted = scaled.toFixed(2);
    }

    if (formatted.includes('.')) {
      formatted = formatted.replace(/\.?0+$/, '');
    }
    return `${sign}${formatted}${suffixes[tier]}`;
  }

  return `${sign}${abs.toExponential(2)}`;
};

/**
 * ギリシャ文字・キリル文字等のホモグリフ（見た目が英字と同じ異種文字）および全角英数をASCII英字に正規化
 */
const normalizeHomoglyphs = (str) => {
  if (!str) return '';
  let res = String(str);

  // 全角英数字を半角に正規化
  res = res.replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
  // 全角スペース・全角ピリオドを半角に
  res = res.replace(/　/g, ' ').replace(/[．。]/g, '.');

  // ホモグリフ置換テーブル (ギリシャ文字・キリル文字 -> ASCII英字)
  const homoglyphMap = {
    // ギリシャ文字大文字
    '\u0391': 'A', '\u0392': 'B', '\u0395': 'E', '\u0396': 'Z',
    '\u0397': 'H', '\u0399': 'I', '\u039A': 'K', '\u039C': 'M',
    '\u039D': 'N', '\u039F': 'O', '\u03A1': 'P', '\u03A4': 'T',
    '\u03A5': 'Y', '\u03A7': 'X',
    // ギリシャ文字小文字
    '\u03B1': 'a', '\u03BF': 'o', '\u03BA': 'k', '\u03BD': 'v',
    // キリル文字大文字
    '\u0410': 'A', '\u0412': 'B', '\u0415': 'E', '\u041A': 'K',
    '\u041C': 'M', '\u041D': 'H', '\u041E': 'O', '\u0420': 'P',
    '\u0421': 'C', '\u0422': 'T', '\u0425': 'X',
    // キリル文字小文字
    '\u0430': 'a', '\u0435': 'e', '\u043E': 'o', '\u0440': 'p',
    '\u0441': 'c', '\u0443': 'y', '\u0445': 'x',
  };

  return res.replace(/[\u0370-\u03FF\u0400-\u04FF]/g, ch => homoglyphMap[ch] || ch);
};

/**
 * 複数の回答候補（"a, an", "few (a few)", "(a) few", "OK/O.K.", "color (colour)" など）を抽出して配列で返す
 */
const getAnswerCandidates = (rawWord) => {
  if (!rawWord) return [];
  // ホモグリフ（ギリシャ文字・キリル文字等の混入）をASCII英字へ完全正規化
  let rawStr = normalizeHomoglyphs(rawWord).trim();
  if (!rawStr) return [];

  // "a.m.A.M." のようなスラッシュ欠落連結を自動分割
  rawStr = rawStr.replace(/([a-zA-Z]\.[a-zA-Z]\.)([a-zA-Z]\.[a-zA-Z]\.)/g, '$1 / $2');

  const candidatesSet = new Set();

  // 1. カンマ、スラッシュ、セミコロン（半角・全角）で大分割
  const primarySegments = rawStr
    .split(/[,/，／;；]/)
    .map(s => s.trim())
    .filter(Boolean);

  const segmentsToProcess = Array.from(new Set([rawStr, ...primarySegments]));

  segmentsToProcess.forEach(segment => {
    // 括弧（全角・角括弧含む）を半角丸括弧に統一
    const normalized = segment
      .replace(/[（［\[]/g, '(')
      .replace(/[）］\]]/g, ')');

    if (/\([^)]+\)/.test(normalized)) {
      // パターン1: 括弧の中身を抽出 (例: "few (a few)" -> "a few")
      const matches = normalized.match(/\(([^)]+)\)/g);
      if (matches) {
        matches.forEach(m => {
          const inner = m.slice(1, -1).trim();
          if (inner) candidatesSet.add(inner);
        });
      }

      // パターン2: 括弧とその中身を丸ごと除去 (例: "few (a few)" -> "few", "(a) few" -> "few")
      const withoutParen = normalized
        .replace(/\([^)]*\)/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (withoutParen) candidatesSet.add(withoutParen);

      // パターン3: 括弧記号のみを除去 (例: "(a) few" -> "a few")
      const withoutBrackets = normalized
        .replace(/[()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (withoutBrackets) candidatesSet.add(withoutBrackets);
    } else {
      const clean = normalized.replace(/\s+/g, ' ').trim();
      if (clean) candidatesSet.add(clean);
    }
  });

  // ドット付き略語（例: "O.K.", "p.m.", "a.m." など）のバリエーションを展開
  const currentList = Array.from(candidatesSet);
  currentList.forEach(c => {
    if (c.includes('.')) {
      // ドットを完全に除去した形 (例: "O.K." -> "OK", "p.m." -> "pm")
      const noDots = c.replace(/\./g, '').trim();
      if (noDots) candidatesSet.add(noDots);

      // 末尾のドットのみを除去した形 (例: "O.K." -> "O.K")
      if (c.endsWith('.')) {
        const trimmedDot = c.slice(0, -1).trim();
        if (trimmedDot) candidatesSet.add(trimmedDot);
      }
    }
  });

  candidatesSet.add(rawStr);
  return Array.from(candidatesSet).filter(c => c && c.length > 0);
};

/**
 * 画面表示用（文字数表示やDiffViewer用）のクリーンな正解候補リスト
 * 括弧や区切り文字を含まない純粋な単語候補のみを抽出
 */
const getCleanCandidates = (rawWord) => {
  if (!rawWord) return [];
  const all = getAnswerCandidates(rawWord);
  // 括弧や区切り記号を含まない候補
  const clean = all.filter(c => !/[()（）\[\]［］,/，／;；]/.test(c));
  
  // 不要な多重結合（例: "few a few" など）を表示用から除外
  const filtered = clean.filter(c => {
    const parts = c.split(/\s+/);
    if (parts.length >= 3 && clean.some(other => other !== c && c.includes(other))) {
      const remaining = clean.filter(other => other !== c && c.includes(other));
      if (remaining.length >= 2) return false;
    }
    return true;
  });

  const unique = [];
  // 短い順、かつドット無しの代表形を優先してソート
  const sorted = [...filtered].sort((a, b) => {
    if (a.length !== b.length) return a.length - b.length;
    return a.localeCompare(b);
  });
  sorted.forEach(c => {
    if (!unique.includes(c)) unique.push(c);
  });

  return unique.length > 0 ? unique : [normalizeHomoglyphs(rawWord).trim()];
};

/**
 * 入力文字列が回答候補のいずれかに一致するか判定
 */
const checkAnswerCorrectness = (userInput, rawWord) => {
  if (!userInput || !rawWord) return false;
  let cleanInput = normalizeHomoglyphs(userInput).trim().toLowerCase();
  cleanInput = cleanInput.replace(/\s+/g, ' ');

  const candidates = getAnswerCandidates(rawWord);

  // 1. 通常の候補一致（大文字小文字無視）
  if (candidates.some(c => c.toLowerCase() === cleanInput)) {
    return true;
  }

  // 2. ドットの有無を柔軟に許容する判定 (例: 入力 "ok" に対し "o.k."、または入力 "o.k." に対し "ok")
  const inputNoDots = cleanInput.replace(/\./g, '');
  if (inputNoDots.length > 0) {
    if (candidates.some(c => c.toLowerCase().replace(/\./g, '') === inputNoDots)) {
      return true;
    }
  }

  return false;
};
/**
 * 単語の文字数に応じた復習ステップ回数を取得
 * 3文字以下: 2回
 * 6文字以下: 3回
 * 7文字以上: 4回
 */
const getReviewStepsCount = (rawWord) => {
  if (!rawWord) return 4;
  const candidates = getCleanCandidates(rawWord);
  // 各候補の英数字文字数（記号・空白除く）を計算
  const lengths = candidates.map(c => {
    const letters = c.replace(/[^a-zA-Z0-9]/g, '');
    return letters.length > 0 ? letters.length : c.length;
  });
  const minLen = Math.min(...lengths);

  if (minLen <= 3) return 2;
  if (minLen <= 6) return 3;
  return 4;
};
/**
 * 問題数ごとの基礎クリアボーナスSPを取得
 * 5問: 0 SP
 * 10問: 500 SP
 * 25問: 2,500 SP
 * 50問: 7,500 SP
 * 100問: 20,000 SP
 */
const getBaseClearBonus = (questionCount) => {
  if (questionCount <= 5) return 0;
  if (questionCount <= 10) return 500;
  if (questionCount <= 25) return 2500;
  if (questionCount <= 50) return 7500;
  return 20000;
};

/**
 * セット完了時のクリアボーナスを計算
 * 正解数が半分に満たない場合はクリアボーナスなし
 */
const calculateClearBonus = (totalQuestions, correctCount, upgrades = {}, sessionEarnedGold = 0) => {
  if (!totalQuestions || totalQuestions <= 0) {
    return { qualified: false, baseFixed: 0, rate: 0, rateBonus: 0, baseBonus: 0, multiplier: 1, apexBonus: 0, totalBonus: 0, reason: '出題なし' };
  }

  // 5問はゼロ
  if (totalQuestions <= 5) {
    return { qualified: true, baseFixed: 0, rate: 0, rateBonus: 0, baseBonus: 0, multiplier: 1, apexBonus: 0, totalBonus: 0, reason: '5問ドリルはクリアボーナス対象外' };
  }

  // 正解数が半分未満の場合はなし
  const halfRequired = Math.ceil(totalQuestions / 2);
  if (correctCount < halfRequired) {
    return {
      qualified: false,
      baseFixed: 0,
      rate: 0,
      rateBonus: 0,
      baseBonus: 0,
      multiplier: 1,
      apexBonus: 0,
      totalBonus: 0,
      reason: `正解率50%未満 (${correctCount}/${totalQuestions}) のためボーナスなし`
    };
  }

  // 問題数別の基礎保証額 & セット獲得SPに対する還元率 (問題数が多いほど特大還元!)
  // 10問: 基礎500 SP + 獲得SPの15%
  // 25問: 基礎2,500 SP + 獲得SPの25%
  // 50問: 基礎7,500 SP + 獲得SPの40%
  // 100問: 基礎20,000 SP + 獲得SPの60%
  let baseFixed = 500;
  let rate = 0.15;
  if (totalQuestions <= 10) {
    baseFixed = 500;
    rate = 0.15;
  } else if (totalQuestions <= 25) {
    baseFixed = 2500;
    rate = 0.25;
  } else if (totalQuestions <= 50) {
    baseFixed = 7500;
    rate = 0.40;
  } else {
    baseFixed = 20000;
    rate = 0.60;
  }

  const sessionSP = Math.max(0, Number(sessionEarnedGold) || 0);

  // 25問以上のロングセット覇権 (APEX DRILL OVERLORD: 還元率+2% per Lv & 基礎加算+5,000 SP per Lv)
  const grandMasterLv = upgrades?.grandMasterClearLv || 0;
  const apexRateBoost = (totalQuestions >= 25) ? (grandMasterLv * 0.02) : 0;
  const apexFixedAdd = (totalQuestions >= 25) ? (grandMasterLv * 5000) : 0;

  const finalRate = rate + apexRateBoost;
  const rateBonus = Math.round(sessionSP * finalRate);

  // 正解率補正 (50%〜100%)
  const accuracy = correctCount / totalQuestions;
  const baseBonus = Math.round((baseFixed + apexFixedAdd + rateBonus) * accuracy);

  // CLEAR MATRIX 倍率ブースト (+10% per Lv)
  const clearBoostLv = upgrades?.clearBonusBoostLv || 0;
  const multiplier = 1 + (clearBoostLv * 0.10);

  const totalBonus = Math.round(baseBonus * multiplier);

  return {
    qualified: true,
    baseFixed,
    rate: finalRate,
    baseRate: rate,
    apexRateBoost,
    apexFixedAdd,
    rateBonus,
    accuracy,
    baseBonus,
    multiplier,
    totalBonus,
    reason: null
  };
};
const formatHintWord = (rawWord) => {
  if (!rawWord) return '';
  const lower = String(rawWord).toLowerCase();
  // 独立した 'i' (I, I'm, I've, I'll, I'd など) のみ大文字 'I' に変換
  return lower
    .replace(/\bi\b/g, 'I')
    .replace(/\bi(?=['\u2019][a-zA-Z])/g, 'I');
};

    // ===== src/components/DiffViewer.jsx =====
const DiffViewer = ({ userInput, correctWord }) => {
  const cleanInput = (userInput || '').trim();
  const rawParts = getCleanCandidates(correctWord);
  const isMultiple = rawParts.length > 1;

  // 複数候補がある場合、入力文字長に最も近い候補をDiffハイライトの基準にする
  const targetWord = isMultiple
    ? rawParts.reduce((best, curr) => {
        const diffA = Math.abs(curr.length - cleanInput.length);
        const diffB = Math.abs(best.length - cleanInput.length);
        return diffA < diffB ? curr : best;
      }, rawParts[0])
    : (correctWord || '');

  const userChars = cleanInput.split('');
  const targetChars = targetWord.toLowerCase().split('');

  return (
    <div className="bg-rose-950/70 border border-rose-800 rounded-xl p-2.5 my-1 text-center animate-shake">
      <div className="text-[10px] text-rose-300 mb-1 font-bold">
        {isMultiple ? `MISS MATCH (正解候補: ${rawParts.join(' / ')})` : 'MISS MATCH'}
      </div>
      <div className="font-mono text-lg tracking-widest flex items-center justify-center flex-wrap gap-1">
        {targetChars.map((char, idx) => {
          const isWrong = userChars[idx]?.toLowerCase() !== char;
          return (
            <span
              key={idx}
              className={`inline-block ${
                isWrong ? 'text-rose-400 font-bold underline decoration-rose-500' : 'text-emerald-500/50'
              }`}
            >
              {char}
            </span>
          );
        })}
      </div>
      <div className="text-[10px] text-slate-400 mt-1">
        Your input: <span className="line-through text-rose-500">{cleanInput || '(empty)'}</span>
      </div>
    </div>
  );
};

      {(() => {

                <select
                  value={selectedLevel}

                  className="bg-black/70 border border-indigo-500/50 rounded-lg px-2 py-0.5 text-[10px] text-cyan-300 focus:border-cyan-400 font-bold"
                >
                  {levels.map(l => (
                    <option key={l} value={l}>{l}</option>

                  <option value="ALL">🌟 全レベル一括 ({words.length}語)</option>

              </div>

              {/* STATS画面で全レベルを見るリンク */}
              <button

              >

            {/* 中段：直前レベルの習得サマリー ＆ 5色凡例 */}

            {/* 下段：内訳数字 */}
            <div className="flex items-center justify-between text-[7px] font-mono text-slate-400 mt-1 px-0.5">

      {/* 5. 出題問題数セレクター (5, 10, 25, 50, 100問 & クリアボーナス目安) */}
      <div className="bg-slate-900/85 border border-slate-800 rounded-2xl p-2 mb-2 font-mono shadow-sm">

        <div className="grid grid-cols-5 gap-1 text-center">

                    ? 'bg-gradient-to-b from-cyan-400 to-cyan-500 text-black border-cyan-300 shadow-[0_0_12px_rgba(6,182,212,0.4)]'

                <span className={`text-[7px] font-bold mt-0.5 ${isSelected ? 'text-black/80' : 'text-slate-500'}`}>
                  {item.bonus}
