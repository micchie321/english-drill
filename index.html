              </button>
            );
          })}
        </div>
      </div>

      {/* 6. START ボタン群 (メイン大ボタン + サブ2連横並び) */}
      <div className="space-y-1.5 mb-2">
        {/* メイン: N問ドリル */}
        <button
          onClick={() => startQuiz('normal')}
          className="w-full bg-gradient-to-r from-cyan-500 via-cyan-400 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-black font-black py-3 px-3.5 rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.4)] active:scale-95 transition-all font-mono tracking-wider flex items-center justify-between"
        >
          <div className="flex items-center gap-2.5">
            <span className="text-xl p-1 bg-black/20 rounded-xl">⚡</span>
            <div className="text-left">
              <div className="text-sm font-black text-black flex items-center gap-1.5 flex-wrap">
                <span>START {sessionQuestionCount}-SPELL DRILL</span>
                {currentSessionCombo > 0 && (
                  <span className="text-[9px] bg-red-600 text-white px-1.5 py-0.2 rounded font-black animate-pulse">
                    🔥 {currentSessionCombo} COMBO!
                  </span>
                )}
              </div>
              <div className="text-[9px] text-slate-900 font-bold">
                {currentSessionCombo > 0 ? `コンボ継続中！FEVER維持で特訓` : `${sessionQuestionCount}問1セットの電脳スペル特訓`}
              </div>
            </div>
          </div>
          <span className="text-base font-black">START ▶</span>
        </button>

        {/* フィーバーモード (サドンデス: 1ミス即終了 / 5問で通常得点、以降青天井) */}
        <button
          onClick={() => startQuiz('fever')}
          className="w-full bg-gradient-to-r from-amber-600 via-rose-600 to-red-700 hover:from-amber-500 hover:to-red-600 text-white font-black py-2.5 px-3 rounded-2xl shadow-[0_0_15px_rgba(244,63,94,0.35)] active:scale-95 transition-all font-mono tracking-wider flex items-center justify-between border border-rose-400/50"
        >
          <div className="flex items-center gap-2">
            <span className="text-xl p-1 bg-black/30 rounded-xl">🔥</span>
            <div className="text-left">
              <div className="text-xs font-black text-amber-200 flex items-center gap-1.5 flex-wrap">
                <span>FEVER MODE (SUDDEN DEATH)</span>
                {(gameData.maxFeverCombo || 0) > 0 && (
                  <span className="text-[8px] bg-black/60 text-amber-300 border border-amber-500/50 px-1.5 py-0.2 rounded font-bold">
                    BEST: {gameData.maxFeverCombo}連勝
                  </span>
                )}
              </div>
              <div className="text-[8px] text-rose-100 font-bold">
                1ミス即終了！5問目で1.0x到達、以降は青天井で得点爆発
              </div>
            </div>
          </div>
          <span className="text-xs font-black bg-black/30 px-2.5 py-1.5 rounded-lg border border-rose-400/30 flex items-center gap-1">
            <span>START</span>
            <span>🔥</span>
          </span>
        </button>

        {/* サブ: エンドレス & 苦手特訓 を横並びにして縦幅を半減！ */}
        <div className="grid grid-cols-2 gap-1.5 font-mono">
          <button
            onClick={() => startQuiz('endless')}
            className="bg-gradient-to-r from-fuchsia-950 to-pink-950 border border-fuchsia-500/50 hover:border-fuchsia-400 text-pink-200 py-2 px-2.5 rounded-xl shadow active:scale-95 transition-all text-left flex items-center gap-2"
          >
            <span className="text-lg">♾️</span>
            <div>
              <div className="text-[11px] font-black text-white">ENDLESS</div>
              <div className="text-[8px] text-pink-300/80">無限スペル無双</div>
            </div>
          </button>

          <button
            onClick={() => startQuiz('weak')}
            className="bg-gradient-to-r from-rose-950 to-red-950 border border-rose-500/50 hover:border-rose-400 text-rose-200 py-2 px-2.5 rounded-xl shadow active:scale-95 transition-all text-left flex items-center gap-2"
          >
            <span className="text-lg">🎯</span>
            <div>
              <div className="text-[11px] font-black text-white">WEAK SPOT</div>
              <div className="text-[8px] text-rose-300/80">誤答・ボス集中</div>
            </div>
          </button>
        </div>
      </div>

      {/* 6. 最下部ナビゲーション (コンパクト5連アイコン) */}
      <div>
        <div className="grid grid-cols-5 gap-1 pt-1 border-t border-slate-900/80">
          <button onClick={() => setScreen('shop')} className="bg-slate-900/80 border border-slate-800 p-1.5 rounded-xl flex flex-col items-center active:scale-95">
            <span className="text-base">🛒</span>
            <span className="text-[8px] font-mono text-slate-300 font-bold">SHOP</span>
          </button>
          <button onClick={() => setScreen('badges')} className="bg-slate-900/80 border border-slate-800 p-1.5 rounded-xl flex flex-col items-center active:scale-95">
            <span className="text-base">🎖️</span>
            <span className="text-[8px] font-mono text-slate-300 font-bold">BADGES</span>
          </button>
          <button onClick={() => setScreen('history')} className="bg-slate-900/80 border border-slate-800 p-1.5 rounded-xl flex flex-col items-center active:scale-95">
            <span className="text-base">📜</span>
            <span className="text-[8px] font-mono text-slate-300 font-bold">HISTORY</span>
          </button>
          <button onClick={() => setScreen('analytics')} className="bg-slate-900/80 border border-slate-800 p-1.5 rounded-xl flex flex-col items-center active:scale-95">
            <span className="text-base">📈</span>
            <span className="text-[8px] font-mono text-slate-300 font-bold">ANALYTICS</span>
          </button>
          <button onClick={() => setScreen('stats')} className="bg-slate-900/80 border border-slate-800 p-1.5 rounded-xl flex flex-col items-center active:scale-95">
            <span className="text-base">📊</span>
            <span className="text-[8px] font-mono text-slate-300 font-bold">STATS</span>
          </button>
        </div>

        <div className="mt-1 flex items-center justify-around text-[9px] font-mono text-slate-500">
          <button onClick={() => requireAdmin('import')} className="hover:text-cyan-400">🔒 CSV登録</button>
          <button onClick={() => requireAdmin('levels')} className="hover:text-cyan-400">🔒 レベル管理</button>
          <button onClick={() => setScreen('backup')} className="hover:text-cyan-400">🛡️ 保存/復元</button>
        </div>

        {/* コピーライト & バージョン表記 */}
        <div className="mt-1.5 text-center text-[9px] font-mono text-slate-500/80 tracking-wider">
          &copy; もずずんゲームス &bull; {FULL_VERSION_STRING}
        </div>
      </div>
    </div>
  );
};

    // ===== src/screens/QuizScreen.jsx =====
const QuizScreen = ({
  quizList,
  currentIndex,
  sessionQuestionCount = 10,
  isEndlessMode,
  isFeverMode,
  feverMilestone,
  setFeverMilestone,
  gameData = {},
  isBossQuestion,
  showBossIntro,
  toastNotice,
  answerStatus,
  currentSessionCombo,
  sessionEarnedGold,
  isHintMode,
  setIsHintMode,
  inputVal,
  setInputVal,
  inputRef,
  cheatAlertMsg,
  showQuitModal,
  setShowQuitModal,
  showCheatModal,
  setShowCheatModal,
  handleCheatDetected,
  handleSubmitAnswer,
  handleNextQuestion,
  getFeverPhase,
  getFeverDetails,
  sessionResults,
  setScreen,
  turnRewardDetail
}) => {
  const currentWord = quizList[currentIndex];
  if (!currentWord) return null;

  const nextBtnRef = useRef(null);
  const lastValRef = useRef('');
  const keystrokeCountRef = useRef(0);

  // 出題切り替え時に打鍵カウント・同期文字列をリセット
  useEffect(() => {
    lastValRef.current = '';
    keystrokeCountRef.current = 0;
  }, [currentIndex]);

  // 不正解時にEnterキーで即座に次へ進めるグローバルリスナー & ボタンフォーカス
  useEffect(() => {
    if (answerStatus !== 'incorrect') return;
    
    // NEXTボタンに自動フォーカス
    const timer = setTimeout(() => {
      nextBtnRef.current?.focus();
    }, 50);

    const handleGlobalKeyDown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (isFeverMode) {
          setScreen('result');
        } else {
          handleNextQuestion();
        }
      }
    };
    window.addEventListener('keydown', handleGlobalKeyDown);
    return () => {
      clearTimeout(timer);
      window.removeEventListener('keydown', handleGlobalKeyDown);
    };
  }, [answerStatus, handleNextQuestion]);

  const totalQuestions = isEndlessMode ? quizList.length : (sessionQuestionCount || quizList.length);
  const progressPercent = Math.min(100, Math.round(((currentIndex + 1) / totalQuestions) * 100));
  const feverPhase = getFeverPhase(currentSessionCombo);
  const feverDetail = getFeverDetails(feverPhase);

  let inputBorderColor = 'border-slate-700 focus:border-cyan-400';
  if (answerStatus === 'correct') {
    inputBorderColor = turnRewardDetail?.justMastered
      ? 'border-amber-400 bg-amber-950/40 text-amber-200'
      : 'border-emerald-500 bg-emerald-950/40 text-emerald-300';
  }
  else if (answerStatus === 'incorrect') inputBorderColor = 'border-rose-500 bg-rose-950/40 text-rose-300';

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 relative animate-fadeIn">
      {showBossIntro && (
        <div className="fixed inset-0 bg-red-950/90 z-50 flex flex-col items-center justify-center p-6 text-center animate-shake">
          <div className="text-6xl mb-3">⚠️</div>
          <div className="text-4xl font-black text-amber-300 tracking-widest uppercase font-mono shadow-lg">WARNING!!</div>
          <div className="text-xl font-black text-white mt-2">強敵（復習ターゲット）が急襲！</div>
        </div>
      )}

      {/* 🔥 10問ごと FEVER MILESTONE 派手な祝賀モーダル 🔥 */}
      {feverMilestone && (
        <div
          onClick={() => setFeverMilestone && setFeverMilestone(null)}
          className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fadeIn cursor-pointer"
        >
          <div className="bg-gradient-to-b from-amber-950 via-rose-950 to-black border-2 border-amber-400 rounded-3xl p-6 text-center max-w-sm w-full shadow-[0_0_60px_rgba(251,191,36,0.9)] animate-popIn relative overflow-hidden">
            {/* 背景キラキラ光線 */}
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(251,191,36,0.25)_0%,transparent_70%)] animate-pulse pointer-events-none" />

            <div className="text-6xl mb-2 animate-bounce">🔥</div>
            <div className="text-xs text-yellow-300 font-mono font-black tracking-widest uppercase mb-1 flex items-center justify-center gap-1.5">
              <span>★</span>
              <span>FEVER MILESTONE REACHED</span>
              <span>★</span>
            </div>
            <div className="text-3xl sm:text-4xl font-black text-white font-mono tracking-tight drop-shadow-[0_0_15px_rgba(251,191,36,0.8)]">
              {feverMilestone.combo} <span className="text-amber-400">連勝突破!!</span>
            </div>
            <div className="my-3 py-2 px-3 bg-black/60 border border-amber-500/50 rounded-2xl">
              <div className="text-[10px] text-slate-400 font-mono font-bold">現在の獲得SP倍率</div>
              <div className="text-2xl font-black text-amber-300 font-mono neon-gold">
                ×{feverMilestone.multiplier}倍 【急加速中】
              </div>
            </div>
            <p className="text-xs font-bold text-rose-200 mb-4 font-mono">
              神速突破！サドンデス不落の記録更新中！
            </p>
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                setFeverMilestone && setFeverMilestone(null);
              }}
              className="w-full bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:from-amber-300 hover:to-yellow-300 text-black font-black py-3 rounded-2xl font-mono text-sm shadow-[0_0_20px_rgba(251,191,36,0.6)] active:scale-95 transition-all"
            >
              KEEP GOING ▶ (タップで続行)
            </button>
          </div>
        </div>
      )}

      {/* 🚨 CHEAT DETECTED 大型アラートモーダル 🚨 */}
      {showCheatModal && (
        <div className="fixed inset-0 bg-red-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center animate-shake">
          <div className="text-6xl mb-3 animate-bounce">🚨</div>
          <div className="text-2xl sm:text-4xl font-black text-rose-400 tracking-wider font-mono border-2 border-rose-500 bg-black/80 px-6 py-2.5 rounded-2xl shadow-[0_0_50px_rgba(244,63,94,0.9)] animate-pulse">
            CHEAT 検出！
          </div>
          <div className="mt-4 text-base sm:text-lg font-black text-white max-w-xs leading-relaxed">
            1回の操作で複数文字の入力（予測変換・サジェスト・コピペ等）が検知されました！
          </div>
          <div className="mt-2 text-xs text-rose-300 font-mono bg-rose-900/60 border border-rose-600 px-4 py-2 rounded-xl">
            ⚠️ ペナルティ: 不正解扱い / SPゼロ / コンボリセット
          </div>
          <div className="mt-6 w-full max-w-xs">
            <button
              onClick={() => setShowCheatModal(false)}
              className="w-full bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 active:scale-95 text-white font-black py-3 px-6 rounded-2xl shadow-[0_0_20px_rgba(225,29,72,0.6)] border border-rose-400 text-sm tracking-widest uppercase font-mono transition-all"
            >
              閉じる（次へ進む）
            </button>
          </div>
        </div>
      )}

      {toastNotice && answerStatus === 'correct' && (
        <ToastNotice message={toastNotice} topClass="top-20" />
      )}

      <div>
        <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
          <button
            onClick={() => setShowQuitModal(true)}
            className="text-rose-400 hover:text-rose-300 px-2 py-1 rounded-xl text-xs font-mono font-bold active:scale-95"
          >
            ⏹ QUIT
          </button>
          <div className="flex items-center gap-2 font-mono">
            {/* ヒントトグルボタン (フィーバーモードでは完全使用不可) */}
            {isFeverMode ? (
              <span className="flex items-center gap-1 px-2 py-0.5 rounded border border-slate-800 bg-slate-900/60 text-[10px] font-bold text-slate-500 select-none">
                <span>🚫 NO HINT</span>
              </span>
            ) : (
              <button
                type="button"
                onClick={() => setIsHintMode(!isHintMode)}
                className={`flex items-center gap-1 px-2 py-0.5 rounded border text-[10px] font-bold active:scale-95 transition-all ${
                  isHintMode
                    ? 'bg-amber-950/80 text-amber-300 border-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.3)]'
                    : 'bg-slate-900 text-slate-500 border-slate-800'
                }`}
              >
                <span>👁️ HINT {isHintMode ? 'ON' : 'OFF'}</span>
                {isHintMode && (
                  <span className="text-[8px] bg-amber-500 text-black px-1 rounded font-black">-75% SP</span>
                )}
              </button>
            )}

            {currentSessionCombo > 1 && (
              <span
                className={`text-xs font-black px-2 py-0.5 rounded border transition-all ${
                  feverDetail ? feverDetail.badgeClass : 'text-amber-400 bg-amber-950/60 border-amber-500/50'
                }`}
              >
                {feverDetail ? feverDetail.label : `⚡ ${currentSessionCombo}`}
              </span>
            )}
            <div className="flex items-center gap-1.5 font-mono">
              <span className="text-xs font-bold text-yellow-400">🪙 {formatScore(sessionEarnedGold)}</span>
              {(gameData.mp || 0) > 0 && (
                <span className="text-[10px] font-bold text-amber-300 bg-amber-950/80 border border-amber-600/50 px-1.5 py-0.2 rounded-full flex items-center gap-0.5">
                  <span>👑</span>
                  <span>{gameData.mp}</span>
                </span>
              )}
            </div>
          </div>
        </div>

        <div className="mb-2">
          <div className="flex justify-between items-center text-[10px] font-mono mb-1">
            <span className={isFeverMode ? 'text-rose-400 font-bold flex items-center gap-1' : 'text-slate-500'}>
              {isFeverMode ? (
                <>
                  <span className="animate-pulse">🔥</span>
                  <span>FEVER SUDDEN DEATH</span>
                  <span className="text-slate-400 ml-1">STAGE: {currentIndex + 1}</span>
                </>
              ) : isEndlessMode ? (
                `STAGE: ${currentIndex + 1}`
              ) : (
                `Q: ${currentIndex + 1} / 10`
              )}
            </span>
            {isFeverMode && (
              <span className="px-2 py-0.2 rounded-full text-[9px] font-mono font-black bg-gradient-to-r from-amber-500 to-rose-500 text-black shadow">
                ×{calculateFeverModeMultiplier(currentSessionCombo, gameData?.upgrades?.feverAcceleratorLv || 0)}倍
                {currentSessionCombo < 5 ? ` (5問目で等倍)` : ''}
              </span>
            )}
          </div>
          <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
            <div
              className={`h-full transition-all duration-300 ${feverPhase >= 1 ? 'bg-amber-400' : 'bg-cyan-500'}`}
              style={{ width: `${progressPercent}%` }}
            />
          </div>
        </div>

        {/* 問題カード（和文が圧倒的な主役！大きく高コントラストに配置） */}
        <div
          className={`py-6 px-4 rounded-3xl border-2 text-center relative overflow-hidden backdrop-blur transition-all duration-200 shadow-xl ${
            isBossQuestion
              ? 'bg-red-950/60 border-red-500 boss-warning shadow-[0_0_30px_rgba(239,68,68,0.35)]'
              : (answerStatus === 'correct' && turnRewardDetail?.justMastered)
              ? 'bg-gradient-to-b from-amber-950/80 via-yellow-950/40 to-[#060a18] border-amber-400 shadow-[0_0_45px_rgba(251,191,36,0.6)] animate-pulse'
              : feverDetail
              ? feverDetail.cardClass
              : 'bg-gradient-to-b from-slate-900 via-[#0a1026] to-[#060a18] border-cyan-500/50 glow-cyan shadow-[0_0_30px_rgba(6,182,212,0.18)]'
          } ${answerStatus === 'correct' ? (turnRewardDetail?.justMastered ? 'opacity-90' : 'opacity-50') : ''}`}
        >
          <div className="flex items-center justify-center gap-2 mb-2">
            <span className="text-[10px] text-cyan-300 font-mono font-bold uppercase tracking-widest bg-cyan-950/80 border border-cyan-800/80 px-2.5 py-0.5 rounded-full">
              {currentWord.pos || '意味・和訳'}
            </span>
            <span className="text-[10px] font-mono text-slate-400">
              ({(() => {
                const cleanCandidates = getCleanCandidates(currentWord.word);
                if (cleanCandidates.length > 1) {
                  return `${cleanCandidates.map(p => `${p.length}`).join(' / ')} letters`;
                }
                return `${(cleanCandidates[0] || currentWord.word).length} letters`;
              })()})
            </span>
          </div>

          {/* 和文：最も視線が吸い寄せられる大きく鮮明なテキスト */}
          <h3 className="text-3xl md:text-4xl font-black text-white tracking-wide mb-1 leading-snug drop-shadow-lg">
            {currentWord.meaning}
          </h3>

          {currentWord.example && (
            <p className="text-[11px] text-slate-400 italic mt-2.5 max-w-xs mx-auto line-clamp-2">
              "{currentWord.example}"
            </p>
          )}
        </div>

        {/* ヒントモード時のお手本スペル (和文を邪魔しない落ち着いたサイバーHUDアシスト) */}
        {!isFeverMode && isHintMode && answerStatus === null && (
          <div className="mt-3 bg-slate-900/90 border border-slate-700/60 rounded-2xl py-2 px-3 text-center shadow-inner">
            <div className="text-[8px] font-mono font-bold tracking-wider text-amber-400 uppercase mb-0.5 flex items-center justify-center gap-1.5 flex-wrap">
              <span>👁️ SPELL GUIDE</span>
              <span className="bg-amber-950/90 text-amber-300 border border-amber-600/50 px-1.5 py-0.2 rounded text-[7px] font-mono">
                SP -75% / マスター不可(上限2連勝) / FEVER有効
              </span>
            </div>
            <div className="font-mono text-xl md:text-2xl font-bold tracking-[0.25em] text-cyan-200/90 py-0.5 select-none">
              {formatHintWord(currentWord.word)}
            </div>
            {(() => {
              const parts = getCleanCandidates(currentWord.word);
              if (parts.length > 1) {
                return (
                  <div className="text-[9px] text-cyan-400/80 font-mono mt-0.5">
                    ※いずれかを入力すれば正解になります ({parts.join(' / ')})
                  </div>
                );
              }
              return null;
            })()}
          </div>
        )}

        <form
          onSubmit={(e) => {
            e.preventDefault();
            if (answerStatus === null) {
              const trimmed = (inputVal || '').trim();
              // 【スマホ予測変換すり抜け防止の最終防壁】
              // 3文字以上の英単語で、打鍵回数（ストローク数）が文字数に対して極端に少ない場合（予測変換による一括適用）
              const minExpectedStrokes = Math.max(2, Math.floor(trimmed.length * 0.75));
              if (trimmed.length >= 3 && keystrokeCountRef.current < minExpectedStrokes) {
                if (handleCheatDetected) {
                  handleCheatDetected(trimmed);
                  return;
                }
              }
              handleSubmitAnswer(e);
            } else if (answerStatus === 'incorrect') {
              handleNextQuestion();
            }
          }}
          autoComplete="off"
          autoCorrect="off"
          autoCapitalize="off"
          spellCheck={false}
          className="mt-3 space-y-2 relative"
        >
          <div className="relative z-10">
            <input
              ref={inputRef}
              type="text"
              name={`spell_${currentWord?.id || 'ans'}_${currentIndex}`}
              id={`spell_input_${currentWord?.id || 'ans'}_${currentIndex}`}
              autoComplete="one-time-code"
              autoCorrect="off"
              autoCapitalize="off"
              spellCheck={false}
              inputMode="text"
              enterKeyHint="done"
              data-form-type="other"
              data-lpignore="true"
              data-1p-ignore="true"
              aria-autocomplete="none"
              disabled={answerStatus !== null}
              placeholder="Type here..."
              value={inputVal}
              onCompositionEnd={(e) => {
                if (answerStatus !== null) return;
                const compData = e.data || '';
                // スマホの予測変換確定で2文字以上の単語が挿入された場合
                if (compData.length >= 2) {
                  if (handleCheatDetected) handleCheatDetected(e.target.value);
                }
              }}
              onBeforeInput={(e) => {
                if (answerStatus !== null) return;
                const insertData = e.data || '';
                const inputType = e.inputType || '';
                // 複数文字挿入、または予測変換/置換/合成入力タイプを事前検知
                const isSuspicious = 
                  insertData.length >= 2 || 
                  inputType === 'insertReplacementText' || 
                  inputType === 'insertFromPaste' ||
                  inputType === 'insertFromComposition';

                if (isSuspicious) {
                  e.preventDefault();
                  const detectedVal = (lastValRef.current || '') + insertData;
                  if (handleCheatDetected) handleCheatDetected(detectedVal);
                }
              }}
              onChange={(e) => {
                if (answerStatus !== null) return;
                const rawVal = e.target.value;
                const prevVal = lastValRef.current || '';
                const nativeEvent = e.nativeEvent;

                let normalizedVal = rawVal.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
                normalizedVal = normalizedVal.replace(/　/g, ' ');

                const diff = normalizedVal.length - prevVal.length;
                const nativeDataLen = nativeEvent?.data ? nativeEvent.data.length : 0;
                const inputType = nativeEvent?.inputType || '';
                const isSuspiciousType = 
                  inputType === 'insertReplacementText' || 
                  inputType === 'insertFromPaste' || 
                  inputType === 'insertFromComposition';

                // 1回の操作で2文字以上増加、またはサジェスト置換 => チート検出＆即時不正解！
                if (diff >= 2 || nativeDataLen >= 2 || isSuspiciousType) {
                  lastValRef.current = normalizedVal;
                  if (handleCheatDetected) handleCheatDetected(normalizedVal);
                  return;
                }

                // 正常な1文字タイピング時のみストローク数を加算
                if (diff === 1) {
                  keystrokeCountRef.current += 1;
                }

                lastValRef.current = normalizedVal;
                setInputVal(normalizedVal);
              }}
              onKeyDown={(e) => {
                if (e.nativeEvent.isComposing || e.keyCode === 229) {
                  return;
                }
              }}
              onPaste={(e) => {
                e.preventDefault();
                const pasted = e.clipboardData ? e.clipboardData.getData('text') : '';
                if (handleCheatDetected) handleCheatDetected(pasted || 'PASTE_ATTEMPT');
              }}
              onDrop={(e) => e.preventDefault()}
              className={`w-full bg-black/80 border-2 rounded-2xl py-3 px-4 text-center text-2xl font-mono mobile-input placeholder:text-slate-700 transition-all shadow-inner ${inputBorderColor}`}
            />
            {answerStatus === 'incorrect' && isFeverMode && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                <div className="text-rose-300 font-black text-xl md:text-2xl font-mono stamp-anim bg-black/95 px-6 py-3 rounded-2xl backdrop-blur-md border-2 border-rose-500 shadow-[0_0_40px_rgba(244,63,94,0.9)] flex flex-col items-center">
                  <div className="flex items-center gap-1.5 text-xs text-rose-400 font-bold tracking-widest uppercase">
                    <span>🔥</span>
                    <span>SUDDEN DEATH!!</span>
                    <span>🔥</span>
                  </div>
                  <div className="text-base font-black text-white mt-0.5">
                    フィーバー終了！
                  </div>
                </div>
              </div>
            )}
            {answerStatus === 'incorrect' && !isFeverMode && turnRewardDetail?.isCheatFailed && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                <div className="text-rose-300 font-black text-xl md:text-2xl font-mono stamp-anim bg-black/95 px-6 py-3 rounded-2xl backdrop-blur-md border-2 border-rose-500 shadow-[0_0_40px_rgba(244,63,94,0.9)] flex flex-col items-center">
                  <div className="flex items-center gap-1.5 text-xs text-rose-400 font-bold tracking-widest uppercase">
                    <span>🚨</span>
                    <span>CHEAT DETECTED</span>
                    <span>🚨</span>
                  </div>
                  <div className="text-base font-black text-white mt-0.5">
                    一括入力検知（不正解）
                  </div>
                </div>
              </div>
            )}
            {answerStatus === 'correct' && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                {turnRewardDetail?.justMastered ? (
                  <div className="text-amber-300 font-black text-xl md:text-2xl font-mono stamp-anim bg-gradient-to-r from-amber-950 via-yellow-950 to-amber-950 px-6 py-3 rounded-2xl backdrop-blur-md border-2 border-amber-300 shadow-[0_0_50px_rgba(251,191,36,0.9)] flex flex-col items-center">
                    <div className="flex items-center gap-1.5 text-xs md:text-sm text-yellow-300 font-black tracking-widest uppercase">
                      <span>👑</span>
                      <span className="neon-gold">WORD MASTERED!!</span>
                      <span>👑</span>
                    </div>
                    <div className="text-2xl md:text-3xl font-black text-white tracking-tight flex items-center gap-2 mt-0.5">
                      <span className="text-amber-200">+{formatScore(turnRewardDetail.earnedSP)} SP!</span>
                    </div>
                    <div className="text-[10px] bg-amber-400 text-black px-2 py-0.5 rounded-full font-black mt-1 shadow">
                      👑 3連勝完全習得祝賀 +{formatScore(turnRewardDetail.masterBonus || 1500)} SP!
                    </div>
                  </div>
                ) : turnRewardDetail?.isJackpot ? (
                  <div className="text-amber-300 font-black text-xl md:text-2xl font-mono stamp-anim bg-amber-950/90 px-5 py-2.5 rounded-2xl backdrop-blur-md border-2 border-amber-400 shadow-[0_0_35px_rgba(251,191,36,0.8)] flex flex-col items-center">
                    <span className="text-xs md:text-sm text-yellow-300 font-black tracking-widest animate-pulse">🎰 MEGA JACKPOT!! ×{turnRewardDetail.jackpotMult} 🎰</span>
                    <span className="text-xl sm:text-2xl md:text-3xl font-black text-amber-200 truncate">+{formatScore(turnRewardDetail.earnedSP)} SP!</span>
                  </div>
                ) : turnRewardDetail?.isCritical ? (
                  <div className="text-rose-400 font-black text-xl font-mono stamp-anim bg-rose-950/90 px-5 py-2 rounded-xl backdrop-blur-md border-2 border-rose-500 shadow-[0_0_25px_rgba(244,63,94,0.7)] flex flex-col items-center">
                    <span className="text-xs text-rose-300 tracking-wider">💥 CRITICAL HIT! (×3.0)</span>
                    <span className="text-xl text-white">+{formatScore(turnRewardDetail.earnedSP)} SP</span>
                  </div>
                ) : (
                  <div className="text-emerald-400 font-black text-xl md:text-2xl font-mono stamp-anim bg-black/80 px-5 py-2 rounded-xl backdrop-blur-sm border border-emerald-500/50 shadow-lg flex items-center gap-2">
                    <span>PERFECT!</span>
                    {turnRewardDetail?.earnedSP > 0 && (
                      <span className="text-base md:text-lg text-emerald-300 font-mono flex items-center gap-1">
                        <span>+{formatScore(turnRewardDetail.earnedSP)} SP</span>
                        {turnRewardDetail?.isHintMode && (
                          <span className="text-[9px] text-amber-300 font-sans font-bold bg-amber-950 px-1 rounded border border-amber-500/40">
                            HINT -75%
                          </span>
                        )}
                        {turnRewardDetail?.isAlreadyMastered && (
                          <span className="text-[9px] text-cyan-300 font-sans font-bold bg-cyan-950 px-1.5 py-0.5 rounded border border-cyan-500/40">
                            習得済復習 -80%
                          </span>
                        )}
                      </span>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* スピードボーナスバー (文字入力の下に移動！) */}
          {answerStatus === null && (
            <div className="pt-1 px-1">
              <div className="flex justify-between text-[8px] font-mono text-slate-400 mb-0.5 relative">
                <span>0s</span>
                <span className="absolute left-[50%] transform -translate-x-1/2 flex items-center gap-1 text-amber-400 font-bold z-10 bg-black/80 px-1.5 py-0.2 rounded border border-amber-500/30">
                  <span className="text-[10px]">👑</span>
                  <span>2.5s BONUS</span>
                </span>
                <span>5s+</span>
              </div>
              <div className="h-2 bg-slate-950 w-full rounded-full overflow-hidden relative border border-slate-800 shadow-inner">
                <div className="absolute left-[50%] top-0 bottom-0 w-0.5 bg-amber-500/60 z-10"></div>
                <div key={currentIndex} className="h-full speed-timer-grow"></div>
              </div>
            </div>
          )}

          {cheatAlertMsg && <div className="text-[10px] font-mono text-amber-400 text-center">{cheatAlertMsg}</div>}

          {/* 通常時は不正解時のみDiffを表示 */}
          {answerStatus === 'incorrect' && (
            <DiffViewer userInput={inputVal.trim()} correctWord={currentWord.word} />
          )}

          {answerStatus === null ? (
            <button
              type="submit"
              disabled={inputVal.trim().length === 0}
              className="w-full bg-cyan-500 hover:bg-cyan-400 disabled:bg-slate-800 disabled:text-slate-600 text-black font-black py-3 rounded-2xl shadow-lg active:scale-95 transition-all text-sm font-mono tracking-wider"
            >
              CHECK (ENTER)
            </button>
          ) : (
            answerStatus === 'incorrect' && (
              isFeverMode ? (
                <button
                  ref={nextBtnRef}
                  type="button"
                  onClick={() => setScreen('result')}
                  autoFocus
                  className="w-full bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-black py-3 rounded-2xl shadow-[0_0_25px_rgba(239,68,68,0.7)] active:scale-95 transition-all text-sm font-mono tracking-wider mt-2 pop-in focus:ring-4 focus:ring-amber-400"
                >
                  🔥 FEVER OVER (結果を見る) ▶
                </button>
              ) : (
                <button
                  ref={nextBtnRef}
                  type="button"
                  onClick={handleNextQuestion}
                  autoFocus
                  className="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-3 rounded-2xl shadow-lg active:scale-95 transition-all text-sm font-mono tracking-wider mt-2 pop-in focus:ring-4 focus:ring-rose-400"
                >
                  NEXT ▶ (ENTER)
                </button>
              )
            )
          )}
        </form>
      </div>

      <QuitModal
        show={showQuitModal}
        onConfirmResult={() => {
          setShowQuitModal(false);
          if (sessionResults.length > 0) setScreen('result');
          else setScreen('menu');
        }}
        onCancel={() => setShowQuitModal(false)}
      />
    </div>
  );
};

    // ===== src/screens/ReviewScreen.jsx =====
const ReviewScreen = ({
  reviewList,
  reviewIndex,
  reviewStep,
  toastNotice,
  answerStatus,
  setAnswerStatus,
  inputVal,
  setInputVal,
  inputRef,
  maskedHint,
  showCheatModal,
  setShowCheatModal,
  handleCheatDetected,
  handleSubmitReview,
  setScreen
}) => {
  const currentWord = reviewList[reviewIndex];
  if (!currentWord) return null;

  const maxSteps = getReviewStepsCount(currentWord.word);
  const lastValRef = useRef('');
  const keystrokeCountRef = useRef(0);

  useEffect(() => {
    lastValRef.current = '';
    keystrokeCountRef.current = 0;
  }, [reviewStep, reviewIndex]);

  useEffect(() => {
    if (answerStatus === null) {
      const timer = setTimeout(() => {
        inputRef.current?.focus();
      }, 50);
      return () => clearTimeout(timer);
    }
  }, [reviewStep, reviewIndex, answerStatus]);

  const progressPercent = Math.min(100, Math.round((reviewIndex / reviewList.length) * 100));

  let inputBorderColor = 'border-slate-700 focus:border-cyan-400';
  if (answerStatus === 'correct') inputBorderColor = 'border-emerald-500 bg-emerald-950/40 text-emerald-300';
  else if (answerStatus === 'incorrect') inputBorderColor = 'border-rose-500 bg-rose-950/40 text-rose-300';

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 relative animate-fadeIn">
      {toastNotice && answerStatus === 'correct' && (
        <ToastNotice message={toastNotice} topClass="top-20" />
      )}

      {/* 🚨 CHEAT DETECTED 大型アラートモーダル 🚨 */}
      {showCheatModal && (
        <div className="fixed inset-0 bg-red-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center animate-shake">
          <div className="text-6xl mb-3 animate-bounce">🚨</div>
          <div className="text-2xl sm:text-4xl font-black text-rose-400 tracking-wider font-mono border-2 border-rose-500 bg-black/80 px-6 py-2.5 rounded-2xl shadow-[0_0_50px_rgba(244,63,94,0.9)] animate-pulse">
            CHEAT 検出！
          </div>
          <div className="mt-4 text-base sm:text-lg font-black text-white max-w-xs leading-relaxed">
            1回の操作で複数文字の入力（予測変換・サジェスト・コピペ等）が検知されました！
          </div>
          <div className="mt-2 text-xs text-rose-300 font-mono bg-rose-900/60 border border-rose-600 px-4 py-2 rounded-xl">
            ⚠️ 復習練習のため、1文字ずつ入力してください
          </div>
          <div className="mt-6 w-full max-w-xs">
            <button
              onClick={() => setShowCheatModal(false)}
              className="w-full bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 active:scale-95 text-white font-black py-3 px-6 rounded-2xl shadow-[0_0_20px_rgba(225,29,72,0.6)] border border-rose-400 text-sm tracking-widest uppercase font-mono transition-all"
            >
              閉じる（再挑戦）
            </button>
          </div>
        </div>
      )}

      <div>
        <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
          <h2 className="text-sm font-black text-rose-400 font-mono tracking-widest flex items-center gap-2">
            <span>🔥</span> REVENGE TRAINING
          </h2>
          <button
            onClick={() => setScreen('result')}
            className="text-slate-500 hover:text-slate-300 text-xs font-mono font-bold active:scale-95"
          >
            ⏹ 戻る
          </button>
        </div>

        <div className="mb-4">
          <div className="flex justify-between text-[10px] font-mono mb-1">
            <span className="text-slate-400">WORD: {reviewIndex + 1} / {reviewList.length}</span>
          </div>
          <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
            <div className="h-full bg-rose-500 transition-all duration-300" style={{ width: `${progressPercent}%` }} />
          </div>
        </div>

        <div className={`p-4 rounded-3xl border-2 text-center relative overflow-hidden backdrop-blur transition-all duration-200 bg-slate-900/90 border-rose-500/40 shadow-[0_0_15px_rgba(244,63,94,0.2)] ${
          answerStatus === 'correct' ? 'opacity-50' : ''
        }`}>
          <div className="text-[10px] text-rose-400 font-bold uppercase mb-1">{currentWord.pos || '英単語'}</div>
          <h3 className="text-2xl font-black text-white tracking-wide mb-1">{currentWord.meaning}</h3>
          <div className="mt-4 mb-2">
            <div className="text-[10px] text-slate-400 font-mono mb-1">STEP {reviewStep + 1} / {maxSteps}</div>
            <div className="flex justify-center gap-1.5 mb-3">
              {Array.from({ length: maxSteps }, (_, i) => i).map(step => (
                <div
                  key={step}
                  className={`w-6 h-1.5 rounded-full ${
                    step < reviewStep
                      ? 'bg-emerald-400'
                      : step === reviewStep
                      ? 'bg-rose-500 animate-pulse'
                      : 'bg-slate-700'
                  }`}
                />
              ))}
            </div>
            <div className="font-mono text-3xl font-black tracking-[0.2em] text-cyan-300 bg-black/50 py-3 rounded-xl border border-slate-800">
              {maskedHint.split('').map((char, i) => (
                <span key={i} className={char === '_' ? 'text-slate-700 mx-0.5' : 'text-cyan-300'}>{char}</span>
              ))}
            </div>
            <div className="text-[9px] text-slate-500 mt-2 font-mono">
              {reviewStep === 0
                ? 'ヒントを見て入力してください'
                : reviewStep >= maxSteps - 1
                ? 'ノーヒントで入力してください！'
                : maxSteps === 3
                ? '文字が半分隠れました'
                : reviewStep === 1
                ? '文字が1/3隠れました'
                : '文字が2/3隠れました'}
            </div>
          </div>
        </div>

        <form
          onSubmit={(e) => {
            e.preventDefault();
            if (answerStatus === null) {
              const trimmed = (inputVal || '').trim();
              const minExpectedStrokes = Math.max(2, Math.floor(trimmed.length * 0.75));
              if (trimmed.length >= 3 && keystrokeCountRef.current < minExpectedStrokes) {
                if (handleCheatDetected) {
                  handleCheatDetected(trimmed);
                  return;
                }
              }
              handleSubmitReview(e);
            } else if (answerStatus === 'incorrect') {
              handleSubmitReview(e);
            }
          }}
          autoComplete="off"
          autoCorrect="off"
          autoCapitalize="off"
          spellCheck={false}
          className="mt-4 space-y-2"
        >
          <div className="relative">
            <input
              ref={inputRef}
              type="text"
              name={`review_${currentWord?.id || 'ans'}_${reviewIndex}_${reviewStep}`}
              id={`review_input_${currentWord?.id || 'ans'}_${reviewIndex}_${reviewStep}`}
              autoComplete="one-time-code"
              autoCorrect="off"
              autoCapitalize="off"
              spellCheck={false}
              inputMode="text"
              enterKeyHint="done"
              data-form-type="other"
              data-lpignore="true"
              data-1p-ignore="true"
              aria-autocomplete="none"
              disabled={answerStatus === 'correct'}
              placeholder="Type here..."
              value={inputVal}
              onCompositionEnd={(e) => {
                if (answerStatus !== null && answerStatus !== 'incorrect') return;
                const compData = e.data || '';
                if (compData.length >= 2) {
                  if (handleCheatDetected) handleCheatDetected(e.target.value);
                }
              }}
              onBeforeInput={(e) => {
                if (answerStatus !== null && answerStatus !== 'incorrect') return;
                const insertData = e.data || '';
                const inputType = e.inputType || '';
                const isSuspicious = 
                  insertData.length >= 2 || 
                  inputType === 'insertReplacementText' || 
                  inputType === 'insertFromPaste' ||
                  inputType === 'insertFromComposition';

                if (isSuspicious) {
                  e.preventDefault();
                  const detectedVal = (lastValRef.current || '') + insertData;
                  if (handleCheatDetected) handleCheatDetected(detectedVal);
                }
              }}
              onChange={(e) => {
                const rawVal = e.target.value;
                const prevVal = lastValRef.current || '';
                const nativeEvent = e.nativeEvent;

                let normalizedVal = rawVal.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
                normalizedVal = normalizedVal.replace(/　/g, ' ');

                const diff = normalizedVal.length - prevVal.length;
                const nativeDataLen = nativeEvent?.data ? nativeEvent.data.length : 0;
                const inputType = nativeEvent?.inputType || '';
                const isSuspiciousType = 
                  inputType === 'insertReplacementText' || 
                  inputType === 'insertFromPaste' || 
                  inputType === 'insertFromComposition';

                if ((diff >= 2 || nativeDataLen >= 2 || isSuspiciousType) && (answerStatus === null || answerStatus === 'incorrect')) {
                  lastValRef.current = normalizedVal;
                  if (handleCheatDetected) handleCheatDetected(normalizedVal);
                  return;
                }

                if (diff === 1) {
                  keystrokeCountRef.current += 1;
                }

                lastValRef.current = normalizedVal;
                setInputVal(normalizedVal);
                if (answerStatus === 'incorrect') setAnswerStatus(null);
              }}
              onKeyDown={(e) => {
                if (e.nativeEvent.isComposing || e.keyCode === 229) {
                  return;
                }
              }}
              onPaste={(e) => {
                e.preventDefault();
                const pasted = e.clipboardData ? e.clipboardData.getData('text') : '';
                if (handleCheatDetected) handleCheatDetected(pasted || 'PASTE_ATTEMPT');
              }}
              onDrop={(e) => e.preventDefault()}
              className={`w-full bg-black/80 border-2 rounded-2xl py-3 px-4 text-center text-2xl font-mono mobile-input placeholder:text-slate-700 transition-all shadow-inner ${inputBorderColor}`}
            />
            {answerStatus === 'correct' && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div className="text-emerald-400 font-black text-2xl font-mono stamp-anim bg-black/60 px-4 py-1 rounded-lg backdrop-blur-sm border border-emerald-500/50">
                  PERFECT!
                </div>
              </div>
            )}
            {answerStatus === 'incorrect' && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div className="text-rose-400 font-black text-2xl font-mono animate-shake bg-black/60 px-4 py-1 rounded-lg backdrop-blur-sm border border-rose-500/50">
                  MISS!
                </div>
              </div>
            )}
          </div>

          {/* 復習時も不正解時のみDiffを表示 */}
          {answerStatus === 'incorrect' && (
            <DiffViewer userInput={inputVal.trim()} correctWord={currentWord.word} />
          )}

          {answerStatus === 'incorrect' ? (
            <button
              type="submit"
              className="w-full bg-amber-500 hover:bg-amber-400 text-black font-black py-3 rounded-2xl shadow-lg active:scale-95 transition-all text-sm font-mono tracking-wider animate-pulse"
            >
              🔄 クリアして再挑戦 (ENTER)
            </button>
          ) : (
            <button
              type="submit"
              disabled={inputVal.trim().length === 0 || answerStatus === 'correct'}
              className="w-full bg-rose-600 hover:bg-rose-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-black py-3 rounded-2xl shadow-lg active:scale-95 transition-all text-sm font-mono tracking-wider"
            >
              CHECK (ENTER)
            </button>
          )}
        </form>
      </div>
    </div>
  );
};

    // ===== src/screens/ResultScreen.jsx =====

        } else if (rand < 55) {
          reward = { type: 'sp', amount: 450, title: '✨ 当たり +450 SP!', icon: '🪙', class: 'text-yellow-300 font-bold text-base' };
          SoundFX.playCoin();
        } else {
          reward = { type: 'sp', amount: 150, title: '小当たり +150 SP', icon: '💰', class: 'text-slate-300 font-bold text-sm' };
          SoundFX.playCoin();
        }
      }

      setChestResult(reward);
      setIsOpeningChest(false);

      // 報酬付与
      setGameData(prev => {
        let newGold = prev.gold;
        let newShields = prev.shields || 0;
        let newTotalEarned = prev.totalEarned || prev.gold || 0;

        if (reward.type === 'sp') {
          newGold += reward.amount;
          newTotalEarned += reward.amount;
        } else if (reward.type === 'shield') {
          newShields = Math.min(5, newShields + (reward.amount || 1));
        } else if (reward.type === 'shield_full') {
          newShields = 5;
        }

        return {
          ...prev,
          gold: newGold,
          shields: newShields,
          totalEarned: newTotalEarned
        };
      });
    }, 600);
  };

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 animate-fadeIn relative">

                      <div

                  {MASTERY_TITLES_CONFIG.map(t => {
                    const purchased = (gameData.purchasedTitles || ['かけだしのスペラー']).includes(t.title);
                    const isEquipped = gameData.equippedTitle === t.title;
                    const canAfford = (gameData.mp || 0) >= t.cost;

                    return (
                      <div
                        key={t.id}
                        className={`bg-slate-900 border rounded-2xl p-2.5 flex items-center justify-between transition-all gap-2 ${
                          isEquipped ? 'border-amber-400 bg-amber-950/30 shadow-[0_0_15px_rgba(251,191,36,0.3)]' : 'border-slate-800'

                      >
                        <div className="flex items-center gap-2 pr-1 min-w-0">
                          <div className="text-xl p-1 bg-black/40 rounded-xl flex-shrink-0">
                            {t.icon}
                          </div>
                          <div className="text-left min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <span className={`text-xs font-black font-mono ${isEquipped ? 'text-amber-300 neon-gold' : 'text-white'}`}>
                                {t.title}
                              </span>
                              <span className="text-[8px] text-slate-400 font-mono">
                                {t.sub}

                            </div>
                            <div className="text-[9px] text-slate-400 mt-0.5 leading-tight">
                              {t.desc}

                        <button

                            if (purchased) {

                            } else if (canAfford) {
                              // 購入 & 自動装備
                              setGameData(p => ({
                                ...p,
                                mp: (p.mp || 0) - t.cost,
                                purchasedTitles: [...(p.purchasedTitles || ['かけだしのスペラー']), t.title],
                                equippedTitle: t.title
                              }));
                              SoundFX.playMastered();
                            }
                          }}
                          disabled={isEquipped || (!purchased && !canAfford)}
                          className={`font-mono font-black text-[10px] sm:text-[11px] px-2.5 py-2 rounded-xl shadow whitespace-nowrap active:scale-95 transition-all min-w-[76px] text-center flex-shrink-0 ${

                              ? 'bg-amber-400 text-black font-black'
                              : purchased
                              ? 'bg-slate-800 text-cyan-300 hover:bg-slate-700 border border-cyan-500/50'

                              : 'bg-slate-800 text-slate-500'
                          }`}
                        >
                          {isEquipped ? '★ 装備中' : purchased ? '装備する' : `${t.cost} MP`}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </>
        )}
      </div>

      <button
        onClick={() => setScreen('menu')}
        className="w-full bg-slate-900 border border-slate-800 text-slate-300 font-bold py-3 rounded-2xl hover:bg-slate-800 text-sm mt-3 font-mono active:scale-98"
      >
        ← メインメニュー
      </button>
    </div>
  );
};

    // ===== src/screens/StatsScreen.jsx =====
const StatsScreen = ({
  words,
  levels = [],
  stats,
  statsFilter,
  setStatsFilter,
  statsSearch,
  setStatsSearch,
  getMasteryType,
  setScreen
}) => {
  // 単語ごとの学習ステータス判定:
  // 不正解(赤), STREAK 1(オレンジ), STREAK 2(黄色), STREAK 3以上=MASTER(緑), 未回答(黒)
  const getWordState = (wId) => {
    const st = stats?.[wId];
    if (!st || !st.tested) return 'unvisited';
    if (st.streak >= 3) return 'master';
    if (st.streak === 2) return 'streak2';
    if (st.streak === 1) return 'streak1';
    return 'wrong'; // tested > 0 && streak === 0
  };

  const getLevelBreakdown = (lvl) => {
    const lvlWords = lvl === 'ALL' ? words : words.filter(w => (w.level || 'デフォルト') === lvl);
    const total = lvlWords.length;
    let master = 0;
    let s2 = 0;
    let s1 = 0;
    let wrong = 0;
    let unvisited = 0;

    lvlWords.forEach(w => {
      const state = getWordState(w.id);
      if (state === 'master') master++;
      else if (state === 'streak2') s2++;
      else if (state === 'streak1') s1++;
      else if (state === 'wrong') wrong++;
      else unvisited++;
    });

    const masterPercent = total > 0 ? Math.round((master / total) * 100) : 0;
    return { total, master, s2, s1, wrong, unvisited, masterPercent };
  };

  const displayLevels = levels.length > 0
    ? levels
    : Array.from(new Set(words.map(w => w.level || 'デフォルト')));

  const filteredWords = words.filter(w => {
    const st = stats[w.id] || { streak: 0 };
    if (statsFilter === 'unmastered' && (st.streak || 0) >= 3) return false;
    if (statsFilter === 'mastered' && (st.streak || 0) < 3) return false;
    if (statsSearch) {
      const q = statsSearch.toLowerCase();
      return w.word.toLowerCase().includes(q) || w.meaning.includes(q);
    }
    return true;
  });

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 animate-fadeIn">
      <div>
        <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
          <button onClick={() => setScreen('menu')} className="text-xs text-indigo-400 font-semibold p-1 active:scale-95">
            ← メニュー
          </button>
          <h2 className="text-base font-bold text-white flex items-center gap-1.5">
            <span>📖 STATS & 進捗</span>
          </h2>
          <div className="w-12"></div>
        </div>

        {/* 全レベル 5色学習進捗バー一覧 */}
        <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 mb-3.5 shadow-sm font-mono text-left">
          <div className="flex items-center justify-between pb-1.5 mb-2 border-b border-slate-800/80">
            <span className="text-[10px] font-bold text-cyan-300 flex items-center gap-1">
              <span>📊 レベル別学習状況</span>
            </span>
            {/* 凡例 */}
            <div className="flex items-center gap-1.5 text-[8px] text-slate-400">
              <span className="text-amber-300 font-bold">👑マスター</span>
              <span className="text-emerald-400 font-bold">🟩2連勝</span>
              <span className="text-sky-400 font-bold">🟦1勝</span>
              <span className="text-rose-400">🟥不正解</span>
              <span className="text-slate-500">⬛未着手</span>
            </div>
          </div>

          <div className="space-y-2.5">
            {displayLevels.map(lvl => {
              const info = getLevelBreakdown(lvl);
              return (
                <div key={lvl} className="bg-black/40 border border-slate-800/80 rounded-xl p-2">
                  <div className="flex items-center justify-between text-[10px] mb-1">
                    <span className="font-bold text-white tracking-wide">{lvl}</span>
                    <span className="text-slate-300">
                      習得率: <strong className="text-amber-300 font-black">{info.masterPercent}%</strong>
                      <span className="text-[8px] text-slate-500 ml-1">({info.master}/{info.total}語)</span>
                    </span>
                  </div>

                  {/* 5色マルチセグメントプログレスバー */}
                  <div className="w-full bg-slate-950 h-2 rounded-full overflow-hidden flex border border-slate-800">
                    {info.master > 0 && (
                      <div style={{ width: `${(info.master / info.total) * 100}%` }} className="bg-amber-400 h-full" title={`マスター: ${info.master}語`} />
                    )}
                    {info.s2 > 0 && (
                      <div style={{ width: `${(info.s2 / info.total) * 100}%` }} className="bg-emerald-400 h-full" title={`STREAK 2: ${info.s2}語`} />
                    )}
                    {info.s1 > 0 && (
                      <div style={{ width: `${(info.s1 / info.total) * 100}%` }} className="bg-sky-400 h-full" title={`STREAK 1: ${info.s1}語`} />
                    )}
                    {info.wrong > 0 && (
                      <div style={{ width: `${(info.wrong / info.total) * 100}%` }} className="bg-rose-500 h-full" title={`不正解: ${info.wrong}語`} />
                    )}
                    {info.unvisited > 0 && (
                      <div style={{ width: `${(info.unvisited / info.total) * 100}%` }} className="bg-slate-900 h-full" title={`未回答: ${info.unvisited}語`} />
                    )}
                  </div>

                  {/* 内訳数字 */}
                  <div className="flex justify-between items-center text-[8px] text-slate-400 mt-1 px-0.5">
                    <span className="text-amber-300 font-bold">👑{info.master}</span>
                    <span className="text-emerald-400 font-bold">🟩{info.s2}</span>
                    <span className="text-sky-400 font-bold">🟦{info.s1}</span>
                    <span className="text-rose-400">🟥{info.wrong}</span>
                    <span className="text-slate-500">⬛{info.unvisited}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* 単語検索 & フィルター */}
        <div className="space-y-2 mb-3">
          <input
            type="text"
            placeholder="Search..."
            value={statsSearch}
            onChange={(e) => setStatsSearch(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:border-cyan-400 font-mono"
          />
          <div className="grid grid-cols-3 gap-1.5">
            <button
              onClick={() => setStatsFilter('all')}
              className={`py-1.5 rounded-lg text-xs font-bold ${
                statsFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'
              }`}
            >
              全て({words.length})
            </button>
            <button
              onClick={() => setStatsFilter('unmastered')}
              className={`py-1.5 rounded-lg text-xs font-bold ${
                statsFilter === 'unmastered' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-slate-400'
              }`}
            >
              未習得
            </button>
            <button
              onClick={() => setStatsFilter('mastered')}
              className={`py-1.5 rounded-lg text-xs font-bold ${
                statsFilter === 'mastered' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400'
              }`}
            >
              マスター
            </button>
          </div>
        </div>

        {/* 単語リスト */}
        <div className="space-y-2 max-h-[38vh] overflow-y-auto pr-1">
          {filteredWords.map(w => {
            const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
            const mType = getMasteryType(w.id);
            const isMaster = st.streak >= 3;
            return (
              <div key={w.id} className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                <div className="text-left pr-2">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-white text-sm font-mono tracking-wide">{w.word}</span>
                    <span className="text-[10px] text-slate-500">{w.pos}</span>
                    {isMaster && (
                      <span
                        className={`text-[9px] px-1 py-0.5 rounded font-mono font-bold ${
                          mType === 'pure' ? 'bg-cyan-950 text-cyan-300' : 'bg-amber-950 text-amber-300'
                        }`}
                      >
                        {mType === 'pure' ? '✨ PURE' : '🛡️ SURVIVOR'}
                      </span>
                    )}
                  </div>
                  <div className="text-xs text-slate-300 mt-0.5">{w.meaning}</div>
                </div>
                <div className="text-right font-mono text-[11px] whitespace-nowrap">
                  <div className="text-amber-400 font-bold">🔥 {st.streak || 0}/3</div>
                  <div className="text-slate-500 text-[9px]">誤答: {st.wrong || 0}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <button
        onClick={() => setScreen('menu')}
        className="w-full bg-slate-900 border border-slate-800 text-slate-300 font-bold py-3 rounded-2xl hover:bg-slate-800 text-sm mt-3 font-mono active:scale-98"
      >
        ← メインメニュー
      </button>
    </div>
  );
};

            <button

    // ===== src/screens/BackupScreen.jsx =====
const BackupScreen = ({
  words,
  setWords,
  levels,
  setLevels,
  stats,
  setStats,
  gameData,
  setGameData,
  dailyLogs,
  setDailyLogs,
  sessionLogs,
  setSessionLogs,
  backupStatus,
  setBackupStatus,
  setScreen
}) => {
  const [pasteText, setPasteText] = useState('');
  const [copied, setCopied] = useState(false);

  const getBackupJson = () => {
    const fullBackup = {
      words,
      levels,
      stats,
      gameData,
      dailyLogs,
      sessionLogs,
      backupDate: new Date().toISOString()
    };
    return JSON.stringify(fullBackup, null, 2);
  };

  const handleExportAll = () => {
    try {
      const jsonStr = getBackupJson();
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `spell_master_backup_${getLocalDateStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      setBackupStatus('✅ ダウンロードを開始しました');
    } catch (e) {
      setBackupStatus('❌ 失敗: ' + e.message);
    }
  };

  const handleCopyToClipboard = async () => {
    try {
      const jsonStr = getBackupJson();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(jsonStr);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = jsonStr;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
      setCopied(true);
      setBackupStatus('📋 クリップボードにコピーしました！メモ帳等に保存できます');
      setTimeout(() => setCopied(false), 3000);
    } catch (e) {
      setBackupStatus('❌ コピー失敗: ' + e.message);
    }
  };

  const applyRestoredData = (data) => {
    if (data.words) setWords(data.words);
    if (data.levels) setLevels(data.levels);
    if (data.stats) setStats(data.stats);
    if (data.gameData) setGameData(data.gameData);
    if (data.dailyLogs) setDailyLogs(data.dailyLogs);
    if (data.sessionLogs) setSessionLogs(data.sessionLogs);
    setBackupStatus('✅ データを正常に復元しました！');
  };

  const handleImportBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        applyRestoredData(data);
      } catch (err) {
        setBackupStatus('❌ ファイルの復元に失敗しました（JSON形式が無効です）');
      }
    };
    reader.readAsText(file);
  };

  const handleRestoreFromText = () => {
    if (!pasteText.trim()) return;
    try {
      const data = JSON.parse(pasteText.trim());
      applyRestoredData(data);
      setPasteText('');
    } catch (err) {
      setBackupStatus('❌ 貼り付けテキストの復元に失敗しました（JSON形式が無効です）');
    }
  };

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 animate-fadeIn">
      <div>
        <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
          <button onClick={() => setScreen('menu')} className="text-xs text-indigo-400 font-semibold p-1">
            ← メニュー
          </button>
          <h2 className="text-base font-bold text-white flex items-center gap-1.5">
            <span>🛡️ 保存 & 復元</span>
          </h2>
          <div className="w-12"></div>
        </div>

        <div className="space-y-4 text-left">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <h3 className="text-sm font-bold text-white mb-2 font-mono">1. バックアップ書き出し</h3>
            <div className="space-y-2">
              <button
                onClick={handleCopyToClipboard}
                className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-mono font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors"
              >
                <span>{copied ? '✅ コピー完了！' : '📋 クリップボードにコピー'}</span>
              </button>
              <button
                onClick={handleExportAll}
                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-mono font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors"
              >
                <span>💾 JSONダウンロード</span>
              </button>
            </div>
            <p className="text-[10px] text-slate-500 font-mono mt-2">
              ※ スマホでは「クリップボードにコピー」してメモ帳やLINEに控える方法が最も確実です。
            </p>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <h3 className="text-sm font-bold text-white mb-2 font-mono">2. 復元</h3>
            <div className="space-y-3">
              <div>
                <label className="block text-[11px] font-mono text-slate-400 mb-1">
                  方法A: テキスト貼り付けで復元
                </label>
                <textarea
                  rows={3}
                  placeholder="バックアップのJSONテキストをここに貼り付け"
                  value={pasteText}
                  onChange={(e) => setPasteText(e.target.value)}
                  className="w-full bg-black/60 border border-slate-700 rounded-xl p-2.5 text-xs text-cyan-300 font-mono focus:outline-none focus:border-cyan-500"
                />
                <button
                  onClick={handleRestoreFromText}
                  disabled={!pasteText.trim()}
                  className="w-full mt-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-mono font-bold py-2 rounded-xl text-xs transition-colors"
                >
                  📥 貼り付けたデータから復元
                </button>
              </div>

              <div className="pt-2 border-t border-slate-800">
                <label className="block text-[11px] font-mono text-slate-400 mb-1">
                  方法B: ファイルから復元
                </label>
                <input
                  type="file"
                  accept=".json"
                  onChange={handleImportBackup}
                  className="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"
                />
              </div>
            </div>
          </div>

          {backupStatus && (
            <div className="bg-black/60 border border-slate-700 rounded-xl p-3 text-xs text-center font-mono">
              {backupStatus}
            </div>
          )}
        </div>
      </div>

      <button
        onClick={() => setScreen('menu')}
        className="w-full bg-slate-900 border border-slate-800 text-slate-300 font-bold py-3 rounded-2xl hover:bg-slate-800 text-sm mt-3 font-mono"
      >
        ← メインメニュー
      </button>
    </div>
  );
};
