<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spelling Master - 10問1セット英単語スペル特訓</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti for celebratory explosions -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- React & Babel CDNs for standalone browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Mobile-first gaming & cyber styling */
    input:focus {
      outline: none;
    }
    .mobile-input {
      font-size: 1.35rem !important;
      letter-spacing: 0.1em;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #4f46e5;
      border-radius: 4px;
    }

    /* サイバー感あふれる光彩・アニメーション */
    @keyframes neonPulse {
      0%, 100% { text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899, 0 0 30px #f43f5e; }
      50% { text-shadow: 0 0 15px #06b6d4, 0 0 30px #3b82f6, 0 0 45px #6366f1; }
    }
    .neon-gold {
      text-shadow: 0 0 15px #f59e0b, 0 0 30px #d97706, 0 0 45px #b45309;
    }
    .cyber-title {
      animation: neonPulse 3s infinite alternate;
    }
    .glow-cyan {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.2);
    }
    .glow-gold {
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), inset 0 0 15px rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body class="bg-[#05070f] text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-black font-sans antialiased overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- 初期プリセット単語（レベル付き） ---
    const DEFAULT_VOCABULARY = [
      { id: '1', level: '初中級・頻出', word: 'definitely', meaning: '絶対に、間違いなく', pos: '副詞', example: 'I will definitely be there.' },
      { id: '2', level: '初中級・頻出', word: 'separate', meaning: '分ける、別々の', pos: '形容詞/動詞', example: 'Please keep these in separate boxes.' },
      { id: '3', level: '初中級・頻出', word: 'necessary', meaning: '必要な、不可欠な', pos: '形容詞', example: 'Water is necessary for life.' },
      { id: '4', level: '初中級・頻出', word: 'calendar', meaning: 'カレンダー、暦', pos: '名詞', example: 'Check the date on your calendar.' },
      { id: '5', level: '初中級・頻出', word: 'receive', meaning: '受け取る', pos: '動詞', example: 'Did you receive my email?' },
      { id: '6', level: '初中級・頻出', word: 'restaurant', meaning: 'レストラン、飲食店', pos: '名詞', example: 'Let us eat at an Italian restaurant.' },
      { id: '7', level: '初中級・頻出', word: 'schedule', meaning: '日程、予定', pos: '名詞/動詞', example: 'The meeting is on schedule.' },
      { id: '8', level: '初中級・頻出', word: 'recommend', meaning: '勧める、推薦する', pos: '動詞', example: 'Can you recommend a good book?' },
      { id: '9', level: '初中級・頻出', word: 'government', meaning: '政府、行政', pos: '名詞', example: 'The government passed a new law.' },
      { id: '10', level: '初中級・頻出', word: 'beginning', meaning: '始まり、初め', pos: '名詞', example: 'This is just the beginning.' },

      { id: '11', level: '上級・スペル難関', word: 'accommodate', meaning: '収容する、便宜を図る', pos: '動詞', example: 'The hotel can accommodate 500 guests.' },
      { id: '12', level: '上級・スペル難関', word: 'embarrass', meaning: '恥ずかしい思いをさせる', pos: '動詞', example: 'I did not mean to embarrass you.' },
      { id: '13', level: '上級・スペル難関', word: 'rhythm', meaning: 'リズム、調子', pos: '名詞', example: 'She has a natural sense of rhythm.' },
      { id: '14', level: '上級・スペル難関', word: 'colleague', meaning: '同僚', pos: '名詞', example: 'I discussed the project with my colleague.' },
      { id: '15', level: '上級・スペル難関', word: 'privilege', meaning: '特権、名誉', pos: '名詞', example: 'It was a privilege to meet you.' },
      { id: '16', level: '上級・スペル難関', word: 'bureaucracy', meaning: '官僚制、お役所仕事', pos: '名詞', example: 'There is too much bureaucracy.' },
      { id: '17', level: '上級・スペル難関', word: 'conscience', meaning: '良心、道義心', pos: '名詞', example: 'He had a clear conscience.' },
      { id: '18', level: '上級・スペル難関', word: 'occurrence', meaning: '出来事、発生', pos: '名詞', example: 'It was an everyday occurrence.' },
      { id: '19', level: '上級・スペル難関', word: 'exaggerate', meaning: '誇張する、大げさに言う', pos: '動詞', example: 'Do not exaggerate the problem.' },
      { id: '20', level: '上級・スペル難関', word: 'parallel', meaning: '平行の、類似の', pos: '形容詞', example: 'The two lines are parallel.' }
    ];

    const DEFAULT_LEVELS = ['初中級・頻出', '上級・スペル難関'];

    const STORAGE_KEY_WORDS = 'spelling_app_words_v2';
    const STORAGE_KEY_LEVELS = 'spelling_app_levels_v2';
    const STORAGE_KEY_STATS = 'spelling_app_stats_v2';

    // 安全なローカルストレージ読み書きヘルパー（エラーでデータが蒸発するのを防止）
    const safeStorage = {
      get: (key, fallback) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : fallback;
        } catch (e) {
          console.warn(`Storage get error for ${key}:`, e);
          return fallback;
        }
      },
      set: (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          console.error(`Storage set error for ${key}:`, e);
        }
      }
    };

    // 音声発音ヘルパー（Web Speech API）
    const speakWord = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    };

    // 1文字ごとの差分ハイライト
    const DiffViewer = ({ userInput, correctWord }) => {
      const userChars = userInput.split('');
      const targetChars = correctWord.toLowerCase().split('');

      return (
        <div className="bg-black/70 border-2 border-slate-800 rounded-xl p-3 my-2 text-center shadow-inner">
          <div className="text-[11px] text-slate-400 mb-1 font-bold tracking-widest uppercase">SPELL COMPARISON</div>
          
          <div className="font-mono text-xl tracking-widest mb-2 flex items-center justify-center flex-wrap gap-1">
            <span className="text-xs text-rose-400 mr-1 font-bold">YOUR:</span>
            {userChars.map((char, idx) => {
              const isMatch = targetChars[idx] === char.toLowerCase();
              return (
                <span
                  key={idx}
                  className={`inline-block px-2 py-0.5 rounded font-black border ${
                    isMatch ? 'bg-cyan-950/80 text-cyan-300 border-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.6)]' : 'bg-rose-950/90 text-rose-400 border-rose-600 shadow-[0_0_8px_rgba(244,63,94,0.6)]'
                  }`}
                >
                  {char}
                </span>
              );
            })}
            {userChars.length === 0 && <span className="text-slate-500 italic text-sm">(EMPTY)</span>}
          </div>

          <div className="font-mono text-2xl tracking-widest text-emerald-400 font-black flex items-center justify-center flex-wrap gap-1">
            <span className="text-xs text-emerald-400 mr-1 font-bold">TARGET:</span>
            {targetChars.map((char, idx) => {
              const isWrong = userChars[idx]?.toLowerCase() !== char;
              return (
                <span
                  key={idx}
                  className={`inline-block px-1.5 py-0.5 rounded ${
                    isWrong ? 'bg-emerald-500/30 text-emerald-300 underline decoration-cyan-400 decoration-4 shadow-[0_0_12px_rgba(16,185,129,0.8)]' : 'text-emerald-400'
                  }`}
                >
                  {char}
                </span>
              );
            })}
          </div>
        </div>
      );
    };

    function App() {
      const [screen, setScreen] = useState('menu'); // 'menu' | 'quiz' | 'result' | 'stats' | 'import' | 'levels' | 'backup'

      // レベル一覧
      const [levels, setLevels] = useState(() => {
        return safeStorage.get(STORAGE_KEY_LEVELS, DEFAULT_LEVELS);
      });

      // 単語マスターデータ
      const [words, setWords] = useState(() => {
        return safeStorage.get(STORAGE_KEY_WORDS, DEFAULT_VOCABULARY);
      });

      // 単語ごとの統計 { [wordId]: { tested: number, wrong: number, streak: number, lastDate: string } }
      const [stats, setStats] = useState(() => {
        return safeStorage.get(STORAGE_KEY_STATS, {});
      });

      // 選択中のレベルフィルタ ('ALL' または 特定のレベル名)
      const [selectedLevel, setSelectedLevel] = useState('ALL');

      // クイズ実行ステート
      const [quizList, setQuizList] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [inputVal, setInputVal] = useState('');
      const [answerStatus, setAnswerStatus] = useState(null);
      const [sessionResults, setSessionResults] = useState([]);
      const [isWeakMode, setIsWeakMode] = useState(false);
      const [isEndlessMode, setIsEndlessMode] = useState(false);
      const [endlessCombo, setEndlessCombo] = useState(0);
      const [maxEndlessCombo, setMaxEndlessCombo] = useState(0);
      const [showHint, setShowHint] = useState(false);
      const [showQuitModal, setShowQuitModal] = useState(false);

      // CSV & レベル管理用
      const [targetLevelForImport, setTargetLevelForImport] = useState(levels[0] || 'デフォルト');
      const [customLevelInput, setCustomLevelInput] = useState('');
      const [csvText, setCsvText] = useState('');
      const [importError, setImportError] = useState('');

      // バックアップ画面用ステート
      const [backupStatus, setBackupStatus] = useState('');

      // レベル管理画面用
      const [newLevelName, setNewLevelName] = useState('');

      // 単語帳一覧画面用
      const [statsFilter, setStatsFilter] = useState('all'); // 'all' | 'unmastered' | 'mastered'
      const [statsSearch, setStatsSearch] = useState('');

      const inputRef = useRef(null);

      // 安全保存の実行
      useEffect(() => {
        safeStorage.set(STORAGE_KEY_WORDS, words);
      }, [words]);

      useEffect(() => {
        safeStorage.set(STORAGE_KEY_LEVELS, levels);
      }, [levels]);

      useEffect(() => {
        safeStorage.set(STORAGE_KEY_STATS, stats);
      }, [stats]);

      useEffect(() => {
        if (screen === 'quiz' && answerStatus === null) {
          setInputVal('');
          setShowHint(false);
          setTimeout(() => {
            inputRef.current?.focus();
          }, 100);
        }
      }, [screen, currentIndex, answerStatus]);

      // 3回連続正解で習得済み判定
      const isMastered = (wordId) => {
        return (stats[wordId]?.streak || 0) >= 3;
      };

      // --- 重み付きクイズ選出ロジック ---
      const startQuiz = (mode = 'normal', customList = null) => {
        let pool = [];
        setIsEndlessMode(mode === 'endless');
        setEndlessCombo(0);
        setMaxEndlessCombo(0);

        if (customList) {
          pool = [...customList];
        } else {
          // レベルによるフィルタリング
          let candidateWords = selectedLevel === 'ALL'
            ? [...words]
            : words.filter(w => (w.level || 'デフォルト') === selectedLevel);

          if (candidateWords.length === 0) {
            return;
          }

          if (mode === 'weak') {
            const scored = candidateWords.map(w => {
              const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
              const weight = (st.wrong * 4) + (3 - Math.min(st.streak, 3)) * 3 + (st.tested === 0 ? 5 : 0);
              return { ...w, weight, wrong: st.wrong, streak: st.streak };
            });

            const weakPool = scored.filter(w => w.streak < 3 || w.wrong > 0);
            const target = weakPool.length >= 5 ? weakPool : scored;
            pool = [...target].sort((a, b) => b.weight - a.weight);
            setIsWeakMode(true);
          } else if (mode === 'endless') {
            // エンドレスモード：未習得単語を優先しつつ全単語をシャッフル
            const scored = candidateWords.map(w => {
              const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
              const weight = st.streak >= 3 ? 2 : (8 + st.wrong * 2);
              return { ...w, finalWeight: weight * (0.7 + Math.random() * 0.6) };
            });
            pool = scored.sort((a, b) => b.finalWeight - a.finalWeight);
            setIsWeakMode(false);
          } else {
            const scored = candidateWords.map(w => {
              const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
              let weight = 10;

              if (st.streak >= 3) {
                weight = 1;
              } else if (st.tested === 0) {
                weight = 12;
              } else {
                weight = 10 + (st.wrong * 3) + (3 - st.streak) * 2;
              }
              return { ...w, finalWeight: weight * (0.8 + Math.random() * 0.4) };
            });

            pool = scored.sort((a, b) => b.finalWeight - a.finalWeight);
            setIsWeakMode(false);
          }
        }

        // 通常・弱点は10問、エンドレスは候補すべて（または最低10個）をセット
        const count = mode === 'endless' ? Math.max(pool.length, 15) : 10;
        const selected = mode === 'endless'
          ? pool.sort(() => Math.random() - 0.5)
          : pool.slice(0, 10).sort(() => Math.random() - 0.5);

        if (selected.length === 0) {
          return;
        }

        setQuizList(selected);
        setCurrentIndex(0);
        setSessionResults([]);
        setAnswerStatus(null);
        setShowQuitModal(false);
        setScreen('quiz');
      };

      // --- 回答提出ロジック ---
      const handleSubmitAnswer = (e) => {
        if (e) e.preventDefault();
        if (answerStatus !== null) return;

        const currentWord = quizList[currentIndex];
        if (!currentWord) return;

        const trimmedInput = inputVal.trim().toLowerCase();
        const correctTarget = currentWord.word.trim().toLowerCase();
        const isCorrect = trimmedInput === correctTarget;

        speakWord(currentWord.word);

        // 連続正解（streak）の計算
        const curStat = stats[currentWord.id] || { tested: 0, wrong: 0, streak: 0 };
        const newStreak = isCorrect ? (curStat.streak || 0) + 1 : 0;

        // エンドレスコンボの更新
        if (isEndlessMode) {
          if (isCorrect) {
            setEndlessCombo(prev => {
              const updated = prev + 1;
              setMaxEndlessCombo(m => Math.max(m, updated));
              return updated;
            });
          } else {
            setEndlessCombo(0);
          }
        }

        const newStats = {
          ...stats,
          [currentWord.id]: {
            tested: curStat.tested + 1,
            wrong: isCorrect ? curStat.wrong : curStat.wrong + 1,
            streak: newStreak,
            lastDate: new Date().toISOString()
          }
        };
        setStats(newStats);

        setSessionResults(prev => [
          ...prev,
          {
            word: currentWord,
            userInput: inputVal.trim(),
            isCorrect,
            newStreak,
            justMastered: isCorrect && newStreak === 3
          }
        ]);

        setAnswerStatus(isCorrect ? 'correct' : 'incorrect');

        // 正解かつ連続正解時はミニ紙吹雪エフェクト
        if (isCorrect && window.confetti) {
          window.confetti({
            particleCount: newStreak >= 3 ? 45 : 20,
            spread: 60,
            origin: { y: 0.7 }
          });
        }
      };

      // 次の問題へ遷移（エンドレスなら問題補充して無限ループ）
      const handleNextQuestion = () => {
        const nextIdx = currentIndex + 1;

        if (isEndlessMode) {
          // エンドレスモード：次の問題へ進む。プール終端に近づいたら再補充
          if (nextIdx >= quizList.length) {
            let candidateWords = selectedLevel === 'ALL'
              ? [...words]
              : words.filter(w => (w.level || 'デフォルト') === selectedLevel);
            const reshuffled = [...candidateWords].sort(() => Math.random() - 0.5);
            setQuizList(prev => [...prev, ...reshuffled]);
          }
          setCurrentIndex(nextIdx);
          setAnswerStatus(null);
        } else {
          // 通常10問モード
          if (nextIdx < quizList.length && nextIdx < 10) {
            setCurrentIndex(nextIdx);
            setAnswerStatus(null);
          } else {
            setScreen('result');
          }
        }
      };

      // 途中で終了して結果を見る / または戻る
      const handleForceQuit = (viewResult = true) => {
        setShowQuitModal(false);
        if (viewResult && sessionResults.length > 0) {
          setScreen('result');
        } else {
          setScreen('menu');
        }
      };

      const retryMistakesOnly = () => {
        const mistakes = sessionResults
          .filter(r => !r.isCorrect)
          .map(r => r.word);
        if (mistakes.length === 0) return;
        startQuiz('normal', mistakes);
      };

      // --- CSVインポート処理 ---
      const handleImportCSV = (textToImport, targetLevel) => {
        try {
          const lines = textToImport.trim().split(/\r\n|\n/);
          const newEntries = [];
          const effectiveLevel = targetLevel.trim() || '一般';

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            if (i === 0 && (line.toLowerCase().startsWith('word') || line.includes('英単語'))) {
              continue;
            }

            const parts = line.split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
            if (parts.length >= 2) {
              const [w, m, rowLevel, pos, ex] = parts;
              if (w && m) {
                // CSV行にレベル指定があればそれを使い、なければ選択中のtargetLevel
                const assignedLevel = rowLevel && rowLevel.length > 0 ? rowLevel : effectiveLevel;

                newEntries.push({
                  id: 'word_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                  level: assignedLevel,
                  word: w,
                  meaning: m,
                  pos: pos || 'その他',
                  example: ex || ''
                });
              }
            }
          }

          if (newEntries.length === 0) {
            setImportError('有効なデータが見つかりませんでした。「単語,意味」形式で入力してください。');
            return;
          }

          // レベル一覧の更新（新規レベルが含まれる場合に追加）
          const importedLevels = [...new Set(newEntries.map(e => e.level))];
          setLevels(prev => {
            const set = new Set([...prev, ...importedLevels, effectiveLevel]);
            return Array.from(set);
          });

          // 単語マスターの更新
          setWords(prev => {
            const existingMap = new Set(prev.map(p => p.word.toLowerCase()));
            const filteredNew = newEntries.filter(n => !existingMap.has(n.word.toLowerCase()));
            return [...prev, ...filteredNew];
          });

          setImportError('');
          setCsvText('');
          alert(`${newEntries.length}件の単語をレベル「${effectiveLevel}」に登録しました！`);
          setScreen('menu');
        } catch (err) {
          setImportError('CSV解析エラー: ' + err.message);
        }
      };

      // CSVファイル読み込み
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const lvl = customLevelInput.trim() || targetLevelForImport;
          handleImportCSV(evt.target.result, lvl);
        };
        reader.readAsText(file);
      };

      // レベルごとの習得進捗計算
      const getLevelMasteryInfo = (lvlName) => {
        const targetWords = lvlName === 'ALL'
          ? words
          : words.filter(w => (w.level || 'デフォルト') === lvlName);

        const total = targetWords.length;
        const masteredCount = targetWords.filter(w => (stats[w.id]?.streak || 0) >= 3).length;
        const percent = total > 0 ? Math.round((masteredCount / total) * 100) : 0;

        return { total, masteredCount, percent };
      };

      // -----------------------------------------------------------------
      // RENDER: メインメニュー
      // -----------------------------------------------------------------
      if (screen === 'menu') {
        const currentStats = getLevelMasteryInfo(selectedLevel);

        return (
          <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-8">
            <header className="pt-4 pb-2 text-center relative">
              <div className="absolute top-1 right-2 px-2 py-0.5 rounded bg-cyan-950 border border-cyan-500/50 text-[10px] text-cyan-400 font-mono tracking-widest uppercase">
                READY TO BATTLE
              </div>
              <div className="inline-flex items-center justify-center p-3.5 bg-gradient-to-tr from-cyan-600 via-indigo-600 to-pink-500 text-white rounded-2xl mb-2 shadow-[0_0_25px_rgba(79,70,229,0.5)] border border-indigo-400/40">
                <span className="text-3xl">⚔️</span>
              </div>
              <h1 className="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-300 to-pink-400 cyber-title uppercase">
                SPELL BLASTER
              </h1>
              <p className="text-slate-400 text-xs font-mono tracking-widest mt-0.5 text-cyan-300/80">
                [ 10問1セット / 3連続で完全撃破 ]
              </p>
            </header>

            {/* レベル選択セレクト */}
            <div className="bg-slate-900/90 border-2 border-indigo-500/40 rounded-2xl p-3.5 mb-3 glow-cyan relative overflow-hidden backdrop-blur">
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-[11px] font-black text-cyan-400 tracking-widest uppercase flex items-center gap-1">
                  <span>⚡</span> MISSION LEVEL
                </span>
                <button
                  onClick={() => setScreen('levels')}
                  className="text-[11px] text-pink-400 hover:text-pink-300 font-bold bg-pink-950/60 px-2 py-0.5 rounded border border-pink-700/50"
                >
                  ＋ レベル設定
                </button>
              </div>
              <select
                value={selectedLevel}

              >

                  <div className="text-xs text-cyan-100 font-medium mt-0.5">未習得・苦手な単語を優先して出撃！</div>

              </button>

              <button
                onClick={() => startQuiz('weak')}

              >
                <div className="text-left">
                  <div className="text-lg flex items-center gap-2 tracking-wide font-black">
                    <span>🔥 弱点 撃滅モード</span>
                    <span className="text-xs bg-amber-400 text-black px-2 py-0.5 rounded-full font-mono font-bold">HARD</span>

              <button
                onClick={() => startQuiz('endless')}
                className="w-full bg-gradient-to-r from-purple-700 via-fuchsia-600 to-pink-600 active:scale-[0.98] text-white font-black py-3.5 px-5 rounded-2xl shadow-[0_0_25px_rgba(217,70,239,0.5)] border border-fuchsia-400/70 flex items-center justify-between transition-all"

                <div className="text-left">
                  <div className="text-lg flex items-center gap-2 tracking-wide font-black">
                    <span>∞ エンドレス無双モード</span>
                    <span className="text-xs bg-pink-300 text-black px-2 py-0.5 rounded-full font-mono font-bold">INFINITY</span>
                  </div>

              </button>

              <button
                onClick={() => setScreen('stats')}
                className="w-full bg-slate-900/90 border border-slate-700 hover:border-cyan-500 text-slate-200 font-bold py-3 px-5 rounded-2xl flex items-center justify-between active:bg-slate-800 transition-all text-sm font-mono"

                <div className="flex items-center gap-2">
                  <span>📊</span>
                  <span>単語図鑑 & ストリーク確認</span>
                </div>

              </button>
            </div>

            {/* フッターナビ */}
            <div className="mt-4 pt-3 border-t border-slate-800/80 grid grid-cols-3 gap-1 text-center text-xs text-slate-400 font-mono">

                <span>💾 CSV追加</span>

              </button>

                onClick={() => setScreen('backup')}

                <span>🛡️ 保存/復元</span>
              </button>
            </div>
          </div>
        );
      }

      // -----------------------------------------------------------------
      // RENDER: クイズ出題画面 (Quitボタン & 10問/エンドレス対応)
      // -----------------------------------------------------------------
      if (screen === 'quiz') {
        const currentWord = quizList[currentIndex] || { word: '', meaning: '' };
        const currentNumber = currentIndex + 1;
        const totalQuestions = quizList.length;
        const progressPercent = isEndlessMode ? 100 : (currentNumber / 10) * 100;
        const currentStreak = stats[currentWord.id]?.streak || 0;

        return (
          <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 relative">
            {/* 上部ヘッダー & Quitボタン */}
            <div>
              <div className="flex items-center justify-between text-xs mb-2">
                <button
                  type="button"
                  onClick={() => setShowQuitModal(true)}
                  className="px-3 py-1 bg-rose-950/80 hover:bg-rose-900 border border-rose-600/70 text-rose-300 rounded-xl font-bold font-mono tracking-wider active:scale-95 transition-all flex items-center gap-1 shadow-[0_0_10px_rgba(244,63,94,0.4)]"
                >
                  <span>⏹</span> QUIT (終了)
                </button>

                {isEndlessMode ? (
                  <div className="font-mono font-black text-sm tracking-wider text-pink-400 flex items-center gap-1.5 animate-pulse">
                    <span>⚡ DEFEATED:</span>
                    <span className="text-xl text-yellow-300 font-mono font-black">{sessionResults.length}</span>
                  </div>
                ) : (
                  <div className="font-mono font-black text-base tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-300">
                    STAGE <span className="text-xl text-yellow-300">{currentNumber}</span> <span className="text-slate-600">/</span> 10
                  </div>
                )}

                <div className={`font-mono text-xs px-2.5 py-0.5 rounded font-black border ${
                  isEndlessMode
                    ? 'bg-fuchsia-950 text-fuchsia-300 border-fuchsia-500 shadow-[0_0_8px_rgba(217,70,239,0.7)]'
                    : isWeakMode
                    ? 'bg-red-950 text-amber-300 border-amber-600'
                    : 'bg-slate-900 text-cyan-400 border-slate-700'
                }`}>
                  {isEndlessMode ? '∞ INFINITY' : isWeakMode ? '🔥 WEAK' : '⚡ NORMAL'}
                </div>
              </div>

              {/* ゲーミングプログレスバー / エンドレス時はコンボバー */}
              <div className="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-800 p-0.5 shadow-inner">
                <div
                  className={`h-full transition-all duration-300 rounded-full ${
                    isEndlessMode
                      ? 'bg-gradient-to-r from-purple-500 via-pink-500 to-amber-400 shadow-[0_0_12px_rgba(236,72,153,0.9)] animate-pulse'
                      : isWeakMode 
                      ? 'bg-gradient-to-r from-red-600 to-amber-500 shadow-[0_0_12px_rgba(239,68,68,0.8)]' 
                      : 'bg-gradient-to-r from-cyan-500 via-indigo-500 to-pink-500 shadow-[0_0_12px_rgba(6,182,212,0.8)]'
                  }`}
                  style={{ width: `${Math.min(progressPercent, 100)}%` }}
                />
              </div>

              {/* エンドレス専用コンボバッジ */}
              {isEndlessMode && endlessCombo > 0 && (
                <div className="mt-1 text-center font-mono text-xs font-black text-amber-300 tracking-wider">
                  🔥 {endlessCombo} COMBO STREAK!! (MAX: {maxEndlessCombo})
                </div>
              )}
            </div>

            {/* 問題カード */}
            <div className="my-auto py-2">
              <div className="bg-slate-900/95 border-2 border-indigo-500/50 rounded-3xl p-5 shadow-[0_0_25px_rgba(99,102,241,0.25)] relative overflow-hidden backdrop-blur">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-1.5">
                    <span className="text-[10px] font-black uppercase px-2 py-0.5 bg-indigo-950 text-indigo-300 rounded border border-indigo-700/60 font-mono">
                      {currentWord.level || 'LV.1'}
                    </span>
                    {currentWord.pos && (
                      <span className="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">
                        {currentWord.pos}
                      </span>

                  </div>

                  {/* 連続正解ストリーク */}
                  <div className="flex items-center gap-1 font-mono text-xs font-black">
                    <span className="text-slate-400">STREAK:</span>
                    <span className={`px-2 py-0.5 rounded border ${
                      currentStreak >= 3 
                        ? 'bg-emerald-950 text-emerald-300 border-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.7)]' 
                        : 'bg-amber-950/80 text-amber-300 border-amber-600/60'
                    }`}>
                      {currentStreak >= 3 ? '★ MASTER (3/3)' : `🔥 ${currentStreak} / 3`}
                    </span>
                  </div>
                </div>

                <div className="text-center py-2">
                  <div className="text-[11px] font-mono text-slate-400 tracking-widest uppercase mb-1">JAPANESE MEANING</div>
                  <h2 className="text-2xl sm:text-3xl font-black text-white leading-snug tracking-tight">
                    {currentWord.meaning}
                  </h2>
                </div>

                {currentWord.example && (
                  <p className="text-xs text-slate-400 italic my-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center font-mono">
                    "{currentWord.example.replace(new RegExp(currentWord.word, 'gi'), '_____')}"
                  </p>
                )}

                <div className="flex items-center justify-between text-xs mt-2 pt-2 border-t border-slate-800/80 font-mono">
                  <span className="text-slate-400">
                    LENGTH: <strong className="text-cyan-400 text-sm font-black">{currentWord.word.length}</strong> LETTERS
                  </span>
                  {!showHint ? (
                    <button
                      type="button"
                      onClick={() => setShowHint(true)}
                      className="text-xs text-amber-400 hover:text-amber-300 font-bold flex items-center gap-1 bg-amber-950/50 px-2 py-1 rounded border border-amber-600/40"

                      <span>💡 1文字ヒント</span>
                    </button>
                  ) : (
                    <span className="text-amber-300 font-mono font-black text-sm tracking-widest bg-amber-950 px-2 py-0.5 rounded border border-amber-500">

                    </span>
                  )}
                </div>

                {/* 判定後の結果フィードバック */}
                {answerStatus !== null && (
                  <div className="mt-3 pt-3 border-t-2 border-slate-800 animate-fadeIn">
                    <div className="flex items-center justify-between mb-2">
                      <div>

                      >
                        🔊 VOICE
                      </button>
                    </div>

                    <DiffViewer userInput={inputVal} correctWord={currentWord.word} />
                  </div>
                )}
              </div>
            </div>

            {/* 入力フォーム / 次へボタン */}
            <div className="space-y-3">
              {answerStatus === null ? (
                <form onSubmit={handleSubmitAnswer} className="space-y-3">
                  <div className="relative">
                    <input
                      ref={inputRef}
                      type="text"
                      inputMode="email"
                      autoCapitalize="none"
                      autoCorrect="off"
                      spellCheck="false"
                      placeholder="ENTER SPELL..."
                      value={inputVal}
                      onChange={(e) => setInputVal(e.target.value)}
                      className="mobile-input w-full bg-black/90 border-2 border-cyan-500/70 focus:border-pink-500 rounded-2xl px-5 py-4 text-cyan-300 font-mono font-bold placeholder:text-slate-600 shadow-[0_0_15px_rgba(6,182,212,0.3)] tracking-widest text-center"
                    />
                    {inputVal.length > 0 && (
                      <button
                        type="button"
                        onClick={() => setInputVal('')}
                        className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 p-2 text-lg"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  <button
                    type="submit"
                    disabled={inputVal.trim().length === 0}
                    className="w-full bg-gradient-to-r from-cyan-500 via-indigo-600 to-pink-500 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-600 hover:brightness-110 text-white font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(99,102,241,0.5)] transition-all text-lg tracking-wider active:scale-[0.98] uppercase"
                  >
                    ATTACK (判定する)
                  </button>

                <button
                  type="button"
                  onClick={handleNextQuestion}

                  className="w-full bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 hover:brightness-110 text-black font-black py-4 rounded-2xl shadow-[0_0_25px_rgba(16,185,129,0.7)] text-lg flex items-center justify-center gap-2 transition-all active:scale-[0.98] uppercase tracking-wider"
                >
                  <span>{isEndlessMode ? 'NEXT TARGET (次の討伐へ) ⚡' : (currentIndex + 1 < 10 ? 'NEXT STAGE (次の問題へ) →' : 'SHOW RESULT (10問リザルト) 🏆')}</span>
                </button>
              )}
            </div>

            {/* 中断 (Quit) 確認モーダル */}
            {showQuitModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-slate-900 border-2 border-rose-500 rounded-3xl p-6 max-w-sm w-full text-center shadow-[0_0_30px_rgba(244,63,94,0.5)]">

                  <h3 className="text-xl font-black text-white mb-1 uppercase tracking-wide">
                    QUIT {isEndlessMode ? 'ENDLESS' : 'TEST'}?
                  </h3>
                  <p className="text-slate-300 text-xs mb-5">
                    ここで終了しますか？<br/>
                    ここまでの回答記録（{sessionResults.length}問分）でリザルトを確認できます。
                  </p>

                  <div className="space-y-2">
                    {sessionResults.length > 0 && (
                      <button
                        type="button"
                        onClick={() => handleForceQuit(true)}
                        className="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:brightness-110 text-white font-bold py-3 rounded-xl text-sm"
                      >
                        戦果を確認して終了 ({sessionResults.length}問 撃破)
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => handleForceQuit(false)}
                      className="w-full bg-rose-700 hover:bg-rose-600 text-white font-bold py-3 rounded-xl text-sm"
                    >
                      破棄してメニューに戻る
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowQuitModal(false)}
                      className="w-full bg-slate-800 text-slate-300 font-semibold py-2.5 rounded-xl text-sm mt-1"
                    >
                      バトルを続ける
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // -----------------------------------------------------------------
      // RENDER: 結果発表 (大げさリザルト画面 / エンドレス対応)
      // -----------------------------------------------------------------
      if (screen === 'result') {
        const correctCount = sessionResults.filter(r => r.isCorrect).length;
        const total = sessionResults.length || 1;
        const scorePercent = Math.round((correctCount / total) * 100);
        const wrongItems = sessionResults.filter(r => !r.isCorrect);
        const newlyMastered = sessionResults.filter(r => r.justMastered);

        // テンション爆上げ評価メッセージ & 称号（エンドレス判定対応）
        let rankBadge = {
          rank: 'S+',
          title: '超絶スペル神・降臨！！',
          sub: '全問パーフェクト！！全宇宙の英単語を支配せし伝説の勇者！',
          color: 'from-yellow-400 via-amber-300 to-yellow-500',
          glow: 'glow-gold',
          border: 'border-amber-400'
        };

        if (isEndlessMode) {
          if (correctCount >= 30) {
            rankBadge = {
              rank: 'EX',
              title: '生ける伝説！無双の英単語神！',
              sub: `${correctCount}語を粉砕！もはや誰にも君の勢いを止めることはできない！！`,
              glow: 'glow-gold',
              border: 'border-yellow-300'
            };
          } else if (correctCount >= 15) {
            rankBadge = {
              rank: 'SSS',
              title: '圧倒的無双！スペルマスター！',
              sub: `${correctCount}問討伐達成！強靭な集中力で見事エンドレスの荒波を踏破！`,
              glow: 'glow-cyan',
              border: 'border-cyan-400'
            };
          } else {
            rankBadge = {
              rank: 'S',
              title: '果敢なる無限討伐者！',
              sub: `エンドレス激闘お疲れ様！${correctCount}語撃破！次回はさらなる大台を目指せ！`,
              glow: '',
              border: 'border-indigo-500'
            };
          }
        } else if (scorePercent === 100) {
          rankBadge = {
            rank: 'SSS',
            title: '神話級！絶対神スペラー！！',
            sub: '神の領域に到達！もはや君に解けないスペルは存在しない！！',
            color: 'from-amber-300 via-pink-400 to-cyan-300',
            glow: 'glow-gold',
            border: 'border-yellow-300'
          };
        } else if (scorePercent >= 80) {
          rankBadge = {
            rank: 'S',
            title: '覚醒！無敵のスペルマスター！',
            sub: '圧倒的破壊力！ほとんどの問題を粉砕！この調子で頂点へ行け！',
            color: 'from-cyan-400 via-indigo-300 to-pink-500',
            glow: 'glow-cyan',
            border: 'border-cyan-400'
          };
        } else if (scorePercent >= 50) {
          rankBadge = {
            rank: 'A',
            title: '豪傑！歴戦のスペルファイター！',
            sub: '強敵を撃破！ミスした単語を叩き潰せば完全勝利は目前だ！',
            color: 'from-indigo-400 to-blue-500',
            glow: '',
            border: 'border-indigo-500'
          };
        } else {
          rankBadge = {
            rank: 'B',
            title: '反逆のチャレンジャー！',
            sub: 'ここからが本番だ！間違えた単語を特訓してリベンジを果たせ！！',
            color: 'from-rose-500 to-amber-500',
            glow: '',
            border: 'border-rose-500'
          };
        }

        // リザルト画面突入時に盛大に紙吹雪を飛ばす
        useEffect(() => {
          if (window.confetti) {
            const count = (isEndlessMode ? correctCount >= 15 : scorePercent >= 80) ? 150 : 60;
            window.confetti({
              particleCount: count,
              spread: 90,
              origin: { y: 0.5 }
            });

            if (scorePercent === 100 || (isEndlessMode && correctCount >= 30)) {
              setTimeout(() => {
                window.confetti({
                  particleCount: 100,
                  angle: 60,
                  spread: 70,
                  origin: { x: 0 }
                });
                window.confetti({
                  particleCount: 100,
                  angle: 120,
                  spread: 70,
                  origin: { x: 1 }
                });
              }, 400);
            }
          }
        }, []);

        return (
          <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 text-center animate-fadeIn">
            <div className="pt-2">
              <div className="inline-block px-4 py-1 rounded-full bg-slate-900 border border-slate-700 text-xs font-mono font-bold tracking-widest text-cyan-400 mb-2 uppercase">
                {isEndlessMode ? '∞ ENDLESS MISSION FINISHED' : 'MISSION COMPLETED'}
              </div>

              {/* 称号＆大げさ祝福 */}
              <div className={`p-4 rounded-3xl bg-slate-900/90 border-2 ${rankBadge.border} ${rankBadge.glow} mb-4 relative overflow-hidden backdrop-blur`}>
                <div className="text-6xl mb-1 font-black font-mono tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-200 to-yellow-500 animate-pulse">

                  {rankBadge.title}
                </h2>
                <p className="text-xs text-slate-300 font-medium px-2 leading-relaxed">
                  {rankBadge.sub}
                </p>
              </div>

              {/* スコアエンブレム */}
              <div className="my-3 inline-flex flex-col items-center justify-center w-36 h-36 rounded-full bg-gradient-to-b from-slate-900 to-black border-4 border-cyan-400 shadow-[0_0_30px_rgba(6,182,212,0.6)]">
                <span className="text-3xl font-black font-mono text-white tracking-tight">
                  {correctCount}<span className="text-lg text-slate-500">/{total}</span>
                </span>
                <span className="text-xs text-cyan-300 font-black font-mono mt-0.5">
                  {isEndlessMode ? `MAX ${maxEndlessCombo} COMBO` : `${scorePercent}% CLEAR`}
                </span>
              </div>

              {newlyMastered.length > 0 && (
                <div className="p-3 bg-emerald-950/80 border-2 border-emerald-500 rounded-2xl text-emerald-300 text-xs mb-3 font-bold shadow-[0_0_15px_rgba(16,185,129,0.5)] animate-bounce">
                  🎉 【完全制覇】新たに {newlyMastered.length} 個の単語を3連勝習得！
                </div>
              )}
            </div>

            {/* 間違えた単語リスト */}
            {wrongItems.length > 0 ? (
              <div className="my-2 max-h-44 overflow-y-auto space-y-2 pr-1 text-left">
                <div className="text-xs text-rose-400 font-black tracking-wider uppercase flex items-center gap-1">
                  <span>💀 撃破失敗した単語 ({wrongItems.length}語):</span>
                </div>
                {wrongItems.map((item, idx) => (
                  <div key={idx} className="bg-slate-900/90 border border-rose-900/80 rounded-xl p-2.5 flex items-center justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-mono font-black text-rose-300 text-base">{item.word.word}</span>
                        <span className="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.2 rounded">{item.word.level}</span>
                      </div>
                      <div className="text-xs text-slate-300">{item.word.meaning}</div>
                      <div className="text-[11px] text-rose-400 font-mono">
                        入力: {item.userInput || '(空欄)'}
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => speakWord(item.word.word)}
                      className="p-2 text-cyan-400 bg-cyan-950 rounded-lg active:scale-95"
                    >
                      🔊
                    </button>
                  </div>
                ))}
              </div>
            ) : (
              <div className="my-3 py-3 bg-cyan-950/40 border border-cyan-500/40 rounded-2xl text-cyan-300 text-xs font-bold">
                ✨ ノーミスクリア！撃ち漏らした単語はゼロです！！
              </div>
            )}

            <div className="space-y-2.5 pt-2">
              {wrongItems.length > 0 && (
                <button
                  type="button"
                  onClick={retryMistakesOnly}
                  className="w-full bg-gradient-to-r from-rose-600 via-red-600 to-amber-600 hover:brightness-110 text-white font-black py-4 rounded-2xl shadow-[0_0_25px_rgba(244,63,94,0.6)] flex items-center justify-center gap-2 transition-all active:scale-[0.98] uppercase tracking-wide text-base"
                >
                  <span>🔥 間違えた {wrongItems.length}問 を即座にリベンジ！</span>
                </button>
              )}

              <button
                type="button"
                onClick={() => startQuiz(isEndlessMode ? 'endless' : (isWeakMode ? 'weak' : 'normal'))}
                className="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:brightness-110 text-white font-black py-3.5 rounded-2xl shadow-lg transition-all active:scale-[0.98] uppercase tracking-wide"
              >
                {isEndlessMode ? 'もう一度エンドレス出撃 (RETRY ENDLESS)' : '次の10問へ出撃 (NEXT BATTLE)'}
              </button>

              <button
                type="button"
                onClick={() => setScreen('menu')}
                className="w-full bg-slate-900 border border-slate-700 text-slate-300 font-bold py-2.5 rounded-2xl hover:bg-slate-800 text-xs font-mono"
              >
                ← メインメニューに戻る
              </button>
            </div>
          </div>
        );
      }

      // -----------------------------------------------------------------
      // RENDER: レベル名管理画面
      // -----------------------------------------------------------------
      if (screen === 'levels') {
        const handleAddLevel = () => {
          const trimmed = newLevelName.trim();
          if (!trimmed) return;
          if (levels.includes(trimmed)) {
            alert('同名のレベルが既に存在します。');
            return;
          }
          setLevels([...levels, trimmed]);
          setNewLevelName('');
        };

        const handleDeleteLevel = (lvlToDelete) => {
          const count = words.filter(w => w.level === lvlToDelete).length;
          if (!confirm(`レベル「${lvlToDelete}」を削除しますか？\n（含まれる ${count} 個の単語は「一般」レベルに移行されます）`)) {
            return;
          }
          setLevels(levels.filter(l => l !== lvlToDelete));
          setWords(words.map(w => w.level === lvlToDelete ? { ...w, level: '一般' } : w));
          if (selectedLevel === lvlToDelete) setSelectedLevel('ALL');
        };

        return (
          <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6">
            <div>
              <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <button
                  onClick={() => setScreen('menu')}
                  className="text-xs text-indigo-400 font-semibold p-1"
                >
                  ← メニュー
                </button>
                <h2 className="text-base font-bold text-white">レベル（カテゴリ）管理</h2>
                <div className="w-12"></div>
              </div>

              {/* 新規レベル追加フォーム */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">新しいレベルを作成:</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="例: 高校基礎, TOEIC 700..."
                    value={newLevelName}
                    onChange={(e) => setNewLevelName(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-indigo-500"
                  />
                  <button
                    onClick={handleAddLevel}
                    disabled={!newLevelName.trim()}
                    className="bg-indigo-600 disabled:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold"
                  >
                    追加
                  </button>
                </div>
              </div>

              {/* レベル一覧 */}
              <div className="space-y-2.5">
                <div className="text-xs text-slate-400 font-semibold">登録済みレベル一覧:</div>
                {levels.map(lvl => {
                  const info = getLevelMasteryInfo(lvl);
                  return (
                    <div key={lvl} className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                      <div>
                        <div className="font-bold text-white text-sm">{lvl}</div>
                        <div className="text-[11px] text-slate-400 font-mono mt-0.5">
                          {info.total} 単語中 {info.masteredCount} 語習得 ({info.percent}%)
                        </div>
                      </div>
                      <button
                        onClick={() => handleDeleteLevel(lvl)}
                        className="text-xs text-rose-400 hover:text-rose-300 p-2"
                        title="レベル削除"
                      >
                        削除
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            <button
              onClick={() => setScreen('menu')}
              className="w-full bg-slate-900 border border-slate-800 text-slate-300 font-semibold py-3 rounded-2xl hover:bg-slate-800 text-sm"
            >
              完了してメニューへ戻る
            </button>
          </div>
        );
      }

      // -----------------------------------------------------------------
      // RENDER: 単語帳・ストリーク一覧
      // -----------------------------------------------------------------
      if (screen === 'stats') {
        const filteredWords = words
          .filter(w => selectedLevel === 'ALL' || (w.level || 'デフォルト') === selectedLevel)
          .filter(w => {
            const streak = stats[w.id]?.streak || 0;
            if (statsFilter === 'unmastered') return streak < 3;
            if (statsFilter === 'mastered') return streak >= 3;
            return true;
          })
          .filter(w => {
            const query = statsSearch.toLowerCase();
            return w.word.toLowerCase().includes(query) || w.meaning.includes(query);
          })
          .sort((a, b) => {
            const stA = stats[a.id] || { streak: 0, wrong: 0 };
            const stB = stats[b.id] || { streak: 0, wrong: 0 };
            // 未習得かつ間違いが多いものを上位に
            return stA.streak - stB.streak || stB.wrong - stA.wrong;
          });

        return (
          <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen">
            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
              <button
                onClick={() => setScreen('menu')}
                className="text-xs text-indigo-400 font-semibold p-1"
              >
                ← メニュー
              </button>
              <h2 className="text-base font-bold text-white">単語帳とストリーク</h2>
              <div className="w-12"></div>
            </div>

            <div className="my-3 space-y-2">
              <input
                type="text"
                placeholder="単語や意味で検索..."
                value={statsSearch}
                onChange={(e) => setStatsSearch(e.target.value)}
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-indigo-500"
              />

              <div className="flex gap-1.5 text-xs">
                <button
                  onClick={() => setStatsFilter('all')}
                  className={`flex-1 py-1.5 rounded-lg font-semibold ${
                    statsFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'
                  }`}
                >
                  すべて
                </button>
                <button
                  onClick={() => setStatsFilter('unmastered')}
                  className={`flex-1 py-1.5 rounded-lg font-semibold ${
                    statsFilter === 'unmastered' ? 'bg-amber-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'
                  }`}
                >
                  未習得 (&lt;3)
                </button>
                <button
                  onClick={() => setStatsFilter('mastered')}
                  className={`flex-1 py-1.5 rounded-lg font-semibold ${
                    statsFilter === 'mastered' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'
                  }`}
                >
                  習得済 (3/3)
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2 pb-6">
              {filteredWords.length === 0 ? (
                <div className="text-center py-12 text-slate-500 text-xs">単語が見つかりません</div>
              ) : (
                filteredWords.map(w => {
                  const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
                  const mastered = st.streak >= 3;

                  return (
                    <div key={w.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between">
                      <div className="flex-1 mr-2">
                        <div className="flex items-center gap-1.5">
                          <span className="font-mono font-bold text-white text-base">{w.word}</span>
                          <span className="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">{w.level}</span>
                          {mastered && (
                            <span className="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-700 px-1.5 py-0.5 rounded font-bold">
                              ★ 習得済
                            </span>
                          )}
                        </div>
                        <div className="text-xs text-slate-300 mt-0.5">{w.meaning}</div>
                        <div className="flex items-center gap-3 text-[11px] font-mono mt-1 text-slate-400">
                          <span>連続: <strong className={mastered ? 'text-emerald-400' : 'text-amber-400'}>{st.streak}/3</strong></span>
                          <span>誤答: <strong className="text-rose-400">{st.wrong}</strong></span>
                        </div>
                      </div>
                      <button
                        onClick={() => speakWord(w.word)}
                        className="p-2 bg-slate-800 text-indigo-400 rounded-xl"
                      >
                        🔊
                      </button>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        );
      }

      // -----------------------------------------------------------------
      // RENDER: CSVインポート
      // -----------------------------------------------------------------
      if (screen === 'import') {
        const activeTargetLevel = customLevelInput.trim() || targetLevelForImport;

        return (
          <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6">
            <div>
              <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                <button
                  onClick={() => setScreen('menu')}
                  className="text-xs text-indigo-400 font-semibold p-1"
                >
                  ← メニュー
                </button>
                <h2 className="text-base font-bold text-white">CSVから単語を取り込む</h2>
                <div className="w-12"></div>
              </div>

              {/* 取り込み先レベルの設定 */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 mb-3 space-y-2">
                <label className="block text-xs font-bold text-indigo-300">インポート先レベル名:</label>
                <div className="grid grid-cols-2 gap-2">
                  <select
                    value={targetLevelForImport}
                    onChange={(e) => {
                      setTargetLevelForImport(e.target.value);
                      setCustomLevelInput('');
                    }}
                    className="bg-slate-950 border border-slate-700 text-white rounded-xl py-2 px-2.5 text-xs"
                  >
                    {levels.map(lvl => (
                      <option key={lvl} value={lvl}>{lvl}</option>
                    ))}
                  </select>

                  <input
                    type="text"
                    placeholder="または新しいレベル名..."
                    value={customLevelInput}
                    onChange={(e) => setCustomLevelInput(e.target.value)}
                    className="bg-slate-950 border border-slate-700 text-white rounded-xl py-2 px-2.5 text-xs placeholder:text-slate-600 focus:border-indigo-500"
                  />
                </div>
                <div className="text-[11px] text-slate-400">
                  取り込み先: <strong className="text-emerald-400">{activeTargetLevel}</strong>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 text-xs text-slate-300 space-y-1.5 mb-3">
                <p className="font-bold text-slate-300">フォーマット例 (単語,意味):</p>
                <div className="bg-slate-950 p-2 rounded-lg font-mono text-[11px] text-emerald-400">
                  definitely,絶対に<br/>
                  accommodate,収容する<br/>
                  colleague,同僚
                </div>
              </div>

              <div className="mb-3">
                <label className="block text-xs font-semibold text-slate-400 mb-1">CSVファイルを選択:</label>
                <input
                  type="file"
                  accept=".csv,.txt"
                  onChange={handleFileUpload}
                  className="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white cursor-pointer"
                />
              </div>

              <div className="mb-3">
                <label className="block text-xs font-semibold text-slate-400 mb-1">または直接貼り付け:</label>
                <textarea
                  rows="6"
                  placeholder="word,meaning&#10;separate,分ける&#10;rhythm,リズム"
                  value={csvText}
                  onChange={(e) => setCsvText(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 font-mono text-xs text-white placeholder:text-slate-600 focus:border-indigo-500 focus:outline-none"
                />
              </div>

              {importError && (
                <div className="p-2.5 bg-rose-950/80 border border-rose-700 rounded-xl text-rose-300 text-xs">
                  {importError}
                </div>
              )}
            </div>

            <div className="space-y-2">
              <button
                onClick={() => handleImportCSV(csvText, activeTargetLevel)}
                disabled={csvText.trim().length === 0}
                className="w-full bg-indigo-600 disabled:bg-slate-800 disabled:text-slate-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-2xl shadow-md text-sm active:scale-[0.98]"
              >
                「{activeTargetLevel}」に取り込む
              </button>
            </div>
          </div>
        );
      }

      // -----------------------------------------------------------------
      // RENDER: データバックアップ & 復元画面（実機保存の完全対策）
      // -----------------------------------------------------------------
      if (screen === 'backup') {
        // 全データをJSONファイルとしてダウンロード
        const handleExportJSON = () => {
          const exportData = {
            version: '2.0',
            exportedAt: new Date().toISOString(),
            words,
            levels,
            stats
          };
          const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `spell_blaster_backup_${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setBackupStatus('✅ バックアップファイルを端末にダウンロードしました！');
        };

        // JSONバックアップから完全復元
        const handleRestoreJSON = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const data = JSON.parse(evt.target.result);
              if (!data.words || !Array.isArray(data.words)) {
                throw new Error('バックアップファイルの形式が正しくありません。');
              }
              setWords(data.words);
              if (data.levels) setLevels(data.levels);
              if (data.stats) setStats(data.stats);
              safeStorage.set(STORAGE_KEY_WORDS, data.words);
              if (data.levels) safeStorage.set(STORAGE_KEY_LEVELS, data.levels);
              if (data.stats) safeStorage.set(STORAGE_KEY_STATS, data.stats);

              setBackupStatus(`🎉 復元成功！ 単語 ${data.words.length}語、レベル ${data.levels?.length || 0}件 を復元しました。`);
            } catch (err) {
              setBackupStatus('❌ 復元失敗: ' + err.message);
            }
          };
          reader.readAsText(file);
        };

        // 初期状態にリセット
        const handleResetDefault = () => {
          if (confirm('すべての学習履歴、追加単語を削除して初期状態に戻しますか？')) {
            setWords(DEFAULT_VOCABULARY);
            setLevels(DEFAULT_LEVELS);
            setStats({});
            safeStorage.set(STORAGE_KEY_WORDS, DEFAULT_VOCABULARY);
            safeStorage.set(STORAGE_KEY_LEVELS, DEFAULT_LEVELS);
            safeStorage.set(STORAGE_KEY_STATS, {});
            setBackupStatus('初期状態にリセットしました。');
          }
        };

        return (
          <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6">
            <div>
              <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <button
                  onClick={() => setScreen('menu')}
                  className="text-xs text-indigo-400 font-semibold p-1"
                >
                  ← メニュー
                </button>
                <h2 className="text-base font-bold text-white">データ保存・バックアップ</h2>
                <div className="w-12"></div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4 text-xs text-slate-300 leading-relaxed">
                <p className="font-bold text-cyan-300 mb-1">📱 実機（スマホ）でのデータ保持について:</p>
                <p>
                  通常、単語や学習記録はスマホのブラウザ内に自動保存されます。<br/>
                  しかし、キャッシュ削除や機種変更に備えて、定期的に<strong className="text-amber-400">「バックアップを書き出す」</strong>でファイルを保存しておくことをおすすめします。
                </p>
              </div>

              {backupStatus && (
                <div className="p-3 mb-4 rounded-xl bg-indigo-950/80 border border-indigo-600 text-xs text-indigo-200">
                  {backupStatus}
                </div>
              )}

              <div className="space-y-3">
                {/* エクスポート */}
                <button
                  onClick={handleExportJSON}
                  className="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:brightness-110 text-white font-bold py-3.5 px-4 rounded-2xl flex items-center justify-between shadow-lg text-sm"
                >
                  <div className="text-left">
                    <div>📥 バックアップを書き出す (保存)</div>
                    <div className="text-[11px] text-cyan-200 font-normal">現在の全単語・レベル・正誤ストリークを端末に保存</div>
                  </div>
                  <span>💾</span>
                </button>

                {/* インポート */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <div className="text-xs font-bold text-white mb-1.5">📤 バックアップから復元:</div>
                  <input
                    type="file"
                    accept=".json"
                    onChange={handleRestoreJSON}
                    className="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white cursor-pointer"
                  />
                </div>

                {/* リセット */}
                <div className="pt-4 border-t border-slate-800">
                  <button
                    onClick={handleResetDefault}
                    className="w-full bg-slate-950 border border-rose-900/60 hover:border-rose-600 text-rose-400 py-2.5 rounded-xl text-xs font-mono"
                  >
                    ⚠️ データを初期状態（リセット）に戻す
                  </button>
                </div>
              </div>
            </div>

            <button
              onClick={() => setScreen('menu')}
              className="w-full bg-slate-900 border border-slate-800 text-slate-300 font-semibold py-3 rounded-2xl hover:bg-slate-800 text-sm mt-4"
            >
              メニューに戻る
            </button>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
