  <!-- エラー可視化トラップ（構文エラーや実行時エラーを画面上に表示） -->
  <script>
    function showDebugError(title, msg, stack) {
      var existing = document.getElementById('debug-error-box');
      if (existing) return;
      var d = document.createElement('div');
      d.id = 'debug-error-box';
      d.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#880000;color:#fff;padding:20px;font-family:monospace;font-size:13px;z-index:999999;overflow:auto;white-space:pre-wrap;';
      d.innerText = '=== ' + title + ' ===\n' + msg + '\n\nStack:\n' + (stack || 'N/A');
      document.documentElement.appendChild(d);
    }
    window.addEventListener('error', function(e) {
      if (e.message === 'Script error.' && !e.filename) {
        console.warn('Cross-origin script warning suppressed:', e);
        return;
      }
      showDebugError('JAVASCRIPT ERROR', e.message + '\nSource: ' + e.filename + '\nLine: ' + e.lineno + ':' + e.colno, e.error ? e.error.stack : null);
    });
    window.addEventListener('unhandledrejection', function(e) {
      showDebugError('PROMISE REJECTION', (e.reason && e.reason.message) ? e.reason.message : String(e.reason), e.reason ? e.reason.stack : null);
    });
  </script>

const SoundFX = (() => {
  let audioCtx = null;
  let isEnabled = true;

  const initCtx = () => {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  };

  return {
    setEnabled: (val) => { isEnabled = val; },
    getEnabled: () => isEnabled,
    vibrate: (pattern) => {
      if (isEnabled && typeof navigator !== 'undefined' && navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    },

    playBossAlarm: () => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [0, 0.22, 0.44].forEach((t) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now + t);
          osc.frequency.linearRampToValueAtTime(880, now + t + 0.18);
          gain.gain.setValueAtTime(0, now + t);
          gain.gain.linearRampToValueAtTime(0.3, now + t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.01, now + t + 0.2);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + t); osc.stop(now + t + 0.21);
        });
      } catch (e) {}
    },

    playFeverUp: (phase) => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const baseFreqs = phase === 4 ? [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00]
          : phase === 3 ? [440.00, 554.37, 659.25, 880.00, 1108.73]
          : phase === 2 ? [392.00, 493.88, 587.33, 783.99]
          : [329.63, 440.00, 659.25];

        baseFreqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = phase >= 3 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0, now + idx * 0.05);
          gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.05 + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.05); osc.stop(now + idx * 0.05 + 0.36);
        });
      } catch (e) {}
    },

    playCorrect: () => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046.50, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.16);
      } catch (e) {}
    },

    playSpeedBonus: () => {
      if (!isEnabled) return;
      try {
        initCtx(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [1318.51, 1760.00];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();

          osc.type = 'triangle';

          gain.gain.setValueAtTime(0, now + idx * 0.08);

      return item ? JSON.parse(item) : fallback;
    } catch (e) {
      return fallback;

  }
};

const speakWord = (text) => {
  // サウンドが無効化されている場合は発音しない
  if (typeof SoundFX !== 'undefined' && !SoundFX.getEnabled()) {
    return;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
};

    return { earnedSP: 0, isJackpot: false, isCritical: false, jackpotMult: 1 };
  }

  const overclockLv = upgrades.overclockCoreLv || upgrades.baseRewardLv || 0;
  const multiplierBoostLv = upgrades.multiplierBoostLv || 0;
  const criticalStrikeLv = upgrades.criticalStrikeLv || 0;
  const jackpotFeverLv = upgrades.jackpotFeverLv || 0;
  const sonicSpeedLv = upgrades.sonicSpeedLv || 0;
  const feverSurgeLv = upgrades.feverSurgeLv || 0;
  const bossBountyLv = upgrades.bossBountyLv || 0;
  const masterySupernovaLv = upgrades.masterySupernovaLv || upgrades.feverMasteryLv || 0;

  // 1. 基礎SP (15 + Lv×20)
  let sp = 15 + (overclockLv * 20);

  // 2. コンボ乗数
  const comboMult = 1.0 + (currentCombo * (0.05 + (multiplierBoostLv * 0.03)));
  sp *= comboMult;

  // 3. FEVER乗数 (サージ加算付き)
  const phase = getFeverPhase(currentCombo);
  const surgeBonus = feverSurgeLv * 0.15;
  const feverMultipliers = [1.0, 1.5 + surgeBonus, 2.0 + surgeBonus, 3.0 + surgeBonus, 5.0 + surgeBonus];
  sp *= feverMultipliers[phase] || 1.0;

  // 4. デイリー限界突破倍率
  if (dailyOverdriveMultiplier > 1.0) {
    sp *= dailyOverdriveMultiplier;
  }

  // 5. スピードボーナス (1.5倍 + sonicSpeedLv×0.3)
  if (isSpeedBonus) {
    const speedMult = 1.5 + (sonicSpeedLv * 0.3);
    sp *= speedMult;
  }

  // 6. クリティカル判定 (Lv×7%, 最大42%)
  let isCritical = false;
  const critChance = criticalStrikeLv * 0.07;
  if (Math.random() < critChance) {
    isCritical = true;
    sp *= 3.0;
  }

  // 7. 🎰 JACKPOT 判定 (Lv×2%, 最大12% で 7〜10倍大爆発！)
  let isJackpot = false;
  let jackpotMult = 1;
  const jackpotChance = jackpotFeverLv * 0.02;
  if (jackpotFeverLv > 0 && Math.random() < jackpotChance) {
    isJackpot = true;
    jackpotMult = 7 + Math.floor(Math.random() * 4); // 7, 8, 9, 10倍
    sp *= jackpotMult;
  }

  // 8. 単語マスター祝賀ボーナス (100 + Lv×75)
  if (justMastered) {
    sp += 100 + (masterySupernovaLv * 75);
  }

  // 9. ボス撃破ボーナス (250 + Lv×100)
  if (isBoss) {
    sp += 250 + (bossBountyLv * 100);
  }

  // 10. 連続ファームペナルティ
  if (isRepeatedFarm) sp *= 0.1;

  // 11. ヒントモードペナルティ
  if (isHintMode) sp *= 0.25;

  const earnedSP = Math.max(1, Math.round(sp));

  return {
    earnedSP,
    isJackpot,
    isCritical,
    jackpotMult
  };
};

    // ===== src/screens/ResultScreen.jsx =====
const ResultScreen = ({
  sessionResults,
  maxEndlessCombo,
  currentSessionCombo,

  isEndlessMode,
  isWeakMode,
  toastNotice,

  setScreen
}) => {
  const total = sessionResults.length;
  const correctCount = sessionResults.filter(r => r.isCorrect).length;
  const scorePercent = total > 0 ? Math.round((correctCount / total) * 100) : 0;

  let rankTitle = '【神話級】 (SSS)';
  let rankColor = 'text-amber-300 neon-gold';
  if (scorePercent < 100) { rankTitle = '【超絶】 (S+)'; rankColor = 'text-cyan-300'; }
  if (scorePercent < 80) { rankTitle = '【覚醒】 (A)'; rankColor = 'text-indigo-300'; }
  if (scorePercent < 60) { rankTitle = '【勇者】 (B)'; rankColor = 'text-slate-300'; }

  const hasMistakes = sessionResults.some(r => !r.isCorrect);

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 animate-fadeIn text-center">

        <ToastNotice message={toastNotice} topClass="top-10" />

        <div className="text-4xl font-black text-white font-mono tracking-tight mb-2">

          <div>
            <div className="text-slate-400 text-[10px]">MAX COMBO</div>

        <button
          onClick={() => setScreen('menu')}

      </div>

const ShopScreen = ({
  gameData,
  setGameData,
  SoundFX,
  setScreen
}) => {
  const [chestResult, setChestResult] = useState(null);
  const [isOpeningChest, setIsOpeningChest] = useState(false);

  const todayStr = getLocalDateStr();
  const alreadyBoughtToday = gameData.lastShieldBuyDate === todayStr;
  const shieldCost = SHIELD_CONFIG.cost;
  const isMaxShield = (gameData.shields || 0) >= SHIELD_CONFIG.maxShields;

  // ガチャ宝箱を開封するロジック
  const handleOpenChest = () => {
    if (gameData.gold < CHEST_CONFIG.cost || isOpeningChest) return;

    setIsOpeningChest(true);
    setChestResult(null);

    // SP消費 & 開封回数カウント
    setGameData(prev => ({
      ...prev,
      gold: prev.gold - CHEST_CONFIG.cost,
      chestOpens: (prev.chestOpens || 0) + 1
    }));
    SoundFX.playUpgrade();

    // 0.6秒後に結果抽選
    setTimeout(() => {
      const rand = Math.random() * 100;
      let reward = null;

      if (rand < 5) {
        // 5% JACKPOT 5,000 SP
        reward = { type: 'sp', amount: 5000, title: '💥 JACKPOT 5,000 SP!!', icon: '🎰', class: 'text-amber-300 neon-gold text-2xl' };
        if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90 });

      } else if (rand < 15) {
        // 10% 1,500 SP
        reward = { type: 'sp', amount: 1500, title: '🎉 大当たり 1,500 SP!', icon: '💎', class: 'text-cyan-300 font-bold text-xl' };
        SoundFX.playVictory();

        reward = { type: 'shield', amount: 1, title: '🛡️ エナジーシールド +1獲得!', icon: '🛡️', class: 'text-emerald-300 font-bold text-lg' };

      setIsOpeningChest(false);

      // 報酬付与
      setGameData(prev => ({
        ...prev,
        gold: reward.type === 'sp' ? prev.gold + reward.amount : prev.gold,

        {/* 所持SP残高 */}
        <div className="bg-gradient-to-br from-yellow-950/80 via-slate-900/90 to-amber-950/80 border-2 border-yellow-500/80 rounded-3xl p-4 mb-4 text-center shadow-[0_0_25px_rgba(234,179,8,0.25)]">
          <div className="text-[10px] text-yellow-400 font-mono tracking-widest uppercase font-bold">TOTAL BALANCE</div>
          <div className="text-3xl font-black text-yellow-300 font-mono tracking-wide mt-0.5 flex items-center justify-center gap-2">

            const canAfford = gameData.gold >= cost;

              <div
                key={upg.key}

                      SoundFX.playUpgrade();
                    }

                  disabled={isMax || !canAfford}
                  className={`font-mono font-black text-xs px-3 py-2 rounded-xl shadow whitespace-nowrap active:scale-95 transition-all ${

                >

              </div>

      >
        ← メインメニュー
      </button>
    </div>
  );
};

    // ===== src/screens/StatsScreen.jsx =====
const StatsScreen = ({
  words,
  stats,
  statsFilter,
  setStatsFilter,
  statsSearch,
  setStatsSearch,
  getMasteryType,
  setScreen
}) => {
  const filteredWords = words.filter(w => {
    const st = stats[w.id] || { streak: 0 };
    if (statsFilter === 'unmastered' && (st.streak || 0) >= 3) return false;
    if (statsFilter === 'mastered' && (st.streak || 0) < 3) return false;
    if (statsSearch) {
      const q = statsSearch.toLowerCase();
      return w.word.toLowerCase().includes(q) || w.meaning.includes(q);
    }
    return true;
  });

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 animate-fadeIn">
      <div>
        <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
          <button onClick={() => setScreen('menu')} className="text-xs text-indigo-400 font-semibold p-1">
            ← メニュー
          </button>
          <h2 className="text-base font-bold text-white flex items-center gap-1.5">
            <span>📖 STATS</span>
          </h2>
          <div className="w-12"></div>
        </div>

        <div className="space-y-2 mb-3">
          <input
            type="text"
            placeholder="Search..."
            value={statsSearch}
            onChange={(e) => setStatsSearch(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:border-cyan-400 font-mono"
          />
          <div className="grid grid-cols-3 gap-1.5">
            <button
              onClick={() => setStatsFilter('all')}
              className={`py-1.5 rounded-lg text-xs font-bold ${
                statsFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'
              }`}
            >
              全て({words.length})
            </button>
            <button
              onClick={() => setStatsFilter('unmastered')}
              className={`py-1.5 rounded-lg text-xs font-bold ${
                statsFilter === 'unmastered' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-slate-400'
              }`}
            >
              未習得
            </button>
            <button
              onClick={() => setStatsFilter('mastered')}
              className={`py-1.5 rounded-lg text-xs font-bold ${
                statsFilter === 'mastered' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400'
              }`}
            >
              マスター
            </button>
          </div>
        </div>

        <div className="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
          {filteredWords.map(w => {
            const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
            const mType = getMasteryType(w.id);
            const isMaster = st.streak >= 3;
            return (
              <div key={w.id} className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                <div className="text-left pr-2">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-white text-sm font-mono tracking-wide">{w.word}</span>
                    <span className="text-[10px] text-slate-500">{w.pos}</span>
                    {isMaster && (
                      <span
                        className={`text-[9px] px-1 py-0.5 rounded font-mono font-bold ${
                          mType === 'pure' ? 'bg-cyan-950 text-cyan-300' : 'bg-amber-950 text-amber-300'
                        }`}
                      >
                        {mType === 'pure' ? '✨ PURE' : '🛡️ SURVIVOR'}
                      </span>
                    )}
                  </div>
                  <div className="text-xs text-slate-300 mt-0.5">{w.meaning}</div>
                </div>
                <div className="text-right font-mono text-[11px] whitespace-nowrap">
                  <div className="text-amber-400 font-bold">🔥 {st.streak || 0}/3</div>
                  <div className="text-slate-500 text-[9px]">誤答: {st.wrong || 0}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <button
        onClick={() => setScreen('menu')}
        className="w-full bg-slate-900 border border-slate-800 text-slate-300 font-bold py-3 rounded-2xl hover:bg-slate-800 text-sm mt-3 font-mono"

      </button>
    </div>
  );

const BackupScreen = ({
  words,
  setWords,
  levels,
  setLevels,
  stats,
  setStats,
  gameData,
  setGameData,
  dailyLogs,
  setDailyLogs,
  sessionLogs,
  setSessionLogs,
  backupStatus,
  setBackupStatus,
  setScreen
}) => {
  const handleExportAll = () => {
    try {
      const fullBackup = {
        words,
        levels,
        stats,
        gameData,
        dailyLogs,
        sessionLogs,
        backupDate: new Date().toISOString()
      };
      const jsonStr = JSON.stringify(fullBackup, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `spell_master_backup_${getLocalDateStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      setBackupStatus('✅ ダウンロードしました');
    } catch (e) {
      setBackupStatus('❌ 失敗: ' + e.message);
    }
  };

  const handleImportBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.words) setWords(data.words);
        if (data.levels) setLevels(data.levels);
        if (data.stats) setStats(data.stats);
        if (data.gameData) setGameData(data.gameData);
        if (data.dailyLogs) setDailyLogs(data.dailyLogs);
        if (data.sessionLogs) setSessionLogs(data.sessionLogs);
        setBackupStatus('✅ 復元しました');
      } catch (err) {
        setBackupStatus('❌ 復元エラー');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between pb-6 animate-fadeIn">
      <div>
        <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
          <button onClick={() => setScreen('menu')} className="text-xs text-indigo-400 font-semibold p-1">
            ← メニュー
          </button>
          <h2 className="text-base font-bold text-white flex items-center gap-1.5">

          </h2>
          <div className="w-12"></div>
        </div>

        <div className="space-y-4 text-left">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <h3 className="text-sm font-bold text-white mb-1 font-mono">1. バックアップ書き出し</h3>
            <button
              onClick={handleExportAll}
              className="w-full bg-indigo-600 text-white font-mono font-bold py-2.5 rounded-xl text-xs"
            >

            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <h3 className="text-sm font-bold text-white mb-1 font-mono">2. 復元</h3>

              accept=".json"
              onChange={handleImportBackup}
              className="w-full text-xs text-slate-400 bg-cyan-500 rounded"
            />
          </div>

          {backupStatus && (
            <div className="bg-black/60 border border-slate-700 rounded-xl p-3 text-xs text-center font-mono">

      >

      </button>

  );

// 画面
function App() {
  const [screen, setScreen] = useState('menu');
  const [words, setWords] = useState(() => {
    const loaded = safeStorage.get(STORAGE_KEY_WORDS, null);
    if (!loaded || loaded.length < DEFAULT_VOCABULARY.length || loaded.some(w => w.word === 'definitely' || w.word === 'accommodate')) {
      return DEFAULT_VOCABULARY;
    }
    return loaded.map(w => {
      let lvl = w.level || '';
      if (w.id?.startsWith('t1_') || lvl.includes('Level 1') || lvl.includes('Level １')) lvl = 'Level 1';
      else if (w.id?.startsWith('t2_') || lvl.includes('Level 2') || lvl.includes('Level ２')) lvl = 'Level 2';
      else if (w.id?.startsWith('t3_') || lvl.includes('Level 3') || lvl.includes('Level ３')) lvl = 'Level 3';
      else if (w.id?.startsWith('t4_') || lvl.includes('Level 4') || lvl.includes('Level ４')) lvl = 'Level 4';
      else if (w.id?.startsWith('t5_') || lvl.includes('Level 5') || lvl.includes('Level ５')) lvl = 'Level 5';
      return { ...w, level: lvl };
    });
  });

  const [levels, setLevels] = useState(() => {
    const loaded = safeStorage.get(STORAGE_KEY_LEVELS, null);
    if (!loaded || loaded.length === 0 || !loaded.includes('Level 5')) {
      return DEFAULT_LEVELS;
    }
    const set = new Set([...DEFAULT_LEVELS, ...loaded.filter(l => !l.includes('初中級') && !l.includes('上級') && !l.includes('ターゲット'))]);
    return Array.from(set);
  });
  const [stats, setStats] = useState(() => safeStorage.get(STORAGE_KEY_STATS, {}));
  const [dailyLogs, setDailyLogs] = useState(() => safeStorage.get(STORAGE_KEY_DAILY_LOGS, {}));
  const [sessionLogs, setSessionLogs] = useState(() => safeStorage.get(STORAGE_KEY_SESSION_LOGS, []));
  const [logDisplayCount, setLogDisplayCount] = useState(50);

  const [adminPassword, setAdminPassword] = useState(() => safeStorage.get(STORAGE_KEY_ADMIN_PASS, 'admin123'));
  const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
  const [adminInputPass, setAdminInputPass] = useState('');
  const [adminPendingScreen, setAdminPendingScreen] = useState(null);
  const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
  const [adminLoginError, setAdminLoginError] = useState('');

  const [gameData, setGameData] = useState(() => safeStorage.get(STORAGE_KEY_GAME_PROGRESS, {
    gold: 0,
    totalEarned: 0,
    totalCorrectAllTime: 0,
    maxAllTimeCombo: 0,
    totalBossKills: 0,
    equippedTitle: 'かけだしのスペラー',
    shields: 2,
    loginStreakDays: 1,
    lastActiveDate: getLocalDateStr(),
    lastShieldBuyDate: '',
    upgrades: {
      baseRewardLv: 0,
      multiplierBoostLv: 0,
      criticalStrikeLv: 0,
      bossBountyLv: 0,
      feverMasteryLv: 0
    }
  }));

  const [soundEnabled, setSoundEnabled] = useState(() => safeStorage.get(STORAGE_KEY_SOUND, true));
  const [isHintMode, setIsHintMode] = useState(() => safeStorage.get(STORAGE_KEY_HINT_MODE, false));

  const [selectedLevel, setSelectedLevel] = useState('ALL');
  const [quizList, setQuizList] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [inputVal, setInputVal] = useState('');
  const [answerStatus, setAnswerStatus] = useState(null);
  const [sessionResults, setSessionResults] = useState([]);
  const [isWeakMode, setIsWeakMode] = useState(false);
  const [isEndlessMode, setIsEndlessMode] = useState(false);
  const [isBossQuestion, setIsBossQuestion] = useState(false);
  const [showBossIntro, setShowBossIntro] = useState(false);
  const [currentSessionCombo, setCurrentSessionCombo] = useState(0);
  const [sessionEarnedGold, setSessionEarnedGold] = useState(0);
  const [earnedGoldThisTurn, setEarnedGoldThisTurn] = useState(0);
  const [turnRewardDetail, setTurnRewardDetail] = useState(null);
  const [shieldUsedThisTurn, setShieldUsedThisTurn] = useState(false);
  const [maxEndlessCombo, setMaxEndlessCombo] = useState(0);
  const [showQuitModal, setShowQuitModal] = useState(false);

  const [questionStartTime, setQuestionStartTime] = useState(0);
  const [isSpeedBonus, setIsSpeedBonus] = useState(false);
  const [cheatAlertMsg, setCheatAlertMsg] = useState('');
  const [recentAnsweredWordIds, setRecentAnsweredWordIds] = useState([]);

  const [toastNotice, setToastNotice] = useState(null);

  const [reviewList, setReviewList] = useState([]);
  const [reviewIndex, setReviewIndex] = useState(0);
  const [reviewStep, setReviewStep] = useState(0);
  const [isReviewCompleted, setIsReviewCompleted] = useState(false);

  const [statsFilter, setStatsFilter] = useState('all');
  const [statsSearch, setStatsSearch] = useState('');

  const [targetLevelForImport, setTargetLevelForImport] = useState(levels[0] || 'デフォルト');
  const [customLevelInput, setCustomLevelInput] = useState('');
  const [csvText, setCsvText] = useState('');
  const [importError, setImportError] = useState('');
  const [backupStatus, setBackupStatus] = useState('');
  const [newLevelName, setNewLevelName] = useState('');
  const [newAdminPassInput, setNewAdminPassInput] = useState('');

  const inputRef = useRef(null);
  const timerRef = useRef(null);

  // ストレージ同期
  useEffect(() => { safeStorage.set(STORAGE_KEY_WORDS, words); }, [words]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_LEVELS, levels); }, [levels]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_STATS, stats); }, [stats]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_GAME_PROGRESS, gameData); }, [gameData]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_DAILY_LOGS, dailyLogs); }, [dailyLogs]);
  useEffect(() => {
    const trimmed = sessionLogs.length > MAX_SESSION_LOGS_COUNT ? sessionLogs.slice(0, MAX_SESSION_LOGS_COUNT) : sessionLogs;
    safeStorage.set(STORAGE_KEY_SESSION_LOGS, trimmed);
  }, [sessionLogs]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_ADMIN_PASS, adminPassword); }, [adminPassword]);
  useEffect(() => {
    safeStorage.set(STORAGE_KEY_SOUND, soundEnabled);
    SoundFX.setEnabled(soundEnabled);
    if (!soundEnabled && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }, [soundEnabled]);
  useEffect(() => { safeStorage.set(STORAGE_KEY_HINT_MODE, isHintMode); }, [isHintMode]);

  // デイリーボーナス判定（ログインストリーク・シールド回復）
  useEffect(() => {
    const todayStr = getLocalDateStr();
    const lastDate = gameData.lastActiveDate;
    if (lastDate !== todayStr) {
      const last = new Date(lastDate);
      const today = new Date(todayStr);
      const diffDays = Math.ceil(Math.abs(today - last) / (1000 * 60 * 60 * 24));

      let updatedStreak = gameData.loginStreakDays || 1;
      if (diffDays === 1) updatedStreak += 1;
      else if (diffDays > 1) updatedStreak = 1;

      const updatedShields = Math.min(5, (gameData.shields || 0) + 1);

      setGameData(prev => ({
        ...prev,
        loginStreakDays: updatedStreak,
        lastActiveDate: todayStr,
        shields: updatedShields
      }));
    }
  }, []);

  // セッション終了時の実績判定・紙吹雪
  useEffect(() => {
    if (screen === 'result' && sessionResults.length > 0) {
      const correctCount = sessionResults.filter(r => r.isCorrect).length;
      const scorePercent = Math.round((correctCount / sessionResults.length) * 100);

      if (scorePercent === 100 && typeof confetti === 'function') {
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
      }

      const sessionMaxCombo = maxEndlessCombo || currentSessionCombo;
      const todayStr = getLocalDateStr();
      setDailyLogs(prev => {
        const currentDaily = prev[todayStr] || { answered: 0, correct: 0, earnedGold: 0 };
        return {
          ...prev,
          [todayStr]: {
            answered: currentDaily.answered + sessionResults.length,
            correct: currentDaily.correct + correctCount,
            earnedGold: currentDaily.earnedGold + sessionEarnedGold
          }
        };
      });

      const newLog = {
        id: 'log_' + Date.now(),
        date: new Date().toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
        mode: isEndlessMode ? 'エンドレス' : isWeakMode ? '苦手特訓' : '10問ドリル',
        level: selectedLevel === 'ALL' ? '全レベル' : selectedLevel,
        total: sessionResults.length,
        correct: correctCount,
        accuracy: scorePercent,
        earnedGold: sessionEarnedGold,
        maxCombo: sessionMaxCombo
      };
      setSessionLogs(prev => [newLog, ...prev]);

      setGameData(prev => ({
        ...prev,
        maxAllTimeCombo: Math.max(prev.maxAllTimeCombo || 0, sessionMaxCombo)
      }));
    }
  }, [screen]);

  // フォーカス制御
  useEffect(() => {
    if (screen === 'quiz' && answerStatus === null) {
      const timer = setTimeout(() => { inputRef.current?.focus(); }, 50);
      return () => clearTimeout(timer);
    }
  }, [screen, currentIndex, answerStatus]);

  useEffect(() => {
    if (screen === 'quiz' && answerStatus === 'incorrect') {
      const timer = setTimeout(() => { inputRef.current?.focus(); }, 50);
      return () => clearTimeout(timer);
    }
  }, [answerStatus]);

  useEffect(() => {
    if (screen === 'review') {
      const timer = setTimeout(() => { inputRef.current?.focus(); }, 50);
      return () => clearTimeout(timer);
    }
  }, [screen, reviewIndex, reviewStep]);

  // 単語マスター状態判定
  const getMasteryType = useCallback((wordId) => {
    const st = stats[wordId];
    if (!st || st.streak < 3) return 'unmastered';
    return (st.wrong || 0) === 0 ? 'pure' : 'survivor';
  }, [stats]);

  // 忘却曲線の期日到来判定
  const isReviewDue = useCallback((wordId) => {
    const st = stats[wordId];
    if (!st || !st.nextReviewDate) return false;
    return new Date(st.nextReviewDate) <= new Date();
  }, [stats]);

  const totalMasteredWords = useMemo(() => words.filter(w => (stats[w.id]?.streak || 0) >= 3).length, [words, stats]);

  const unlockedBadges = useMemo(() => {
    const hasAnyMaxUpgrade = Object.entries(gameData.upgrades || {}).some(([k, lv]) => {
      const upg = UPGRADES_CONFIG.find(u => u.key === k);
      return upg && lv >= upg.maxLevel;
    });

    return BADGES_CONFIG.filter(b => {
      if (b.category === 'streak') return (gameData.maxAllTimeCombo || 0) >= b.req;
      if (b.category === 'master') return totalMasteredWords >= b.req;
      if (b.category === 'boss') return (gameData.totalBossKills || 0) >= b.req;
      if (b.category === 'days') return (gameData.loginStreakDays || 1) >= b.req;
      if (b.category === 'total_correct') return (gameData.totalCorrectAllTime || 0) >= b.req;
      if (b.category === 'gold') return (gameData.totalEarned || 0) >= b.req;
      if (b.category === 'jackpot') return (gameData.totalJackpots || 0) >= b.req;
      if (b.category === 'chest') return (gameData.chestOpens || 0) >= b.req;
      if (b.category === 'upgrade_max') return hasAnyMaxUpgrade;
      return false;
    });
  }, [gameData, totalMasteredWords]);

  // 管理者認証
  const requireAdmin = (targetScreen) => {
    if (isAdminAuthenticated) {
      setScreen(targetScreen);
    } else {
      setAdminPendingScreen(targetScreen);
      setAdminLoginError('');
      setAdminInputPass('');
      setShowAdminLoginModal(true);
    }
  };

  const handleAdminAuthSubmit = (e) => {
    e.preventDefault();
    if (adminInputPass === adminPassword) {
      setIsAdminAuthenticated(true);
      setShowAdminLoginModal(false);
      if (adminPendingScreen) setScreen(adminPendingScreen);
    } else {
      setAdminLoginError('パスワードが違います');
    }
  };

  // クイズ開始
  const startQuiz = (mode = 'normal', customList = null) => {
    let pool = [];
    const candidateWords = selectedLevel === 'ALL'
      ? words
      : words.filter(w => (w.level || 'デフォルト') === selectedLevel);

    if (customList) {
      pool = customList;
    } else if (mode === 'weak') {
      const dueBossWords = candidateWords.filter(w => getMasteryType(w.id) === 'survivor' && isReviewDue(w.id));
      const scored = candidateWords.map(w => {
        const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
        const isDue = dueBossWords.some(b => b.id === w.id);
        const score = (st.wrong * 3) + (st.tested === 0 ? 5 : 0) + (isDue ? 10 : 0) + (3 - Math.min(st.streak, 3));
        return { ...w, priorityScore: score, isDueRevenge: isDue };
      });
      const weakPool = scored.filter(w => w.streak < 3 || w.wrong > 0 || w.isDueRevenge);
      const targetPool = weakPool.length >= 10 ? weakPool : scored;
      pool = targetPool.sort((a, b) => b.priorityScore - a.priorityScore).slice(0, 10).sort(() => Math.random() - 0.5);
    } else {
      const dueBossWords = candidateWords
        .filter(w => getMasteryType(w.id) === 'survivor' && isReviewDue(w.id))
        .map(w => ({ ...w, isDueRevenge: true }))
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      const nonBosses = candidateWords.filter(w => !dueBossWords.some(b => b.id === w.id));
      const scored = nonBosses.map(w => {
        const st = stats[w.id] || { tested: 0, wrong: 0, streak: 0 };
        const score = (st.wrong * 2) + (st.tested === 0 ? 3 : 0) + (3 - Math.min(st.streak, 3));
        return { ...w, priorityScore: score };
      });
      const topCandidates = scored.sort((a, b) => b.priorityScore - a.priorityScore).slice(0, 20);
      const normalPicks = topCandidates.sort(() => Math.random() - 0.5).slice(0, 10 - dueBossWords.length);

      pool = [...dueBossWords, ...normalPicks].sort(() => Math.random() - 0.5);
    }

    const selected = mode === 'endless' ? pool.sort(() => Math.random() - 0.5) : pool;
    if (selected.length === 0) {
      alert('出題可能な単語がありません');
      return;
    }

    setIsWeakMode(mode === 'weak');
    setIsEndlessMode(mode === 'endless');
    setQuizList(selected);
    setCurrentIndex(0);
    setInputVal('');
    setAnswerStatus(null);
    setSessionResults([]);
    setCurrentSessionCombo(0);
    setSessionEarnedGold(0);
    setEarnedGoldThisTurn(0);
    setTurnRewardDetail(null);
    setShieldUsedThisTurn(false);
    setMaxEndlessCombo(0);
    setShowQuitModal(false);
    setRecentAnsweredWordIds([]);
    setCheatAlertMsg('');
    setToastNotice(null);

    const firstWord = selected[0];
    const isBoss = !!firstWord?.isDueRevenge;
    setIsBossQuestion(isBoss);
    setShowBossIntro(isBoss);

    if (isBoss) {
      SoundFX.vibrate([300, 100, 300]);
      SoundFX.playBossAlarm();
      setTimeout(() => setShowBossIntro(false), 1600);
    }

    setQuestionStartTime(Date.now() + (isBoss ? 1600 : 0));
    setScreen('quiz');
  };

  // 次の問題へ
  const handleNextQuestion = useCallback(() => {
    if (isEndlessMode) {
      if (currentIndex + 1 >= quizList.length) {
        const candidateWords = selectedLevel === 'ALL' ? words : words.filter(w => (w.level || 'デフォルト') === selectedLevel);
        const refilled = [...candidateWords].sort(() => Math.random() - 0.5);
        setQuizList(prev => [...prev, ...refilled]);
      }
    } else if (currentIndex + 1 >= 10 || currentIndex + 1 >= quizList.length) {
      SoundFX.playVictory();
      setScreen('result');
      return;
    }

    const nextIndex = currentIndex + 1;
    const nextWord = quizList[nextIndex];
    const isBoss = !!nextWord?.isDueRevenge;

    setCurrentIndex(nextIndex);
    setInputVal('');
    setAnswerStatus(null);
    setIsBossQuestion(isBoss);
    setShowBossIntro(isBoss);
    setCheatAlertMsg('');
    setEarnedGoldThisTurn(0);
    setShieldUsedThisTurn(false);
    setToastNotice(null);

    if (isBoss) {
      SoundFX.vibrate([300, 100, 300]);
      SoundFX.playBossAlarm();
      setTimeout(() => setShowBossIntro(false), 1600);
    }
    setQuestionStartTime(Date.now() + (isBoss ? 1600 : 0));
  }, [currentIndex, isEndlessMode, quizList, words, selectedLevel]);

  // 解答提出
  const handleSubmitAnswer = (e) => {
    e.preventDefault();
    if (answerStatus !== null) return;
    const currentWord = quizList[currentIndex];
    if (!currentWord) return;

    const trimmedInput = inputVal.trim();
    if (!trimmedInput) return;

    const isCorrect = trimmedInput.toLowerCase() === currentWord.word.toLowerCase();
    const answerDuration = Date.now() - questionStartTime;
    const speedBonusQualified = answerDuration <= 2500;
    setIsSpeedBonus(speedBonusQualified);

    const isCheated = isCorrect && answerDuration < 600;
    const isRepeatedFarm = recentAnsweredWordIds.slice(-2).includes(currentWord.id);

    if (isCheated) setCheatAlertMsg('⚠️ 即答検知: SP加算&ストリーク無効');
    else if (isRepeatedFarm) setCheatAlertMsg('⚠️ 連続出題ペナルティ (-90% SP)');
    else setCheatAlertMsg('');

    setRecentAnsweredWordIds(prev => [...prev.slice(-4), currentWord.id]);

    const prevStat = stats[currentWord.id] || { tested: 0, wrong: 0, streak: 0, reviewStep: 0, nextReviewDate: null };
    const oldStreak = prevStat.streak || 0;
    const newStreak = isCorrect ? (isCheated ? oldStreak : isHintMode ? Math.min(2, oldStreak + 1) : oldStreak + 1) : 0;
    const justMastered = oldStreak < 3 && newStreak >= 3;

    let shieldSaved = false;
    if (!isCorrect && (gameData.shields || 0) > 0) {
      shieldSaved = true;
      setShieldUsedThisTurn(true);
      setGameData(p => ({ ...p, shields: Math.max(0, p.shields - 1) }));
    }

    let calculatedCombo = currentSessionCombo;
    if (isCorrect) {
      if (!isCheated && !isRepeatedFarm) {
        calculatedCombo = currentSessionCombo + 1;
        setCurrentSessionCombo(calculatedCombo);
        if (isEndlessMode) setMaxEndlessCombo(p => Math.max(p, calculatedCombo));
        const feverP = getFeverPhase(calculatedCombo);
        if (calculatedCombo === 10 || calculatedCombo === 25 || calculatedCombo === 50 || calculatedCombo === 100) {
          SoundFX.playFeverUp(feverP);
        }
      }
    } else {
      calculatedCombo = shieldSaved ? Math.floor(currentSessionCombo / 2) : 0;
      setCurrentSessionCombo(calculatedCombo);
    }

    const todayStr = getLocalDateStr();
    const todayAnswered = dailyLogs[todayStr]?.answered || 0;
    const dailyTier = getDailyOverdriveTier(todayAnswered);

    const rewardResult = calculateReward({
      isCorrect,
      isBoss: isBossQuestion,
      justMastered,
      currentCombo: calculatedCombo,
      isSpeedBonus: speedBonusQualified,
      isCheated,
      isRepeatedFarm,
      isHintMode,
      dailyOverdriveMultiplier: dailyTier.multiplier,
      upgrades: gameData.upgrades
    });

    const earnedSP = rewardResult.earnedSP;
    const isJackpot = rewardResult.isJackpot;
    const isCritical = rewardResult.isCritical;

    setEarnedGoldThisTurn(earnedSP);
    setTurnRewardDetail(rewardResult);

    if (earnedSP > 0) {
      setSessionEarnedGold(prev => prev + earnedSP);
      setGameData(prev => ({
        ...prev,
        gold: (prev.gold || 0) + earnedSP,
        totalEarned: (prev.totalEarned || 0) + earnedSP,
        totalCorrectAllTime: isCorrect ? (prev.totalCorrectAllTime || 0) + 1 : prev.totalCorrectAllTime,
        totalBossKills: (isCorrect && isBossQuestion) ? (prev.totalBossKills || 0) + 1 : prev.totalBossKills,
        totalJackpots: isJackpot ? (prev.totalJackpots || 0) + 1 : (prev.totalJackpots || 0)
      }));

      if (isJackpot) {
        setToastNotice(`🎰 JACKPOT ×${rewardResult.jackpotMult}!! +${earnedSP} SP!`);
      } else if (isCritical) {
        setToastNotice(`💥 CRITICAL! +${earnedSP} SP!`);
      } else {
        setToastNotice(`+${earnedSP} SP!`);
      }
    }

    if (isCorrect) {
      SoundFX.vibrate([30]);
      if (isJackpot) {
        SoundFX.playJackpot();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 160, spread: 100, origin: { y: 0.5 } });
        }
      } else if (isCritical) {
        SoundFX.playCritical();
      } else if (speedBonusQualified) {
        SoundFX.playSpeedBonus();
      } else {
        SoundFX.playCorrect();
      }
      if (justMastered) setTimeout(() => SoundFX.playMastered(), 300);
      setAnswerStatus('correct');
      speakWord(currentWord.word);
    } else {
      SoundFX.vibrate([100, 50, 150]);
      SoundFX.playWrong();
      setAnswerStatus('incorrect');
    }

    // 単語統計データの更新
    setStats(prev => {
      const st = prev[currentWord.id] || { tested: 0, wrong: 0, streak: 0, reviewStep: 0, nextReviewDate: null };
      let updatedStep = st.reviewStep || 0;
      let updatedNextDate = st.nextReviewDate;

      if (isBossQuestion) {
        if (isCorrect) {
          updatedStep = Math.min(REVIEW_INTERVAL_DAYS.length - 1, updatedStep + 1);
          const nextDays = REVIEW_INTERVAL_DAYS[updatedStep];
          const d = new Date();
          d.setDate(d.getDate() + nextDays);
          updatedNextDate = d.toISOString();
        } else if (!shieldSaved) {
          updatedStep = 0;
          updatedNextDate = null;
        }
      } else if (justMastered) {
        const nextDays = REVIEW_INTERVAL_DAYS[0];
        const d = new Date();
        d.setDate(d.getDate() + nextDays);
        updatedNextDate = d.toISOString();
      }

      const updatedStreakVal = shieldSaved ? Math.max(0, st.streak - 1) : newStreak;

      return {
        ...prev,
        [currentWord.id]: {
          tested: (st.tested || 0) + 1,
          wrong: isCorrect ? (st.wrong || 0) : (st.wrong || 0) + 1,
          streak: updatedStreakVal,
          reviewStep: updatedStep,
          nextReviewDate: updatedNextDate,
          lastDate: new Date().toISOString()
        }
      };
    });

    setSessionResults(prev => [...prev, {
      word: currentWord,
      userInput: trimmedInput,
      isCorrect,
      isBoss: isBossQuestion,
      earnedSP
    }]);

    if (isCorrect) {
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
        handleNextQuestion();
      }, 700);
    }
  };

  // リベンジ特訓開始
  const startReview = () => {
    const mistakes = sessionResults.filter(r => !r.isCorrect).map(r => r.word);
    const uniqueMistakes = Array.from(new Map(mistakes.map(w => [w.id, w])).values());
    if (uniqueMistakes.length === 0) return;

    setReviewList(uniqueMistakes);
    setReviewIndex(0);
    setReviewStep(0);
    setInputVal('');
    setAnswerStatus(null);
    setIsReviewCompleted(false);
    setScreen('review');
  };

  // リベンジ特訓 次ステップ
  const handleNextReviewStep = useCallback(() => {
    if (reviewStep + 1 < 4) {
      setReviewStep(prev => prev + 1);
      setInputVal('');
      setAnswerStatus(null);
    } else {
      if (reviewIndex + 1 < reviewList.length) {
        setReviewIndex(prev => prev + 1);
        setReviewStep(0);
        setInputVal('');
        setAnswerStatus(null);
      } else {
        SoundFX.playVictory();
        setIsReviewCompleted(true);
        setScreen('result');
      }
    }
  }, [reviewStep, reviewIndex, reviewList]);

  // リベンジ解答提出
  const handleSubmitReview = (e) => {
    e.preventDefault();
    const currentWord = reviewList[reviewIndex];
    if (!currentWord) return;

    const trimmed = inputVal.trim();
    if (!trimmed) return;

    const isCorrect = trimmed.toLowerCase() === currentWord.word.toLowerCase();
    if (isCorrect) {
      SoundFX.vibrate([30]);
      SoundFX.playCorrect();
      setAnswerStatus('correct');
      speakWord(currentWord.word);
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
        handleNextReviewStep();
      }, 700);
    } else {
      SoundFX.vibrate([100, 50, 150]);
      SoundFX.playWrong();
      setAnswerStatus('incorrect');
    }
  };

  // リベンジマスク文字生成
  const maskedHint = useMemo(() => {
    if (screen !== 'review' || !reviewList[reviewIndex]) return '';
    const word = reviewList[reviewIndex].word;
    const len = word.length;
    if (reviewStep === 0) return word;
    if (reviewStep === 3) return '_'.repeat(len);

    const maskCount = reviewStep === 1 ? Math.max(1, Math.floor(len / 3)) : Math.max(1, Math.floor((len * 2) / 3));
    const indices = Array.from({ length: len }, (_, i) => i);
    let seed = 0;
    for (let i = 0; i < word.length; i++) seed += word.charCodeAt(i);
    const random = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
    const shuffled = [...indices].sort(() => random() - 0.5);
    const maskSet = new Set(shuffled.slice(0, maskCount));
    return word.split('').map((char, i) => maskSet.has(i) ? '_' : char).join('');
  }, [screen, reviewList, reviewIndex, reviewStep]);

  // CSVインポート処理
  const handleImportCSV = (textToImport, targetLevel) => {
    try {
      setImportError('');
      const lines = textToImport.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const newEntries = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (i === 0 && (line.toLowerCase().includes('word') || line.includes('単語'))) continue;
        const parts = line.split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
        if (parts.length >= 2) {
          const [w, m, p = '', ex = '', lvl = ''] = parts;
          if (w && m) {
            newEntries.push({
              id: 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
              level: lvl || targetLevel || 'カスタム',
              word: w.toLowerCase(),
              meaning: m,
              pos: p,
              example: ex
            });
          }
        }
      }

      if (newEntries.length === 0) {
        setImportError('インポート可能な単語が見つかりませんでした (例: apple,りんご)');
        return;
      }

      const importedLevels = [...new Set(newEntries.map(e => e.level))];
      setLevels(prev => [...new Set([...prev, ...importedLevels])]);

      setWords(prev => {
        const existingMap = new Set(prev.map(p => p.word.toLowerCase()));
        const filteredNew = newEntries.filter(n => !existingMap.has(n.word));
        return [...prev, ...filteredNew];
      });

      setCsvText('');
      setCustomLevelInput('');
      alert(`${newEntries.length}語を取り込みました！`);
    } catch (err) {
      setImportError('CSV解析エラー: ' + err.message);
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      setCsvText(evt.target.result);
    };
    reader.readAsText(file);
  };

  return (
    <>
      {(() => {
        switch (screen) {
          case 'quiz':
            return (
              <QuizScreen
                turnRewardDetail={turnRewardDetail}
                quizList={quizList}
                currentIndex={currentIndex}
                isEndlessMode={isEndlessMode}
                isBossQuestion={isBossQuestion}
                showBossIntro={showBossIntro}
                toastNotice={toastNotice}
                answerStatus={answerStatus}
                currentSessionCombo={currentSessionCombo}
                sessionEarnedGold={sessionEarnedGold}
                isHintMode={isHintMode}
                setIsHintMode={setIsHintMode}
                inputVal={inputVal}
                setInputVal={setInputVal}
                inputRef={inputRef}
                cheatAlertMsg={cheatAlertMsg}
                showQuitModal={showQuitModal}
                setShowQuitModal={setShowQuitModal}
                handleSubmitAnswer={handleSubmitAnswer}
                handleNextQuestion={handleNextQuestion}
                getFeverPhase={getFeverPhase}
                getFeverDetails={getFeverDetails}
                sessionResults={sessionResults}
                setScreen={setScreen}
              />
            );
          case 'review':
            return (
              <ReviewScreen
                reviewList={reviewList}
                reviewIndex={reviewIndex}
                reviewStep={reviewStep}
                toastNotice={toastNotice}
                answerStatus={answerStatus}
                setAnswerStatus={setAnswerStatus}
                inputVal={inputVal}
                setInputVal={setInputVal}
                inputRef={inputRef}
                maskedHint={maskedHint}
                handleSubmitReview={handleSubmitReview}
                setScreen={setScreen}
              />
            );
          case 'result':
            return (
              <ResultScreen
                sessionResults={sessionResults}
                maxEndlessCombo={maxEndlessCombo}
                currentSessionCombo={currentSessionCombo}
                sessionEarnedGold={sessionEarnedGold}
                isReviewCompleted={isReviewCompleted}
                isEndlessMode={isEndlessMode}
                isWeakMode={isWeakMode}
                toastNotice={toastNotice}
                startReview={startReview}
                startQuiz={startQuiz}
                setScreen={setScreen}
              />
            );
          case 'shop':
            return (
              <ShopScreen
                gameData={gameData}
                setGameData={setGameData}
                SoundFX={SoundFX}
                setScreen={setScreen}
              />
            );
          case 'badges':
            return (
              <BadgesScreen
                gameData={gameData}
                setGameData={setGameData}
                unlockedBadges={unlockedBadges}
                SoundFX={SoundFX}
                setScreen={setScreen}
              />
            );
          case 'stats':
            return (
              <StatsScreen
                words={words}
                stats={stats}
                statsFilter={statsFilter}
                setStatsFilter={setStatsFilter}
                statsSearch={statsSearch}
                setStatsSearch={setStatsSearch}
                getMasteryType={getMasteryType}
                setScreen={setScreen}
              />
            );
          case 'history':
            return (
              <HistoryScreen
                sessionLogs={sessionLogs}
                logDisplayCount={logDisplayCount}
                setLogDisplayCount={setLogDisplayCount}
                setScreen={setScreen}
              />
            );
          case 'analytics':
            return (
              <AnalyticsScreen
                dailyLogs={dailyLogs}
                words={words}
                gameData={gameData}
                dailyLogs={dailyLogs}
                totalMasteredWords={totalMasteredWords}
                setScreen={setScreen}
              />
            );
          case 'import':
            return (
              <ImportScreen
                levels={levels}
                targetLevelForImport={targetLevelForImport}
                setTargetLevelForImport={setTargetLevelForImport}
                customLevelInput={customLevelInput}
                setCustomLevelInput={setCustomLevelInput}
                csvText={csvText}
                setCsvText={setCsvText}
                importError={importError}
                handleImportCSV={handleImportCSV}
                handleFileUpload={handleFileUpload}
                setScreen={setScreen}
              />
            );
          case 'levels':
            return (
              <LevelsScreen
                levels={levels}
                setLevels={setLevels}
                words={words}
                selectedLevel={selectedLevel}
                setSelectedLevel={setSelectedLevel}
                newLevelName={newLevelName}
                setNewLevelName={setNewLevelName}
                newAdminPassInput={newAdminPassInput}
                setNewAdminPassInput={setNewAdminPassInput}
                setAdminPassword={setAdminPassword}
                setScreen={setScreen}
              />
            );
          case 'backup':
            return (
              <BackupScreen
                words={words}
                setWords={setWords}
                levels={levels}
                setLevels={setLevels}
                stats={stats}
                setStats={setStats}
                gameData={gameData}
                setGameData={setGameData}
                dailyLogs={dailyLogs}
                setDailyLogs={setDailyLogs}
                sessionLogs={sessionLogs}
                setSessionLogs={setSessionLogs}
                backupStatus={backupStatus}
                setBackupStatus={setBackupStatus}
                setScreen={setScreen}
              />
            );
          case 'menu':
          default:
            return (
              <MenuScreen
                words={words}
                levels={levels}
                selectedLevel={selectedLevel}
                setSelectedLevel={setSelectedLevel}
                gameData={gameData}
                dailyLogs={dailyLogs}
                isHintMode={isHintMode}
                setIsHintMode={setIsHintMode}
                soundEnabled={soundEnabled}
                setSoundEnabled={setSoundEnabled}
                getMasteryType={getMasteryType}
                isReviewDue={isReviewDue}
                startQuiz={startQuiz}
                requireAdmin={requireAdmin}
                setScreen={setScreen}
              />
            );
        }
      })()}

      <AdminLoginModal
        show={showAdminLoginModal}
        adminInputPass={adminInputPass}
        setAdminInputPass={setAdminInputPass}
        adminLoginError={adminLoginError}
        handleAdminAuthSubmit={handleAdminAuthSubmit}
        onClose={() => setShowAdminLoginModal(false)}
      />
    </>
  );
}


    // Mount App to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    
  </script>
</body>
</html>
